<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet">
  <title>BER role-safe add-only 的特征时钟与角色组合 DAG</title>
  <desc>机制示意：completed 10-second BER feature 被 hold 并由 completed one-second callback 采样，global 与 bypass quotes 根据 inventory role 混合；下方展示冻结 40 日 mechanics 与 economics。</desc>
  <rect width="1200" height="720" fill="#07111f"/>
  <text x="52" y="55" fill="#f4f7fb" font-size="28" font-family="sans-serif" font-weight="700">BER Add-Only：相同 Signal，不同 Role Mapping</text><text x="52" y="84" fill="#9fb3c8" font-size="16" font-family="sans-serif">机制示意 · completed 10s feature held → completed 1s callback sample</text>
  <rect x="55" y="125" width="245" height="90" rx="15" fill="#102238" stroke="#42a5f5" stroke-width="2"/><text x="82" y="160" fill="#9fd8ff" font-size="18" font-family="sans-serif" font-weight="700">BER clock</text><text x="82" y="189" fill="#d6e9f7" font-size="15" font-family="sans-serif">threshold 1.2 · multiplier 2.0</text>
  <path d="M300 170H375" stroke="#657b91" stroke-width="3"/>
  <rect x="375" y="115" width="230" height="110" rx="15" fill="#2d2713" stroke="#f8c15c" stroke-width="2"/><text x="402" y="150" fill="#ffd17c" font-size="18" font-family="sans-serif" font-weight="700">同一 decision snapshot</text><text x="402" y="179" fill="#fff0c9" font-size="15" font-family="sans-serif">global BER quote</text><text x="402" y="204" fill="#fff0c9" font-size="15" font-family="sans-serif">exact bypass quote</text>
  <path d="M605 170H680" stroke="#657b91" stroke-width="3"/>
  <rect x="680" y="105" width="245" height="130" rx="15" fill="#102238" stroke="#657b91" stroke-width="2"/><text x="708" y="140" fill="#eaf2fb" font-size="18" font-family="sans-serif" font-weight="700">decision-pre role</text><text x="708" y="169" fill="#9fb3c8" font-size="15" font-family="sans-serif">add → BER</text><text x="708" y="194" fill="#9fb3c8" font-size="15" font-family="sans-serif">opener / reducing → bypass</text><text x="708" y="219" fill="#9fb3c8" font-size="15" font-family="sans-serif">cross-zero → control</text>
  <path d="M925 170H990" stroke="#657b91" stroke-width="3"/>
  <rect x="990" y="125" width="155" height="90" rx="15" fill="#0d2c28" stroke="#41d69a" stroke-width="2"/><text x="1015" y="160" fill="#63deb0" font-size="18" font-family="sans-serif" font-weight="700">mixed quote</text><text x="1015" y="189" fill="#d5eee6" font-size="14" font-family="sans-serif">cap 只可移动 add</text>
  <rect x="55" y="295" width="1090" height="155" rx="17" fill="#0e1c2d"/><text x="83" y="332" fill="#eaf2fb" font-size="19" font-family="sans-serif" font-weight="700">40 日 mechanics</text><text x="83" y="367" fill="#9fd8ff" font-size="16" font-family="sans-serif">172,328 effective side-price changes · 14.96%</text><text x="83" y="399" fill="#9fb3c8" font-size="15" font-family="sans-serif">BUY 82,682 / SELL 89,646 · each 40 days · Python/C++ / BER-state / source mismatch = 0</text><text x="83" y="428" fill="#9fb3c8" font-size="15" font-family="sans-serif">canonical common-requote denominator；不能由 treatment-dependent fills 重建</text>
  <rect x="55" y="490" width="1090" height="175" rx="17" fill="#0e1c2d"/><text x="83" y="527" fill="#eaf2fb" font-size="19" font-family="sans-serif" font-weight="700">40 日 economics</text><text x="83" y="563" fill="#ff9ca5" font-size="16" font-family="sans-serif">terminal MTM：-144.2517 → -155.9180，Δ = -11.6663 USDC</text><text x="83" y="596" fill="#ff9ca5" font-size="16" font-family="sans-serif">paired Δ/day = -0.2917，95% CI [-1.1439,+0.6813]，13/40 days improve</text><text x="83" y="629" fill="#63deb0" font-size="16" font-family="sans-serif">fills +13.85%；q10 / CVaR / MAE / inventory proxies 改善</text><text x="745" y="629" fill="#f4f7fb" font-size="17" font-family="sans-serif" font-weight="700">proxy ≠ terminal value</text>
</svg>
