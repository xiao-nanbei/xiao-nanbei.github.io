<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Individual trade 与 aggregate parent 双时钟</title>
  <desc id="desc">展示多个 individual child 在 exchange time 发生，聚合为 parent slice，并在 receive 和 feature-ready 后才对策略可见。</desc>
  <rect width="960" height="520" fill="#0b1120"/>
  <text x="44" y="48" fill="#f6f8ff" font-size="24" font-family="sans-serif">撮合真相与策略可见性的双时钟</text>
  <text x="48" y="115" fill="#9fb4d4" font-size="18" font-family="sans-serif">exchange-time</text>
  <line x1="175" y1="110" x2="900" y2="110" stroke="#65758e" stroke-width="2"/>
  <g fill="#ffcf66"><circle cx="270" cy="110" r="10"/><circle cx="355" cy="110" r="10"/><circle cx="440" cy="110" r="10"/><circle cx="525" cy="110" r="10"/></g>
  <text x="238" y="151" fill="#ffdb8f" font-size="16" font-family="sans-serif">child f</text><text x="486" y="151" fill="#ffdb8f" font-size="16" font-family="sans-serif">child l</text>
  <path d="M270 170 C320 230 475 230 525 170" fill="none" stroke="#73b7ff" stroke-width="3"/>
  <rect x="318" y="215" width="175" height="64" rx="12" fill="#17243a" stroke="#73b7ff"/>
  <text x="346" y="253" fill="#cce2ff" font-size="18" font-family="sans-serif">live parent slice</text>
  <text x="48" y="354" fill="#9fb4d4" font-size="18" font-family="sans-serif">policy-time</text>
  <line x1="175" y1="350" x2="900" y2="350" stroke="#65758e" stroke-width="2"/>
  <circle cx="610" cy="350" r="11" fill="#ff8f9e"/><text x="560" y="392" fill="#ffb8c1" font-size="16" font-family="sans-serif">receive</text>
  <circle cx="715" cy="350" r="11" fill="#48d68b"/><text x="665" y="392" fill="#8cebb6" font-size="16" font-family="sans-serif">feature-ready</text>
  <path d="M493 248 L705 336" stroke="#48d68b" stroke-width="4" marker-end="url(#m)"/>
  <rect x="650" y="74" width="240" height="118" rx="12" fill="#151d30" stroke="#ffcf66"/>
  <text x="670" y="108" fill="#ffe5a8" font-size="16" font-family="sans-serif">queue outcome：child clock</text>
  <text x="670" y="138" fill="#ffe5a8" font-size="16" font-family="sans-serif">policy feature：parent ready</text>
  <text x="670" y="168" fill="#ffe5a8" font-size="16" font-family="sans-serif">finalized parent 可继续扩展</text>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#48d68b"/></marker></defs>
</svg>
