<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="994" viewBox="0 0 1100 994" role="img" aria-labelledby="title desc">
  <title id="title">Causal 13-Head：模型复杂度上升，证据门没有下降</title>
  <desc id="desc">同一研究主线中的五个阶段分别暴露 timing、transport、support 与 economics 问题。没有一个阶段同时通过 prediction、implementation、action-path 与 terminal economics。 未来 successor 必须先声明新的状态、模型、动作和 reward。 研究支持：方法与失败定位 · model/action/live authority=false</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#98a2b3"/></marker>
    <style>
      .bg{fill:#fbfcfe}.card{fill:#fff;stroke:#d0d5dd;stroke-width:1.2}.connector{fill:none;stroke:#98a2b3;stroke-width:1.6;marker-end:url(#arrow)}
      .title{font:600 24px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#101828}.subtitle{font:400 13px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475467}
      .stage{font:600 17px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#101828}.result{font:500 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#344054}.metric{font:400 12px ui-monospace,SFMono-Regular,Menlo,"PingFang SC",monospace;fill:#667085}
      .pill{font:600 13px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.index{font:600 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.take-title{font:600 17px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#175cd3}.take{font:500 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#344054}.authority{font:500 12px ui-monospace,SFMono-Regular,Menlo,"PingFang SC",monospace;fill:#b42318}
    </style>
  </defs>
  <rect class="bg" width="1100" height="994"/>
  <text class="title" x="42" y="44">Causal 13-Head：模型复杂度上升，证据门没有下降</text>
  <text class="subtitle" x="42" y="70">同一研究主线中的五个阶段分别暴露 timing、transport、support 与 economics 问题</text>
  <line x1="42" y1="92" x2="1058" y2="92" stroke="#eaecf0" stroke-width="1"/>
<path class="connector" d="M112 250 V269"/>
  <rect class="card" x="62" y="142" width="976" height="108" rx="11"/>
  <rect x="62" y="142" width="8" height="108" rx="4" fill="#667085"/>
  <circle cx="112" cy="174" r="18" fill="#f2f4f7" stroke="#667085" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="180" fill="#344054">1</text>
  <text class="stage" x="150" y="176">v4 · Empirical P3 重训</text>
  <rect x="888" y="158" width="122" height="32" rx="16" fill="#f2f4f7" stroke="#667085" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="179" fill="#344054">撤回</text>
  <text class="result" x="150" y="205">三天 future-metric feature 提前可见，test authority 失效</text>
  <text class="metric" x="150" y="230">模型与 BUY scorer 不得 promotion；旧经济数字撤回</text>
<path class="connector" d="M112 382 V401"/>
  <rect class="card" x="62" y="274" width="976" height="108" rx="11"/>
  <rect x="62" y="274" width="8" height="108" rx="4" fill="#f04438"/>
  <circle cx="112" cy="306" r="18" fill="#fef3f2" stroke="#f04438" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="312" fill="#b42318">2</text>
  <text class="stage" x="150" y="308">v5 · Normalized 100ms</text>
  <rect x="888" y="290" width="122" height="32" rx="16" fill="#fef3f2" stroke="#f04438" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="311" fill="#b42318">关闭</text>
  <text class="result" x="150" y="337">若干 heads 有 ranking，但 ML-ON 没有稳定经济优势</text>
  <text class="metric" x="150" y="362">prediction ≠ paired full-path value</text>
<path class="connector" d="M112 514 V533"/>
  <rect class="card" x="62" y="406" width="976" height="108" rx="11"/>
  <rect x="62" y="406" width="8" height="108" rx="4" fill="#f04438"/>
  <circle cx="112" cy="438" r="18" fill="#fef3f2" stroke="#f04438" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="444" fill="#b42318">3</text>
  <text class="stage" x="150" y="440">v9 · Taker Tempo</text>
  <rect x="888" y="422" width="122" height="32" rx="16" fill="#fef3f2" stroke="#f04438" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="443" fill="#b42318">关闭</text>
  <text class="result" x="150" y="469">formal replay 只剩三日且三日 raw delta 全负</text>
  <text class="metric" x="150" y="494">ML-ON − ML-OFF raw PnL = −2.2308 USDC</text>
<path class="connector" d="M112 646 V665"/>
  <rect class="card" x="62" y="538" width="976" height="108" rx="11"/>
  <rect x="62" y="538" width="8" height="108" rx="4" fill="#f04438"/>
  <circle cx="112" cy="570" r="18" fill="#fef3f2" stroke="#f04438" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="576" fill="#b42318">4</text>
  <text class="stage" x="150" y="572">v12 · Source-aware</text>
  <rect x="888" y="554" width="122" height="32" rx="16" fill="#fef3f2" stroke="#f04438" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="575" fill="#b42318">关闭</text>
  <text class="result" x="150" y="601">跨源语义修复后只通过 5/13 heads</text>
  <text class="metric" x="150" y="626">joint prediction gate 与 full-path screen 均未闭合</text>

  <rect class="card" x="62" y="670" width="976" height="108" rx="11"/>
  <rect x="62" y="670" width="8" height="108" rx="4" fill="#f04438"/>
  <circle cx="112" cy="702" r="18" fill="#fef3f2" stroke="#f04438" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="708" fill="#b42318">5</text>
  <text class="stage" x="150" y="704">一秒 cadence successor</text>
  <rect x="888" y="686" width="122" height="32" rx="16" fill="#fef3f2" stroke="#f04438" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="707" fill="#b42318">关闭</text>
  <text class="result" x="150" y="733">更新更快确实改变路径，却减少成交并恶化库存时间与 tail</text>
  <text class="metric" x="150" y="758">cadence lever present；economic gate failed</text>
  <rect x="62" y="818" width="976" height="112" rx="11" fill="#eff8ff" stroke="#84caff" stroke-width="1.2"/>
  <text class="take-title" x="88" y="849">合并后的读法</text>
  <text class="take" x="88" y="876">• 没有一个阶段同时通过 prediction、implementation、action-path 与 terminal economics。</text>
  <text class="take" x="88" y="902">• 未来 successor 必须先声明新的状态、模型、动作和 reward。</text>
  <text class="authority" text-anchor="middle" x="550" y="960">研究支持：方法与失败定位 · model/action/live authority=false</text>
</svg>
