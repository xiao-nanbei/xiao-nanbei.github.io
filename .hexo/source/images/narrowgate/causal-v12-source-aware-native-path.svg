<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Causal-v12 source-aware训练到native经济筛选</title>
  <desc id="desc">研究链示意与冻结聚合结果。二零二五source-aware训练经过二零二六native prediction transport和五日ML OFF ON回放，最终只有五个头通过且经济硬门失败。</desc>
  <defs><linearGradient id="bg"><stop stop-color="#071426"/><stop offset="1" stop-color="#1d304f"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc"/></marker><style>.t{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#eef6ff}.m{fill:#a9bad0}.box{fill:#0a1d33;stroke:#3a5d79}.arr{stroke:#7dd3fc;stroke-width:3;marker-end:url(#a)}.big{font-size:27px;font-weight:700}.label{font-size:17px}.small{font-size:14px}</style></defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="52" y="53" class="t big">Causal-v12：上游 transport gate 不能被正 PnL 点估计买穿</text><text x="52" y="82" class="m small">研究链示意与 post-fit 五日冻结聚合结果</text>
  <g transform="translate(50 125)">
    <rect width="240" height="125" rx="14" class="box"/><text x="18" y="35" class="t label">2025 source-aware training</text><text x="18" y="70" class="m small">52 fit + 1 embargo + 13 select</text><text x="18" y="99" class="m small">66-day refit · 13 heads</text>
    <line x1="248" y1="62" x2="308" y2="62" class="arr"/>
    <rect x="320" width="240" height="125" rx="14" class="box"/><text x="338" y="35" class="t label">2026 native transport</text><text x="338" y="70" class="m small">historical 22 + 22 days</text><text x="338" y="99" class="m small">ranking / probability / scale</text>
    <line x1="568" y1="62" x2="628" y2="62" class="arr"/>
    <rect x="640" width="240" height="125" rx="14" fill="#351c2c" stroke="#ff6b6b"/><text x="658" y="35" class="t label">Prediction hard gate</text><text x="658" y="75" fill="#ff8f8f" class="label">仅 5 / 13 heads 通过</text><text x="658" y="102" class="m small">absolute probability / vol scale fail</text>
    <line x1="888" y1="62" x2="948" y2="62" class="arr"/>
    <rect x="960" width="190" height="125" rx="14" class="box"/><text x="978" y="35" class="t label">五日 full path</text><text x="978" y="70" class="m small">ML OFF vs ON</text><text x="978" y="99" class="m small">Grade A primary</text>
  </g>
  <g transform="translate(50 305)">
    <rect width="1100" height="155" rx="14" class="box"/>
    <rect x="20" y="52" width="250" height="78" rx="12" fill="#12352e"/><text x="38" y="81" class="m small">Terminal point estimate</text><text x="38" y="111" fill="#6ee7b7" class="label">+6.0334 USDC</text>
    <rect x="290" y="52" width="250" height="78" rx="12" fill="#351c2c"/><text x="308" y="81" class="m small">Mean 95% CI</text><text x="308" y="111" fill="#ff8f8f" class="label">[-0.2435,+2.5635]</text>
    <rect x="560" y="52" width="250" height="78" rx="12" fill="#351c2c"/><text x="578" y="81" class="m small">Fill retention</text><text x="578" y="111" fill="#ff8f8f" class="label">84.20%（低于 90%）</text>
    <rect x="830" y="52" width="250" height="78" rx="12" fill="#351c2c"/><text x="848" y="81" class="m small">Tail / SELL gate</text><text x="848" y="111" fill="#ff8f8f" class="label">q10、CVaR、SELL fail</text>
  </g>
  <rect x="50" y="505" width="1100" height="76" rx="14" fill="#102a43"/><text x="74" y="536" class="t label">Canonical decision：close historical native economic screen · ranking score = null</text><text x="74" y="562" class="m small">五日是 family-specific post-fit OOS，不是 globally unseen 或 sealed holdout。</text>
</svg>
