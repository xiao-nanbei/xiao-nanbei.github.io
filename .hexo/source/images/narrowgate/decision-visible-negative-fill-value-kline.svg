<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">决策时可见负成交价值研究的 K 线与标签边界</title>
  <desc id="desc">合成 K 线机制图。左侧是决策前可见盘口与 库存生命周期 特征，决策线后发生成交、库存路径与 库存生命周期 terminal；图明确表示未来只构成标签，不能作为决策输入。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16263e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#8bd5ff"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <text x="54" y="55" fill="#f6f8ff" font-size="28" font-family="sans-serif" font-weight="700">Decision-visible fill value：输入在左，标签在右</text>
  <text x="54" y="88" fill="#9db0c9" font-size="16" font-family="sans-serif">合成机制示意 · 非实盘行情 · 非交易建议</text>
  <line x1="70" y1="430" x2="1130" y2="430" stroke="#40536c" stroke-width="2"/>
  <g stroke-width="4">
    <line x1="110" y1="330" x2="110" y2="405" stroke="#7ee2a8"/><rect x="98" y="350" width="24" height="35" fill="#7ee2a8"/>
    <line x1="165" y1="300" x2="165" y2="380" stroke="#7ee2a8"/><rect x="153" y="320" width="24" height="38" fill="#7ee2a8"/>
    <line x1="220" y1="285" x2="220" y2="360" stroke="#ff8f91"/><rect x="208" y="305" width="24" height="33" fill="#ff8f91"/>
    <line x1="275" y1="255" x2="275" y2="342" stroke="#7ee2a8"/><rect x="263" y="278" width="24" height="40" fill="#7ee2a8"/>
    <line x1="330" y1="250" x2="330" y2="330" stroke="#ff8f91"/><rect x="318" y="272" width="24" height="36" fill="#ff8f91"/>
    <line x1="385" y1="230" x2="385" y2="310" stroke="#7ee2a8"/><rect x="373" y="250" width="24" height="38" fill="#7ee2a8"/>
    <line x1="440" y1="242" x2="440" y2="326" stroke="#ff8f91"/><rect x="428" y="260" width="24" height="42" fill="#ff8f91"/>
    <line x1="510" y1="270" x2="510" y2="360" stroke="#ff8f91"/><rect x="498" y="290" width="24" height="45" fill="#ff8f91"/>
    <line x1="575" y1="300" x2="575" y2="392" stroke="#ff8f91"/><rect x="563" y="320" width="24" height="48" fill="#ff8f91"/>
    <line x1="640" y1="292" x2="640" y2="380" stroke="#7ee2a8"/><rect x="628" y="315" width="24" height="40" fill="#7ee2a8"/>
    <line x1="705" y1="335" x2="705" y2="420" stroke="#ff8f91"/><rect x="693" y="350" width="24" height="45" fill="#ff8f91"/>
    <line x1="770" y1="360" x2="770" y2="445" stroke="#ff8f91"/><rect x="758" y="378" width="24" height="42" fill="#ff8f91"/>
    <line x1="835" y1="340" x2="835" y2="425" stroke="#7ee2a8"/><rect x="823" y="365" width="24" height="38" fill="#7ee2a8"/>
    <line x1="900" y1="375" x2="900" y2="458" stroke="#ff8f91"/><rect x="888" y="392" width="24" height="42" fill="#ff8f91"/>
    <line x1="965" y1="352" x2="965" y2="440" stroke="#7ee2a8"/><rect x="953" y="380" width="24" height="36" fill="#7ee2a8"/>
    <line x1="1030" y1="330" x2="1030" y2="420" stroke="#7ee2a8"/><rect x="1018" y="355" width="24" height="40" fill="#7ee2a8"/>
  </g>
  <rect x="68" y="112" width="420" height="94" rx="14" fill="#152f46" stroke="#3b91c4"/>
  <text x="88" y="142" fill="#dff5ff" font-size="18" font-family="sans-serif" font-weight="700">决策前可见输入</text>
  <text x="88" y="170" fill="#b8cee0" font-size="15" font-family="sans-serif">inventory · 库存生命周期 age/MAE · quote distance</text>
  <text x="88" y="192" fill="#b8cee0" font-size="15" font-family="sans-serif">queue availability · microprice · L2 refresh/cancel · flow</text>
  <line x1="485" y1="108" x2="485" y2="500" stroke="#ffd166" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="454" y="530" fill="#ffd166" font-size="17" font-family="sans-serif" font-weight="700">decision / submit cutoff</text>
  <circle cx="575" cy="368" r="12" fill="#ffd166"/>
  <text x="595" y="373" fill="#fff2c4" font-size="17" font-family="sans-serif">first ADD / opener fill</text>
  <path d="M590 388 C680 470 790 490 900 445" fill="none" stroke="#8bd5ff" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="785" y="120" width="340" height="105" rx="14" fill="#35253d" stroke="#ca86e8"/>
  <text x="805" y="151" fill="#f5e5ff" font-size="18" font-family="sans-serif" font-weight="700">未来只用于标签</text>
  <text x="805" y="180" fill="#d9c0e8" font-size="15" font-family="sans-serif">fills → inventory path → reducing fills</text>
  <text x="805" y="203" fill="#d9c0e8" font-size="15" font-family="sans-serif">库存生命周期 terminal equity − decision equity</text>
  <rect x="860" y="472" width="255" height="72" rx="12" fill="#202b3a" stroke="#8bd5ff"/>
  <text x="880" y="501" fill="#dff5ff" font-size="17" font-family="sans-serif" font-weight="700">Y：terminal USDC value</text>
  <text x="880" y="528" fill="#9db0c9" font-size="14" font-family="sans-serif">负平均值 ≠ 已识别可执行动作</text>
</svg>
