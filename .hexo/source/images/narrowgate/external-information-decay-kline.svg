<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">外部信息从一秒到十八秒的衰减曲线</title>
  <desc id="desc">左侧机制 K 线显示外部市场先动和本地市场滞后，右侧冻结 Development 曲线显示 M1 减 M0 的日均 AUC 增量在一秒最高并随 horizon 总体衰减。</desc>
  <rect width="1200" height="620" fill="#08111f"/>
  <text x="54" y="48" fill="#f4f7fb" font-size="25" font-family="system-ui,sans-serif" font-weight="700">External Information Decay · 1–18s</text>
  <text x="54" y="76" fill="#9fb3c8" font-size="14" font-family="system-ui,sans-serif">冻结聚合结果 + 机制示意 · day-cluster simultaneous band</text>
  <g transform="translate(54 112)">
    <rect width="432" height="390" rx="16" fill="#0d1b2d" stroke="#27415f"/>
    <text x="22" y="32" fill="#dce7f4" font-size="16" font-family="system-ui,sans-serif" font-weight="650">外部先动，本地滞后</text>
    <line x1="38" y1="332" x2="405" y2="332" stroke="#36516f"/>
    <line x1="38" y1="60" x2="38" y2="332" stroke="#36516f"/>
    <polyline points="46,278 92,270 138,276 184,210 230,160 276,138 322,126 368,120 401,117" fill="none" stroke="#58d6c7" stroke-width="4"/>
    <polyline points="46,286 92,281 138,282 184,276 230,260 276,210 322,174 368,151 401,141" fill="none" stroke="#7aa2f7" stroke-width="4"/>
    <g stroke="#dce7f4" stroke-width="2">
      <line x1="137" y1="258" x2="137" y2="294"/><rect x="130" y="267" width="14" height="18" fill="#58d6c7"/>
      <line x1="183" y1="190" x2="183" y2="229"/><rect x="176" y="201" width="14" height="18" fill="#58d6c7"/>
      <line x1="229" y1="145" x2="229" y2="176"/><rect x="222" y="153" width="14" height="16" fill="#58d6c7"/>
      <line x1="275" y1="192" x2="275" y2="228"/><rect x="268" y="202" width="14" height="17" fill="#7aa2f7"/>
      <line x1="321" y1="157" x2="321" y2="191"/><rect x="314" y="166" width="14" height="17" fill="#7aa2f7"/>
    </g>
    <line x1="184" y1="68" x2="184" y2="332" stroke="#f5a65b" stroke-dasharray="6 6"/>
    <line x1="276" y1="68" x2="276" y2="332" stroke="#f5a65b" stroke-dasharray="6 6"/>
    <text x="194" y="88" fill="#f5c286" font-size="13" font-family="system-ui,sans-serif">外部创新</text>
    <text x="286" y="108" fill="#f5c286" font-size="13" font-family="system-ui,sans-serif">本地吸收</text>
    <circle cx="54" cy="358" r="5" fill="#58d6c7"/><text x="66" y="363" fill="#a8bfd3" font-size="13" font-family="system-ui,sans-serif">external</text>
    <circle cx="155" cy="358" r="5" fill="#7aa2f7"/><text x="167" y="363" fill="#a8bfd3" font-size="13" font-family="system-ui,sans-serif">local BTCUSDC</text>
  </g>
  <g transform="translate(520 112)">
    <rect width="626" height="390" rx="16" fill="#0d1b2d" stroke="#27415f"/>
    <text x="22" y="32" fill="#dce7f4" font-size="16" font-family="system-ui,sans-serif" font-weight="650">M1 − M0 mean daily AUC gain</text>
    <line x1="58" y1="326" x2="595" y2="326" stroke="#36516f"/>
    <line x1="58" y1="62" x2="58" y2="326" stroke="#36516f"/>
    <line x1="58" y1="245" x2="595" y2="245" stroke="#69424c" stroke-dasharray="5 6"/>
    <text x="12" y="250" fill="#b37a86" font-size="12" font-family="system-ui,sans-serif">0</text>
    <polyline points="76,82 106,99 136,139 166,122 196,151 226,186 256,196 286,213 316,247 346,226 376,235 406,244 436,252 466,247 496,254 526,258 556,248 586,251" fill="none" stroke="#58d6c7" stroke-width="4"/>
    <polyline points="76,164 106,179 136,210 166,194 196,220 226,237 256,243 286,252 316,281 346,268 376,273 406,280 436,286 466,284 496,288 526,293 556,285 586,290" fill="none" stroke="#f5a65b" stroke-width="2" stroke-dasharray="6 5"/>
    <circle cx="76" cy="82" r="7" fill="#58d6c7" stroke="#d8fff9" stroke-width="2"/>
    <text x="87" y="78" fill="#d8fff9" font-size="13" font-family="system-ui,sans-serif">1s +0.002910</text>
    <text x="87" y="98" fill="#f5c286" font-size="12" font-family="system-ui,sans-serif">LCB +0.001393</text>
    <rect x="68" y="304" width="198" height="28" fill="#163a36" opacity="0.7"/>
    <text x="84" y="322" fill="#8ce5da" font-size="12" font-family="system-ui,sans-serif">1–7s simultaneous LCB &gt; 0</text>
    <g fill="#8fa8bf" font-size="12" font-family="system-ui,sans-serif">
      <text x="72" y="350">1</text><text x="130" y="350">3</text><text x="190" y="350">5</text><text x="250" y="350">7</text><text x="310" y="350">9</text><text x="367" y="350">11</text><text x="427" y="350">13</text><text x="487" y="350">15</text><text x="572" y="350">18s</text>
    </g>
    <text x="394" y="76" fill="#9fb3c8" font-size="12" font-family="system-ui,sans-serif">实线：mean</text>
    <text x="394" y="96" fill="#f5c286" font-size="12" font-family="system-ui,sans-serif">虚线：simultaneous LCB</text>
  </g>
  <rect x="54" y="526" width="1092" height="48" rx="12" fill="#132339" stroke="#2a4868"/>
  <text x="76" y="556" fill="#c7d7e8" font-size="14" font-family="system-ui,sans-serif">1s 是 archive 分辨率边界，不是已证明的亚秒最优点；prediction evidence ≠ quote action authority</text>
  <text x="1001" y="602" fill="#617993" font-size="12" font-family="system-ui,sans-serif">冻结聚合结果 / 机制示意</text>
</svg>
