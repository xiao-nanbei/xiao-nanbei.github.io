<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1126" viewBox="0 0 1100 1126" role="img" aria-labelledby="title desc">
  <title id="title">外部市场研究：信息坐标可建立，交易动作仍需独立证明</title>
  <desc id="desc">Bitget、Bybit、OKX 的领先信息经过 basis、可见时钟与订单生命周期后逐层收缩。外部市场是有用的信息源，但不是免费动作。 从 fair coordinate 到 maker action 必须重新通过 receive-time、LOO、lifecycle 与 terminal reward。 研究支持：coordinate / short-horizon prediction · action=false · live=false</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#98a2b3"/></marker>
    <style>
      .bg{fill:#fbfcfe}.card{fill:#fff;stroke:#d0d5dd;stroke-width:1.2}.connector{fill:none;stroke:#98a2b3;stroke-width:1.6;marker-end:url(#arrow)}
      .title{font:600 24px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#101828}.subtitle{font:400 13px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475467}
      .stage{font:600 17px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#101828}.result{font:500 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#344054}.metric{font:400 12px ui-monospace,SFMono-Regular,Menlo,"PingFang SC",monospace;fill:#667085}
      .pill{font:600 13px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.index{font:600 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.take-title{font:600 17px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#175cd3}.take{font:500 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#344054}.authority{font:500 12px ui-monospace,SFMono-Regular,Menlo,"PingFang SC",monospace;fill:#b42318}
    </style>
  </defs>
  <rect class="bg" width="1100" height="1126"/>
  <text class="title" x="42" y="44">外部市场研究：信息坐标可建立，交易动作仍需独立证明</text>
  <text class="subtitle" x="42" y="70">Bitget、Bybit、OKX 的领先信息经过 basis、可见时钟与订单生命周期后逐层收缩</text>
  <line x1="42" y1="92" x2="1058" y2="92" stroke="#eaecf0" stroke-width="1"/>
<path class="connector" d="M112 250 V269"/>
  <rect class="card" x="62" y="142" width="976" height="108" rx="11"/>
  <rect x="62" y="142" width="8" height="108" rx="4" fill="#2e90fa"/>
  <circle cx="112" cy="174" r="18" fill="#eff8ff" stroke="#2e90fa" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="180" fill="#175cd3">1</text>
  <text class="stage" x="150" y="176">Global Reference Stage 0</text>
  <rect x="888" y="158" width="122" height="32" rx="16" fill="#eff8ff" stroke="#2e90fa" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="179" fill="#175cd3">仅预测</text>
  <text class="result" x="150" y="205">三 venue 状态存在可复核的短时线索</text>
  <text class="metric" x="150" y="230">SELL submit 1s 约 +0.05 至 +0.10 bps；prediction only</text>
<path class="connector" d="M112 382 V401"/>
  <rect class="card" x="62" y="274" width="976" height="108" rx="11"/>
  <rect x="62" y="274" width="8" height="108" rx="4" fill="#2e90fa"/>
  <circle cx="112" cy="306" r="18" fill="#eff8ff" stroke="#2e90fa" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="312" fill="#175cd3">2</text>
  <text class="stage" x="150" y="308">External information decay</text>
  <rect x="888" y="290" width="122" height="32" rx="16" fill="#eff8ff" stroke="#2e90fa" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="311" fill="#175cd3">仅预测</text>
  <text class="result" x="150" y="337">外部 innovation 的增量主要存活于 1–7 秒</text>
  <text class="metric" x="150" y="362">更长 horizon 不保持同一强度</text>
<path class="connector" d="M112 514 V533"/>
  <rect class="card" x="62" y="406" width="976" height="108" rx="11"/>
  <rect x="62" y="406" width="8" height="108" rx="4" fill="#039855"/>
  <circle cx="112" cy="438" r="18" fill="#ecfdf3" stroke="#039855" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="444" fill="#027a48">3</text>
  <text class="stage" x="150" y="440">Causal fair price</text>
  <rect x="888" y="422" width="122" height="32" rx="16" fill="#ecfdf3" stroke="#039855" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="443" fill="#027a48">保留</text>
  <text class="result" x="150" y="469">past-only basis、2-of-3 与 weighted median 构成稳健坐标</text>
  <text class="metric" x="150" y="494">coordinate / mechanics evidence；不是 alpha</text>
<path class="connector" d="M112 646 V665"/>
  <rect class="card" x="62" y="538" width="976" height="108" rx="11"/>
  <rect x="62" y="538" width="8" height="108" rx="4" fill="#f79009"/>
  <circle cx="112" cy="570" r="18" fill="#fffaeb" stroke="#f79009" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="576" fill="#b54708">4</text>
  <text class="stage" x="150" y="572">First-add M0 / M1</text>
  <rect x="888" y="554" width="122" height="32" rx="16" fill="#fffaeb" stroke="#f79009" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="575" fill="#b54708">阻塞</text>
  <text class="result" x="150" y="601">receive-time 特征可构造，但 exact common lifecycle rows 不足</text>
  <text class="metric" x="150" y="626">数量门完成；价值模型阻塞</text>
<path class="connector" d="M112 778 V797"/>
  <rect class="card" x="62" y="670" width="976" height="108" rx="11"/>
  <rect x="62" y="670" width="8" height="108" rx="4" fill="#f79009"/>
  <circle cx="112" cy="702" r="18" fill="#fffaeb" stroke="#f79009" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="708" fill="#b54708">5</text>
  <text class="stage" x="150" y="704">Adverse-edge guard</text>
  <rect x="888" y="686" width="122" height="32" rx="16" fill="#fffaeb" stroke="#f79009" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="707" fill="#b54708">阻塞</text>
  <text class="result" x="150" y="733">外部 adverse edge 能映射为 exposure quote 外移</text>
  <text class="metric" x="150" y="758">candidate support 太低，无法打开经济实验</text>

  <rect class="card" x="62" y="802" width="976" height="108" rx="11"/>
  <rect x="62" y="802" width="8" height="108" rx="4" fill="#f04438"/>
  <circle cx="112" cy="834" r="18" fill="#fef3f2" stroke="#f04438" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="840" fill="#b42318">6</text>
  <text class="stage" x="150" y="836">Fair-center randomized action</text>
  <rect x="888" y="818" width="122" height="32" rx="16" fill="#fef3f2" stroke="#f04438" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="839" fill="#b42318">关闭</text>
  <text class="result" x="150" y="865">整对报价平移进入完整路径，primary interval 跨零且依赖 venue</text>
  <text class="metric" x="150" y="890">可执行动作已测试；没有稳定 uplift</text>
  <rect x="62" y="950" width="976" height="112" rx="11" fill="#eff8ff" stroke="#84caff" stroke-width="1.2"/>
  <text class="take-title" x="88" y="981">合并后的读法</text>
  <text class="take" x="88" y="1008">• 外部市场是有用的信息源，但不是免费动作。</text>
  <text class="take" x="88" y="1034">• 从 fair coordinate 到 maker action 必须重新通过 receive-time、LOO、lifecycle 与 terminal reward。</text>
  <text class="authority" text-anchor="middle" x="550" y="1092">研究支持：coordinate / short-horizon prediction · action=false · live=false</text>
</svg>
