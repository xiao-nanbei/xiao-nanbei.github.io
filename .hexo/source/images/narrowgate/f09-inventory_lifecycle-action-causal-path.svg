<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">库存生命周期 action uplift 的完整因果路径</title>
  <desc id="desc">从未处理基线机会、一次随机分配、报价或权限动作，到订单生命周期、库存反馈、修复路径与 库存生命周期 terminal；并列显示机械、参与、风险和经济四道门。</desc>
  <defs><linearGradient id="bg9" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1527"/><stop offset="1" stop-color="#182943"/></linearGradient><marker id="a9" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8da7c9"/></marker><style>.h9{font:700 28px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f2f6ff}.t9{font:600 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#edf3ff}.s9{font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#b3c5dd}.b9{fill:#142c49;stroke:#5275a1;stroke-width:2}.g9{fill:#153b38;stroke:#3bc6a5;stroke-width:2}.w9{fill:#49341c;stroke:#efae4f;stroke-width:2}.p9{fill:#3c2947;stroke:#b582db;stroke-width:2}.l9{stroke:#8da7c9;stroke-width:2;marker-end:url(#a9)}</style></defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg9)"/>
  <text x="50" y="55" class="h9">一项 库存生命周期 action 必须沿整条状态递归计算，而不是删一行成交</text>
  <text x="50" y="90" class="s9">同一 untreated opportunity 冻结 eligibility；分配后，candidate 自己生成后续订单、库存与终局</text>
  <rect x="45" y="145" width="190" height="96" rx="14" class="b9"/><text x="66" y="178" class="t9">Untreated opportunity</text><text x="66" y="207" class="s9">past-only state</text><text x="66" y="228" class="s9">role · side · lineage</text>
  <rect x="285" y="145" width="165" height="96" rx="14" class="p9"/><text x="312" y="179" class="t9">0.5 / 0.5</text><text x="307" y="208" class="s9">frozen assignment</text>
  <rect x="500" y="120" width="205" height="92" rx="14" class="g9"/><text x="532" y="154" class="t9">Control K0</text><text x="524" y="183" class="s9">current baseline</text>
  <rect x="500" y="230" width="205" height="92" rx="14" class="w9"/><text x="525" y="264" class="t9">Candidate K1</text><text x="520" y="293" class="s9">widen/skip/rearm/shift</text>
  <rect x="770" y="145" width="180" height="150" rx="14" class="b9"/><text x="795" y="179" class="t9">Lifecycle</text><text x="795" y="207" class="s9">submit · GTX</text><text x="795" y="231" class="s9">queue · fill</text><text x="795" y="255" class="s9">cancel · ACK</text><text x="795" y="279" class="s9">re-entry</text>
  <rect x="1000" y="145" width="155" height="150" rx="14" class="p9"/><text x="1023" y="179" class="t9">State feedback</text><text x="1023" y="207" class="s9">inventory</text><text x="1023" y="231" class="s9">role / cooldown</text><text x="1023" y="255" class="s9">next quote</text><text x="1023" y="279" class="s9">库存生命周期 end</text>
  <path d="M235 193H285M450 193H490" class="l9"/><path d="M705 166H760M705 276H760M950 220H990" class="l9"/><path d="M1077 305C1077 365 860 370 860 305" fill="none" class="l9"/>
  <text x="50" y="390" class="h9">四道门必须联读</text>
  <rect x="50" y="430" width="250" height="155" rx="16" class="g9"/><text x="76" y="468" class="t9">1 · Mechanics</text><text x="76" y="500" class="s9">动作是否真的改变报价/权限</text><text x="76" y="527" class="s9">Python/C++ 与订单身份是否一致</text><text x="76" y="554" class="s9">不是 no-op</text>
  <rect x="330" y="430" width="250" height="155" rx="16" class="b9"/><text x="356" y="468" class="t9">2 · Participation</text><text x="356" y="500" class="s9">action rate · fills retained</text><text x="356" y="527" class="s9">是否只是关闭大部分交易</text><text x="356" y="554" class="s9">common eligibility support</text>
  <rect x="610" y="430" width="250" height="155" rx="16" class="w9"/><text x="636" y="468" class="t9">3 · Lifecycle / Risk</text><text x="636" y="500" class="s9">inventory-time · repair-time</text><text x="636" y="527" class="s9">MAE · q10 / CVaR · carryover</text><text x="636" y="554" class="s9">ACK 后不得继续归因</text>
  <rect x="890" y="430" width="250" height="155" rx="16" class="p9"/><text x="916" y="468" class="t9">4 · Economics</text><text x="916" y="500" class="s9">assignment → terminal USDC</text><text x="916" y="527" class="s9">UTC-day clustered lower bound</text><text x="916" y="554" class="s9">positive days · tail non-worse</text>
  <path d="M300 507H320M580 507H600M860 507H880" class="l9"/>
  <rect x="280" y="625" width="640" height="55" rx="14" fill="#52263b" stroke="#ef6f9e" stroke-width="2"/><text x="330" y="660" class="t9">任一前置门失败，都不能用后面的漂亮点估计补成 action authority</text>
</svg>
