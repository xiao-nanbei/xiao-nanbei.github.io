<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">First-Add 外部增量价值 M0 与 M1 因果机制</title>
  <desc id="desc">一段 maker campaign 的 K 线与订单路径标出首次增加风险敞口的决策，M0 读取本地状态，M1 增加多尺度外部接收时钟状态，二者预测从该决策到 campaign terminal 的价值。</desc>
  <rect width="1200" height="620" fill="#08111f"/>
  <text x="54" y="48" fill="#f4f7fb" font-size="25" font-family="system-ui,sans-serif" font-weight="700">First-Add External Incremental Value · M0 / M1</text>
  <text x="54" y="76" fill="#9fb3c8" font-size="14" font-family="system-ui,sans-serif">机制示意 · exact decision → campaign-terminal USDC target</text>
  <g transform="translate(54 108)">
    <rect width="700" height="330" rx="16" fill="#0d1b2d" stroke="#27415f"/>
    <text x="22" y="32" fill="#dce7f4" font-size="16" font-family="system-ui,sans-serif" font-weight="650">一个完整 maker campaign</text>
    <line x1="38" y1="266" x2="665" y2="266" stroke="#36516f"/>
    <polyline points="44,220 100,208 156,225 212,176 268,190 324,150 380,168 436,132 492,148 548,108 604,122 660,96" fill="none" stroke="#7aa2f7" stroke-width="3"/>
    <g stroke="#dce7f4" stroke-width="2">
      <line x1="101" y1="194" x2="101" y2="226"/><rect x="94" y="202" width="14" height="17" fill="#58d6c7"/>
      <line x1="213" y1="158" x2="213" y2="195"/><rect x="206" y="168" width="14" height="18" fill="#58d6c7"/>
      <line x1="325" y1="134" x2="325" y2="173"/><rect x="318" y="144" width="14" height="19" fill="#f5a65b"/>
      <line x1="437" y1="118" x2="437" y2="154"/><rect x="430" y="127" width="14" height="18" fill="#f08a8a"/>
      <line x1="549" y1="93" x2="549" y2="129"/><rect x="542" y="103" width="14" height="17" fill="#58d6c7"/>
    </g>
    <line x1="104" y1="258" x2="104" y2="282" stroke="#58d6c7" stroke-width="4"/><text x="70" y="307" fill="#9ce8de" font-size="13" font-family="system-ui,sans-serif">opener</text>
    <line x1="248" y1="250" x2="248" y2="286" stroke="#f5a65b" stroke-width="5"/><circle cx="248" cy="250" r="8" fill="#f5a65b"/>
    <text x="180" y="308" fill="#ffd39f" font-size="14" font-family="system-ui,sans-serif" font-weight="700">FIRST ADD decision</text>
    <line x1="610" y1="258" x2="610" y2="282" stroke="#7aa2f7" stroke-width="4"/><text x="573" y="307" fill="#aac5ed" font-size="13" font-family="system-ui,sans-serif">terminal</text>
    <path d="M260 244 Q430 202 598 244" fill="none" stroke="#f5a65b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowGold)"/>
    <text x="356" y="224" fill="#f6cca0" font-size="13" font-family="system-ui,sans-serif">Y = V(T) − V(t_first add)</text>
  </g>
  <g transform="translate(782 108)">
    <rect width="364" height="330" rx="16" fill="#0d1b2d" stroke="#27415f"/>
    <text x="22" y="32" fill="#dce7f4" font-size="16" font-family="system-ui,sans-serif" font-weight="650">同一 rows 的增量比较</text>
    <rect x="24" y="58" width="316" height="66" rx="10" fill="#122941" stroke="#3a5a7c"/>
    <text x="43" y="84" fill="#aac5ed" font-size="15" font-family="system-ui,sans-serif" font-weight="650">M0</text><text x="83" y="84" fill="#c8d8e8" font-size="13" font-family="system-ui,sans-serif">campaign + local microstructure</text>
    <text x="43" y="107" fill="#8fa8bf" font-size="12" font-family="system-ui,sans-serif">BUY / SELL separate · Ridge α=1</text>
    <rect x="24" y="142" width="316" height="92" rx="10" fill="#12312f" stroke="#36766e"/>
    <text x="43" y="168" fill="#9ce8de" font-size="15" font-family="system-ui,sans-serif" font-weight="650">M1 = M0 + external receive-time state</text>
    <text x="43" y="194" fill="#a8d8d2" font-size="12" font-family="system-ui,sans-serif">10 / 25 / 50 / 100 / 250 / 500ms</text>
    <text x="43" y="216" fill="#a8d8d2" font-size="12" font-family="system-ui,sans-serif">all + true leave-one-venue-out</text>
    <rect x="24" y="254" width="316" height="48" rx="10" fill="#3a1e26" stroke="#8e4150"/>
    <text x="55" y="284" fill="#ffd0d6" font-size="14" font-family="system-ui,sans-serif" font-weight="700">COUNT COMPLETE · FIT BLOCKED</text>
  </g>
  <rect x="54" y="466" width="1092" height="104" rx="14" fill="#0b1727" stroke="#27415f"/>
  <text x="76" y="497" fill="#dce7f4" font-size="14" font-family="system-ui,sans-serif">31 valid full windows · 30 distinct UTC days（重复日只计一次）</text>
  <text x="76" y="525" fill="#f5c286" font-size="14" font-family="system-ui,sans-serif">仍需 exact lifecycle、共同 rows、causal clock、source transport、LOO、Grade A/B 与 late-panel gates</text>
  <text x="76" y="552" fill="#8fa8bf" font-size="13" font-family="system-ui,sans-serif">prediction pass 也不会自动授权 ADD / NO-ADD 动作</text>
  <text x="1000" y="603" fill="#617993" font-size="12" font-family="system-ui,sans-serif">机制示意 / 公开状态</text>
  <defs><marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f5a65b"/></marker></defs>
</svg>
