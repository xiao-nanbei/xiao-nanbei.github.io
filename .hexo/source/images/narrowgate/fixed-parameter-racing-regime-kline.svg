<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">固定参数在三种市场阶段的作用差异</title>
  <desc id="desc">机制示意图。合成K线依次经过低波动、单边冲击和修复阶段，相同固定报价带与冷却规则导致不同的成交、库存和尾部结果。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102a43"/></linearGradient>
    <style>.t{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#e8f1fa}.m{fill:#9fb3c8}.g{stroke:#39d98a}.r{stroke:#ff6b6b}.b{stroke:#5ab0ff}.grid{stroke:#24435f;stroke-width:1}.dash{stroke-dasharray:8 7}.label{font-size:18px}.small{font-size:15px}.big{font-size:28px;font-weight:700}</style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <text x="54" y="54" class="t big">同一固定参数，不同 regime，不同经济作用</text>
  <text x="54" y="82" class="m small">机制示意 · 不是历史实盘 K 线或可执行参数建议</text>
  <g transform="translate(55 110)">
    <rect width="1090" height="340" rx="16" fill="#0b1d31" stroke="#315472"/>
    <path d="M0 113H1090M0 226H1090M363 0V340M726 0V340" class="grid"/>
    <text x="125" y="30" class="t label">低波动</text><text x="485" y="30" class="t label">单边冲击</text><text x="860" y="30" class="t label">修复与 refill</text>
    <g stroke-width="3">
      <line x1="45" y1="178" x2="45" y2="235" class="g"/><rect x="37" y="194" width="16" height="24" fill="#39d98a"/>
      <line x1="92" y1="166" x2="92" y2="222" class="r"/><rect x="84" y="181" width="16" height="23" fill="#ff6b6b"/>
      <line x1="139" y1="174" x2="139" y2="229" class="g"/><rect x="131" y="187" width="16" height="25" fill="#39d98a"/>
