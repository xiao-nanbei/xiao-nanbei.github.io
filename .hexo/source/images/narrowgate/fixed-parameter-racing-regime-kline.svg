      <line x1="697" y1="258" x2="697" y2="322" class="g"/><rect x="687" y="272" width="20" height="34" fill="#39d98a"/>
      <line x1="757" y1="244" x2="757" y2="310" class="g"/><rect x="747" y="260" width="20" height="32" fill="#39d98a"/>
