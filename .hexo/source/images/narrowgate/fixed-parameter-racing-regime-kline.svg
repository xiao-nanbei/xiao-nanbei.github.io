    </g>
    <polyline points="20,145 180,140 340,146 430,172 540,236 700,250 850,188 1070,139" fill="none" class="b" stroke-width="3"/>
    <polyline points="20,250 180,245 340,251 430,278 540,330 700,337 850,282 1070,245" fill="none" class="b dash" stroke-width="3"/>
    <circle cx="485" cy="265" r="9" fill="#ffd166"/><text x="505" y="270" class="t small">固定 quote/cooldown 删除何种 fill 取决于路径</text>
  </g>
  <g transform="translate(55 480)">
    <rect width="330" height="90" rx="14" fill="#0b1d31" stroke="#315472"/><text x="20" y="32" class="t label">低波动</text><text x="20" y="60" class="m small">固定 widen 可能只减少正常参与</text>
    <rect x="380" width="330" height="90" rx="14" fill="#0b1d31" stroke="#315472"/><text x="400" y="32" class="t label">单边冲击</text><text x="400" y="60" class="m small">固定 cooldown 可能降低暴露，也可能错过修复</text>
    <rect x="760" width="330" height="90" rx="14" fill="#0b1d31" stroke="#315472"/><text x="780" y="32" class="t label">修复阶段</text><text x="780" y="60" class="m small">同一规则会改变 campaign 终局与尾部</text>
  </g>
</svg>
