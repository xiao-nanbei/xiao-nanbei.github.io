<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">BUY E3 的三个增量价值区间</title>
  <desc id="desc">森林图展示 BUY E3 gross terminal uplift 的日聚类和周块 simultaneous interval，以及相对 action-matched control 的语义增量日区间。两个日区间跨过零，周块区间为正，但冻结门槛不允许事后只选择有利聚类。</desc>
  <defs>
    <style>
      .bg{fill:#fbfcfe}.frame{fill:#fff;stroke:#d0d5dd;stroke-width:1.2}.axis{stroke:#667085;stroke-width:1.2}.grid{stroke:#eaecf0;stroke-width:1}.zero{stroke:#b42318;stroke-width:1.8;stroke-dasharray:6 5}.day{stroke:#175cd3;stroke-width:4}.week{stroke:#027a48;stroke-width:4}.semantic{stroke:#6941c6;stroke-width:4}.cap{stroke-width:2}.dotday{fill:#175cd3}.dotweek{fill:#027a48}.dotsemantic{fill:#6941c6}.note{fill:#fff7ed;stroke:#b54708;stroke-width:1.2}.title{font:500 23px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#101828}.text{font:500 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#101828}.small{font:400 12px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475467}.mono{font:400 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#344054}.red{fill:#b42318}.green{fill:#027a48}
    </style>
  </defs>
  <rect class="bg" width="1040" height="560"/>
  <text class="title" x="36" y="42">BUY E3：点估计很好看，但 primary day interval 仍跨零</text>
  <text class="small" x="36" y="68">横轴单位：USDC/day；圆点为 uplift 点估计，横线为预先规定的 simultaneous interval。</text>

  <rect class="frame" x="278" y="96" width="702" height="292" rx="6"/>
  <line class="grid" x1="290" y1="106" x2="290" y2="370"/><line class="grid" x1="415.5" y1="106" x2="415.5" y2="370"/><line class="zero" x1="540.9" y1="106" x2="540.9" y2="370"/><line class="grid" x1="666.4" y1="106" x2="666.4" y2="370"/><line class="grid" x1="791.8" y1="106" x2="791.8" y2="370"/><line class="grid" x1="917.3" y1="106" x2="917.3" y2="370"/>
  <text class="small" text-anchor="end" x="254" y="156">Gross terminal</text><text class="small" text-anchor="end" x="254" y="174">day-cluster</text>
  <text class="small" text-anchor="end" x="254" y="242">Gross terminal</text><text class="small" text-anchor="end" x="254" y="260">week-block</text>
  <text class="small" text-anchor="end" x="254" y="328">Semantic increment</text><text class="small" text-anchor="end" x="254" y="346">vs matched · day</text>

  <line class="day" x1="431.7" y1="164" x2="937.8" y2="164"/><line class="day cap" x1="431.7" y1="151" x2="431.7" y2="177"/><line class="day cap" x1="937.8" y1="151" x2="937.8" y2="177"/><circle class="dotday" cx="684.7" cy="164" r="8"/>
  <line class="week" x1="584.9" y1="250" x2="828.6" y2="250"/><line class="week cap" x1="584.9" y1="237" x2="584.9" y2="263"/><line class="week cap" x1="828.6" y1="237" x2="828.6" y2="263"/><circle class="dotweek" cx="684.7" cy="250" r="8"/>
  <line class="semantic" x1="316.6" y1="336" x2="886.8" y2="336"/><line class="semantic cap" x1="316.6" y1="323" x2="316.6" y2="349"/><line class="semantic cap" x1="886.8" y1="323" x2="886.8" y2="349"/><circle class="dotsemantic" cx="601.7" cy="336" r="8"/>

  <text class="mono" x="698" y="150">+0.4586</text><text class="mono" x="698" y="236">+0.4586</text><text class="mono" x="615" y="322">+0.1939</text>
  <line class="axis" x1="290" y1="388" x2="980" y2="388"/>
  <text class="small" text-anchor="middle" x="290" y="412">−0.8</text><text class="small" text-anchor="middle" x="415.5" y="412">−0.4</text><text class="small red" text-anchor="middle" x="540.9" y="412">0</text><text class="small" text-anchor="middle" x="666.4" y="412">+0.4</text><text class="small" text-anchor="middle" x="791.8" y="412">+0.8</text><text class="small" text-anchor="middle" x="917.3" y="412">+1.2</text>

  <rect class="note" x="36" y="448" width="968" height="78" rx="8"/>
  <text class="text" x="58" y="477">为什么不能只展示绿色那条？</text>
  <text class="small" x="58" y="501">week-block interval 为正，但冻结合同的 primary day family 跨零；结果出来后改用更有利的聚类口径，会把不确定性选择本身变成调参。</text>
  <text class="small" x="36" y="548">同时：4/4 outer folds 为正，13/20 OOF days 为正，fills 保留 97.29%；这些支持“值得继续确认”，不等于“已经通过”。</text>
</svg>
