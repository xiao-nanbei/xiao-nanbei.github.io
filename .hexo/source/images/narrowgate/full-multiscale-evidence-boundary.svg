<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="570" viewBox="0 0 1040 570" role="img" aria-labelledby="title desc">
  <title id="title">Full-Multiscale 研究的证据权限边界</title>
  <desc id="desc">研究完成了历史 Development 的嵌套样本外评价，但两侧均未通过门槛，因此没有进入 final refit、Validation、sealed holdout、action authorization 或 live authorization。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#344054"/></marker>
    <style>
      .bg{fill:#fbfcfe}.done{fill:#eff8ff;stroke:#175cd3;stroke-width:1.4}.stop{fill:#fef2f2;stroke:#b42318;stroke-width:1.8}.locked{fill:#f2f4f7;stroke:#98a2b3;stroke-width:1.3}.none{fill:#fff;stroke:#d0d5dd;stroke-width:1.3}.line{fill:none;stroke:#344054;stroke-width:1.6;marker-end:url(#arrow)}.blocked{fill:none;stroke:#b42318;stroke-width:2;stroke-dasharray:7 5}.title{font:500 23px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#101828}.text{font:500 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#101828}.small{font:400 12px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475467}.mono{font:400 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#344054}.red{fill:#b42318}.blue{fill:#175cd3}
    </style>
  </defs>
  <rect class="bg" width="1040" height="570"/>
  <text class="title" x="36" y="42">“发现一个正信号”到“可以改 live”之间，还有多道独立权限门</text>

  <rect class="done" x="42" y="104" width="180" height="102" rx="9"/>
  <text class="text" x="60" y="134">Historical Development</text><text class="small" x="60" y="159">30 days · 3,516 opportunities</text><text class="small" x="60" y="181">nested OOF 已完成</text>
  <rect class="stop" x="266" y="104" width="180" height="102" rx="9"/>
  <text class="text red" x="284" y="134">Development gate</text><text class="small" x="284" y="159">BUY / SELL 均未通过</text><text class="mono" x="284" y="183">supported_sides = []</text>
  <rect class="locked" x="490" y="104" width="160" height="102" rx="9"/>
  <text class="text" x="508" y="134">Final refit</text><text class="small" x="508" y="159">未创建</text><text class="small" x="508" y="181">无固定 artifact</text>
  <rect class="locked" x="694" y="104" width="140" height="102" rx="9"/>
  <text class="text" x="712" y="134">Validation</text><text class="small" x="712" y="159">未读取</text><text class="small" x="712" y="181">仍锁定</text>
  <rect class="locked" x="878" y="104" width="128" height="102" rx="9"/>
  <text class="text" x="896" y="134">Holdout</text><text class="small" x="896" y="159">未读取</text><text class="small" x="896" y="181">仍密封</text>
  <path class="line" d="M222 155H266"/><path class="blocked" d="M446 155H490"/><path class="blocked" d="M650 155H694"/><path class="blocked" d="M834 155H878"/>
  <text class="text red" x="455" y="142">STOP</text>

  <rect class="none" x="132" y="302" width="218" height="92" rx="9"/>
  <text class="text" x="154" y="333">Research-supported action</text><text class="small" x="154" y="360">没有；不能生成 action authority</text>
  <rect class="none" x="412" y="302" width="218" height="92" rx="9"/>
  <text class="text" x="434" y="333">Canary / deployment</text><text class="small" x="434" y="360">没有；未请求 live confirmation</text>
  <rect class="none" x="692" y="302" width="218" height="92" rx="9"/>
  <text class="text" x="714" y="333">Live authority</text><text class="small" x="714" y="360">没有；owner baseline 不变</text>
  <path class="blocked" d="M350 348H412"/><path class="blocked" d="M630 348H692"/>

  <rect class="done" x="132" y="450" width="778" height="76" rx="9"/>
  <text class="text blue" x="154" y="480">仍然保留下来的结论</text>
  <text class="small" x="154" y="505">BUY E3 是高优先级 hypothesis；若未来确认，必须用新冻结的独立 evidence identity，而不是回到这 30 天上修改门槛。</text>
</svg>
