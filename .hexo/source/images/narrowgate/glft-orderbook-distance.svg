<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" role="img" aria-labelledby="title desc">
  <title id="title">GLFT：单侧报价距离与相对成交强度</title>
  <desc id="desc">中价70000，最优买价69999，最优卖价70001。三个互斥卖价方案70001、70003、70005，距离分别1、3、5。示意斜率0.5，相对成交强度分别0.607、0.223、0.082。</desc>
  <rect width="640" height="450" fill="#f6f8fc" rx="12"/>
  <g font-family="Arial, sans-serif" fill="#182636">
    <text x="28" y="40" font-size="23" font-weight="600">GLFT · 单侧距离，不是双边总价差</text>
    <text x="28" y="76" font-size="20">bid₁ 69999　│　mid 70000　│　ask₁ 70001</text>
    <path d="M28 96H612" stroke="#b8c5d4"/>
    <text x="28" y="131" font-size="19">备选卖价</text><text x="215" y="131" font-size="19">距离 δ</text><text x="355" y="131" font-size="19">相对强度 λ / A</text>
    <text x="28" y="182" font-size="23">70001</text><text x="239" y="182" font-size="23">1</text>
    <rect x="355" y="160" width="170" height="27" fill="#346ca8"/><text x="538" y="182" font-size="22">0.607</text>
    <text x="28" y="244" font-size="23">70003</text><text x="239" y="244" font-size="23">3</text>
    <rect x="355" y="222" width="62" height="27" fill="#346ca8"/><text x="430" y="244" font-size="22">0.223</text>
    <text x="28" y="306" font-size="23">70005</text><text x="239" y="306" font-size="23">5</text>
    <rect x="355" y="284" width="23" height="27" fill="#346ca8"/><text x="391" y="306" font-size="22">0.082</text>
    <path d="M28 331H612" stroke="#b8c5d4"/>
    <text x="28" y="364" font-size="20">示意 k = 0.5 /价格单位；λ / A = exp(−kδ)</text>
    <text x="28" y="397" font-size="20">互斥备选方案 · 不是同时下三张订单</text>
    <text x="28" y="430" font-size="20">示意参数，非项目校准结果</text>
  </g>
</svg>
