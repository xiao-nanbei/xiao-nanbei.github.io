<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">历史回测证据在修复后的保留、复现与撤回分类图</title>
  <desc id="desc">左侧旧回测证据经过 data、clock、unit、queue 与 implementation identity 修复，右侧分为 retained correctness、reproduced shape、conservative decision retained 和 exact economics withdrawn。图为证据治理示意。</desc>
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07131f"/><stop offset="1" stop-color="#1b2d47"/></linearGradient>
    <marker id="ar6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#8bd5ff"/></marker>
  </defs>
  <rect width="1280" height="720" rx="24" fill="url(#bg6)"/>
  <text x="48" y="52" fill="#f7f9ff" font-size="28" font-family="sans-serif" font-weight="700">Historical Evidence Revalidation：修复后不是“全部保留”也不是“全部作废”</text>
  <text x="48" y="83" fill="#9eb3c8" font-size="16" font-family="sans-serif">证据治理示意 · 非收益曲线 · superseded exact numbers 不得用于 current selection</text>

  <rect x="48" y="116" width="270" height="516" rx="17" fill="#17283c" stroke="#4b657c"/>
  <text x="74" y="153" fill="#dce7f0" font-size="19" font-family="sans-serif" font-weight="700">旧 evidence bundle</text>
  <g font-family="sans-serif">
    <rect x="76" y="180" width="214" height="58" rx="10" fill="#25364c"/><text x="183" y="205" text-anchor="middle" fill="#d5e3ed" font-size="14">PnL / fill / tail tables</text><text x="183" y="225" text-anchor="middle" fill="#aabcca" font-size="12">winner · arm ranking</text>
    <rect x="76" y="256" width="214" height="58" rx="10" fill="#25364c"/><text x="183" y="281" text-anchor="middle" fill="#d5e3ed" font-size="14">models / scorer buckets</text><text x="183" y="301" text-anchor="middle" fill="#aabcca" font-size="12">left-labelled features</text>
    <rect x="76" y="332" width="214" height="58" rx="10" fill="#25364c"/><text x="183" y="357" text-anchor="middle" fill="#d5e3ed" font-size="14">P3 / lifecycle / queue</text><text x="183" y="377" text-anchor="middle" fill="#aabcca" font-size="12">mixed L2 identity</text>
    <rect x="76" y="408" width="214" height="58" rx="10" fill="#25364c"/><text x="183" y="433" text-anchor="middle" fill="#d5e3ed" font-size="14">no-promote decisions</text><text x="183" y="453" text-anchor="middle" fill="#aabcca" font-size="12">historical governance</text>
    <rect x="76" y="484" width="214" height="112" rx="10" fill="#402933" stroke="#b96b80"/><text x="183" y="512" text-anchor="middle" fill="#ffdfe4" font-size="14" font-weight="700">Known repairs</text><text x="96" y="540" fill="#d8b8c0" font-size="12">unit · clock · calendar</text><text x="96" y="563" fill="#d8b8c0" font-size="12">trade side · commission</text><text x="96" y="586" fill="#d8b8c0" font-size="12">tick/lot · queue · L2</text>
  </g>

  <line x1="318" y1="374" x2="408" y2="374" stroke="#8bd5ff" stroke-width="5" marker-end="url(#ar6)"/>
  <rect x="420" y="182" width="258" height="386" rx="18" fill="#0f2638" stroke="#4a97c8" stroke-width="2"/>
  <text x="549" y="218" text-anchor="middle" fill="#dff5ff" font-size="19" font-family="sans-serif" font-weight="700">Identity revalidation</text>
  <text x="450" y="258" fill="#b9cedd" font-size="14" font-family="sans-serif">Estimand</text><line x1="450" y1="268" x2="646" y2="268" stroke="#31516a"/>
  <text x="450" y="298" fill="#b9cedd" font-size="14" font-family="sans-serif">Data / L2 / trades</text><line x1="450" y1="308" x2="646" y2="308" stroke="#31516a"/>
  <text x="450" y="338" fill="#b9cedd" font-size="14" font-family="sans-serif">Feature-ready clock</text><line x1="450" y1="348" x2="646" y2="348" stroke="#31516a"/>
  <text x="450" y="378" fill="#b9cedd" font-size="14" font-family="sans-serif">Queue / latency</text><line x1="450" y1="388" x2="646" y2="388" stroke="#31516a"/>
  <text x="450" y="418" fill="#b9cedd" font-size="14" font-family="sans-serif">Implementation parity</text><line x1="450" y1="428" x2="646" y2="428" stroke="#31516a"/>
  <text x="450" y="458" fill="#b9cedd" font-size="14" font-family="sans-serif">Initial state / horizon</text><line x1="450" y1="468" x2="646" y2="468" stroke="#31516a"/>
  <rect x="450" y="496" width="198" height="44" rx="10" fill="#173a38" stroke="#7ee2a8"/>
  <text x="549" y="523" text-anchor="middle" fill="#d9ffea" font-size="14" font-family="sans-serif" font-weight="700">classify claim, not file</text>

  <line x1="678" y1="374" x2="742" y2="374" stroke="#8bd5ff" stroke-width="5" marker-end="url(#ar6)"/>
  <g font-family="sans-serif">
    <rect x="754" y="128" width="478" height="102" rx="14" fill="#173a38" stroke="#7ee2a8" stroke-width="2"/>
    <text x="780" y="158" fill="#d9ffea" font-size="17" font-weight="700">RETAIN · correctness contract</text>
    <text x="780" y="187" fill="#bcebd0" font-size="14">feature-ready cutoff · merged clock · quantity weighting</text>
    <text x="780" y="210" fill="#bcebd0" font-size="14">terminal MTM · fail-closed deployment guard</text>
    <rect x="754" y="246" width="478" height="102" rx="14" fill="#19374e" stroke="#6fbbe7" stroke-width="2"/>
    <text x="780" y="276" fill="#dff5ff" font-size="17" font-weight="700">REPRODUCE · corrected identity</text>
    <text x="780" y="305" fill="#bce8ff" font-size="14">P3 κ: 0.06743811 → 0.06735643（−0.121%）</text>
    <text x="780" y="328" fill="#bce8ff" font-size="14">new artifact only；old hash remains superseded</text>
    <rect x="754" y="364" width="478" height="102" rx="14" fill="#44371d" stroke="#ffd166" stroke-width="2"/>
    <text x="780" y="394" fill="#fff0b5" font-size="17" font-weight="700">KEEP DECISION · withdraw estimate</text>
    <text x="780" y="423" fill="#ead99c" font-size="14">historical do-not-promote remains safe</text>
    <text x="780" y="446" fill="#ead99c" font-size="14">old DR / fill / 库存生命周期 numbers are not current evidence</text>
    <rect x="754" y="482" width="478" height="116" rx="14" fill="#482731" stroke="#ff8f91" stroke-width="2"/>
    <text x="780" y="512" fill="#ffe0e1" font-size="17" font-weight="700">WITHDRAW · exact economics and ranking</text>
    <text x="780" y="541" fill="#f2b9bb" font-size="14">old PnL · winners · survivor ranks · fixed-knob optimum</text>
    <text x="780" y="566" fill="#f2b9bb" font-size="14">mixed-L2 lifecycle durations · premature-feature scores</text>
    <text x="780" y="589" fill="#ff8f91" font-size="13" font-weight="700">no old alpha authority</text>
  </g>
  <rect x="48" y="658" width="1184" height="42" rx="10" fill="#162b40"/>
  <text x="640" y="685" text-anchor="middle" fill="#a8bed1" font-size="14" font-family="sans-serif">同一文件仍存在 ≠ 同一 claim 仍有效；current selection 必须绑定 corrected denominator。</text>
</svg>
