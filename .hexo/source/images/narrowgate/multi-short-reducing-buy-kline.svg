<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet">
  <title>Multi-short reducing BUY aggressive maker 的 K 线机制</title>
  <desc>机制示意：inventory 到负二单位时，candidate 把 reducing BUY 移到最激进 maker tick，直到恢复到负一单位；右侧展示 repair time 和 terminal value 的分离。</desc>
  <rect width="1200" height="720" fill="#07111f"/>
  <text x="52" y="55" fill="#f4f7fb" font-size="28" font-family="sans-serif" font-weight="700">更快 Repair，不代表更高 Terminal Value</text><text x="52" y="84" fill="#9fb3c8" font-size="16" font-family="sans-serif">机制示意 · GTX maker-only，无 action-generated IOC/taker</text>
  <g stroke="#24374b"><path d="M60 145H750M60 245H750M60 345H750M60 445H750M60 545H750"/></g><path d="M70 220C165 275 245 240 330 330S475 465 560 390S665 325 735 350" fill="none" stroke="#f8c15c" stroke-width="4"/>
  <g stroke-width="4"><path d="M180 190V315" stroke="#ff6f7d"/><rect x="164" y="220" width="32" height="60" fill="#ff6f7d"/><path d="M310 260V390" stroke="#ff6f7d"/><rect x="294" y="295" width="32" height="62" fill="#ff6f7d"/><path d="M440 350V505" stroke="#ff6f7d"/><rect x="424" y="390" width="32" height="72" fill="#ff6f7d"/><path d="M570 330V465" stroke="#41d69a"/><rect x="554" y="365" width="32" height="65" fill="#41d69a"/><path d="M700 285V410" stroke="#41d69a"/><rect x="684" y="320" width="32" height="60" fill="#41d69a"/></g>
  <circle cx="440" cy="462" r="12" fill="#ff6f7d"/><text x="335" y="535" fill="#ff9ca5" font-size="16" font-family="sans-serif">trigger: inventory ≤ -0.002</text><path d="M440 480V515" stroke="#ff6f7d" stroke-width="2"/>
  <path d="M445 390H700" stroke="#42a5f5" stroke-width="3" stroke-dasharray="9 6"/><text x="485" y="365" fill="#9fd8ff" font-size="15" font-family="sans-serif">candidate BUY：最激进 maker tick</text><circle cx="570" cy="390" r="11" fill="#42a5f5"/><text x="600" y="430" fill="#63deb0" font-size="15" font-family="sans-serif">reducing fill → release</text>
  <rect x="790" y="125" width="355" height="420" rx="17" fill="#0e1c2d"/><text x="818" y="165" fill="#eaf2fb" font-size="19" font-family="sans-serif" font-weight="700">Grade-A 冻结聚合</text><text x="818" y="205" fill="#9fb3c8" font-size="16" font-family="sans-serif">627 assignments</text><text x="818" y="236" fill="#9fb3c8" font-size="16" font-family="sans-serif">action change 99.37%</text><text x="818" y="267" fill="#9fb3c8" font-size="16" font-family="sans-serif">total fill retention 103.00%</text><path d="M816 292H1118" stroke="#31465b"/><text x="818" y="329" fill="#63deb0" font-size="16" font-family="sans-serif">repair-time avoidance +84.82s</text><text x="818" y="360" fill="#63deb0" font-size="16" font-family="sans-serif">inventory-time avoidance +0.277 BTC·s</text><path d="M816 385H1118" stroke="#31465b"/><text x="818" y="421" fill="#ff9ca5" font-size="16" font-family="sans-serif">reward uplift -0.004435</text><text x="818" y="451" fill="#ff9ca5" font-size="15" font-family="sans-serif">95% CI [-0.030210,+0.021736]</text><text x="818" y="486" fill="#ff9ca5" font-size="15" font-family="sans-serif">q10 / CVaR 略差</text><text x="818" y="520" fill="#f4f7fb" font-size="18" font-family="sans-serif" font-weight="700">Development closed</text>
  <rect x="60" y="610" width="1085" height="65" rx="14" fill="#0e1c2d"/><text x="88" y="640" fill="#eaf2fb" font-size="16" font-family="sans-serif">repair time 是中介机制；assignment-to-terminal reward 才是总效应。</text><text x="88" y="663" fill="#9fb3c8" font-size="15" font-family="sans-serif">Validation / holdout 未读；整数 tick 修复不构成新研究。</text>
</svg>
