    <text x="765" y="42" class="t label">Mean half-spread</text><text x="765" y="68" class="m small">24.5822 → 13.4900</text><text x="765" y="101" class="t label">Fills</text><text x="765" y="127" class="m small">8,799 → 21,597 (+145.45%)</text><text x="765" y="158" fill="#ff8f8f" class="label">Terminal Δ -115.6608 USDC</text>
