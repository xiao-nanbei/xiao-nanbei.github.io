<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">条件P3标量适配器的完整路径机制</title>
  <desc id="desc">机制示意与冻结聚合结果。条件曲面先被平均压成delta star和kappa，再进入旧报价公式，报价显著收窄、成交增加百分之一百四十五，但二十四日terminal MTM下降一百一十五点六六USDC。</desc>
  <defs><linearGradient id="bg"><stop stop-color="#071426"/><stop offset="1" stop-color="#302441"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc"/></marker><style>.t{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#f0f6ff}.m{fill:#b2bed0}.box{fill:#0b1d31;stroke:#3b5e7a}.arr{stroke:#7dd3fc;stroke-width:3;marker-end:url(#a)}.big{font-size:27px;font-weight:700}.label{font-size:17px}.small{font-size:14px}</style></defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="52" y="53" class="t big">Prediction → scalar compression → quote path：权限不能跳级</text><text x="52" y="82" class="m small">机制示意与 24 日冻结聚合结果</text>
  <g transform="translate(50 125)">
