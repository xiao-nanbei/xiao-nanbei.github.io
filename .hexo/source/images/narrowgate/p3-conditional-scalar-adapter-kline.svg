    <line x1="528" y1="60" x2="588" y2="60" class="arr"/>
    <rect x="600" width="220" height="120" rx="14" class="box"/><text x="620" y="34" class="t label">两个动态标量</text><text x="620" y="70" class="t small">delta_star 10.3851</text><text x="620" y="96" class="t small">kappa_eff 0.168434</text>
    <line x1="828" y1="60" x2="888" y2="60" class="arr"/>
    <rect x="900" width="220" height="120" rx="14" class="box"/><text x="920" y="34" class="t label">旧 AS / GLFT ABI</text><text x="920" y="70" class="m small">spread term + P3 floor</text><text x="920" y="96" fill="#ff8f8f" class="small">同一信号双通道收窄</text>
  </g>
