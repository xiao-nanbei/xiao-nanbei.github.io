<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1258" viewBox="0 0 1100 1258" role="img" aria-labelledby="title desc">
  <title id="title">P3 研究链：概率问题被解决，报价价值桥仍未通过</title>
  <desc id="desc">每一层都回答不同 estimand；touch、fill、queue 与 terminal value 不能互换。更准确的触达概率可以让报价更激进、成交更多，同时让终局更差。 下一步必须直接评价 joint quote 的完整生命周期价值。 研究支持：P(touch) / reach-time prediction · quote action=false · live=false</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#98a2b3"/></marker>
    <style>
      .bg{fill:#fbfcfe}.card{fill:#fff;stroke:#d0d5dd;stroke-width:1.2}.connector{fill:none;stroke:#98a2b3;stroke-width:1.6;marker-end:url(#arrow)}
      .title{font:600 24px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#101828}.subtitle{font:400 13px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475467}
      .stage{font:600 17px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#101828}.result{font:500 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#344054}.metric{font:400 12px ui-monospace,SFMono-Regular,Menlo,"PingFang SC",monospace;fill:#667085}
      .pill{font:600 13px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.index{font:600 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.take-title{font:600 17px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#175cd3}.take{font:500 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#344054}.authority{font:500 12px ui-monospace,SFMono-Regular,Menlo,"PingFang SC",monospace;fill:#b42318}
    </style>
  </defs>
  <rect class="bg" width="1100" height="1258"/>
  <text class="title" x="42" y="44">P3 研究链：概率问题被解决，报价价值桥仍未通过</text>
  <text class="subtitle" x="42" y="70">每一层都回答不同 estimand；touch、fill、queue 与 terminal value 不能互换</text>
  <line x1="42" y1="92" x2="1058" y2="92" stroke="#eaecf0" stroke-width="1"/>
<path class="connector" d="M112 250 V269"/>
  <rect class="card" x="62" y="142" width="976" height="108" rx="11"/>
  <rect x="62" y="142" width="8" height="108" rx="4" fill="#039855"/>
  <circle cx="112" cy="174" r="18" fill="#ecfdf3" stroke="#039855" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="180" fill="#027a48">1</text>
  <text class="stage" x="150" y="176">归一化 100ms 复现</text>
  <rect x="888" y="158" width="122" height="32" rx="16" fill="#ecfdf3" stroke="#039855" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="179" fill="#027a48">保留</text>
  <text class="result" x="150" y="205">固定十秒 aggressive-reach 曲线稳定复现</text>
  <text class="metric" x="150" y="230">delta_star 不变；kappa_eff 变化不超过约 0.2%</text>
<path class="connector" d="M112 382 V401"/>
  <rect class="card" x="62" y="274" width="976" height="108" rx="11"/>
  <rect x="62" y="274" width="8" height="108" rx="4" fill="#f04438"/>
  <circle cx="112" cy="306" r="18" fill="#fef3f2" stroke="#f04438" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="312" fill="#b42318">2</text>
  <text class="stage" x="150" y="308">Source-aware 静态扩样本</text>
  <rect x="888" y="290" width="122" height="32" rx="16" fill="#fef3f2" stroke="#f04438" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="311" fill="#b42318">关闭</text>
  <text class="result" x="150" y="337">跨 source / date transport 变差，静态 replacement 关闭</text>
  <text class="metric" x="150" y="362">更多日期没有自动生成更稳的共同曲线</text>
<path class="connector" d="M112 514 V533"/>
  <rect class="card" x="62" y="406" width="976" height="108" rx="11"/>
  <rect x="62" y="406" width="8" height="108" rx="4" fill="#2e90fa"/>
  <circle cx="112" cy="438" r="18" fill="#eff8ff" stroke="#2e90fa" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="444" fill="#175cd3">3</text>
  <text class="stage" x="150" y="440">波动率条件面</text>
  <rect x="888" y="422" width="122" height="32" rx="16" fill="#eff8ff" stroke="#2e90fa" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="443" fill="#175cd3">仅预测</text>
  <text class="result" x="150" y="469">条件状态改善概率校准，但门槛改写不构成独立确认</text>
  <text class="metric" x="150" y="494">prediction evidence only</text>
<path class="connector" d="M112 646 V665"/>
  <rect class="card" x="62" y="538" width="976" height="108" rx="11"/>
  <rect x="62" y="538" width="8" height="108" rx="4" fill="#f04438"/>
  <circle cx="112" cy="570" r="18" fill="#fef3f2" stroke="#f04438" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="576" fill="#b42318">4</text>
  <text class="stage" x="150" y="572">标量报价 adapter</text>
  <rect x="888" y="554" width="122" height="32" rx="16" fill="#fef3f2" stroke="#f04438" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="575" fill="#b42318">关闭</text>
  <text class="result" x="150" y="601">半价差 24.58→13.49，fills 8,799→21,597，terminal MTM −115.66</text>
  <text class="metric" x="150" y="626">机制强、经济显著更差；adapter closed</text>
<path class="connector" d="M112 778 V797"/>
  <rect class="card" x="62" y="670" width="976" height="108" rx="11"/>
  <rect x="62" y="670" width="8" height="108" rx="4" fill="#f79009"/>
  <circle cx="112" cy="702" r="18" fill="#fffaeb" stroke="#f79009" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="708" fill="#b54708">5</text>
  <text class="stage" x="150" y="704">策略可见时钟 transport</text>
  <rect x="888" y="686" width="122" height="32" rx="16" fill="#fffaeb" stroke="#f79009" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="707" fill="#b54708">阻塞</text>
  <text class="result" x="150" y="733">可见时钟下预测仍有增量，但日期、fold 与 feature-state 支持不足</text>
  <text class="metric" x="150" y="758">467,093 decisions；动作门仍阻塞</text>
<path class="connector" d="M112 910 V929"/>
  <rect class="card" x="62" y="802" width="976" height="108" rx="11"/>
  <rect x="62" y="802" width="8" height="108" rx="4" fill="#f04438"/>
  <circle cx="112" cy="834" r="18" fill="#fef3f2" stroke="#f04438" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="840" fill="#b42318">6</text>
  <text class="stage" x="150" y="836">联合报价价值</text>
  <rect x="888" y="818" width="122" height="32" rx="16" fill="#fef3f2" stroke="#f04438" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="839" fill="#b42318">关闭</text>
  <text class="result" x="150" y="865">完整 BUY / SELL 曲线直接进入 joint quote selector</text>
  <text class="metric" x="150" y="890">126 个 OOF buckets 全部选择 baseline</text>

  <rect class="card" x="62" y="934" width="976" height="108" rx="11"/>
  <rect x="62" y="934" width="8" height="108" rx="4" fill="#2e90fa"/>
  <circle cx="112" cy="966" r="18" fill="#eff8ff" stroke="#2e90fa" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="972" fill="#175cd3">7</text>
  <text class="stage" x="150" y="968">Reach-time hazard</text>
  <rect x="888" y="950" width="122" height="32" rx="16" fill="#eff8ff" stroke="#2e90fa" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="971" fill="#175cd3">仅预测</text>
  <text class="result" x="150" y="997">完整 first-passage time surface 在 Development 通过预测门</text>
  <text class="metric" x="150" y="1022">没有 queue / fill / campaign / action authority</text>
  <rect x="62" y="1082" width="976" height="112" rx="11" fill="#eff8ff" stroke="#84caff" stroke-width="1.2"/>
  <text class="take-title" x="88" y="1113">合并后的读法</text>
  <text class="take" x="88" y="1140">• 更准确的触达概率可以让报价更激进、成交更多，同时让终局更差。</text>
  <text class="take" x="88" y="1166">• 下一步必须直接评价 joint quote 的完整生命周期价值。</text>
  <text class="authority" text-anchor="middle" x="550" y="1224">研究支持：P(touch) / reach-time prediction · quote action=false · live=false</text>
</svg>
