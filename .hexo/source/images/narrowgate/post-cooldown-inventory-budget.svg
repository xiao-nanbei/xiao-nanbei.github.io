<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet">
  <title>Post-cooldown inventory budget 的 order-to-fill 漏斗</title>
  <desc>机制示意：冷却释放后预算 B 等于一，许多 SELL add quote 被阻断，但很少对应额外 fill；右侧显示候选网格退化和 Grade-A SELL 冻结聚合。</desc>
  <rect width="1200" height="720" fill="#07111f"/>
  <text x="52" y="55" fill="#f4f7fb" font-size="28" font-family="sans-serif" font-weight="700">Post-cooldown budget：报单变化 ≠ 库存变化</text><text x="52" y="84" fill="#9fb3c8" font-size="16" font-family="sans-serif">机制示意 · 冻结 feasibility aggregation，不含 PnL</text>
  <rect x="60" y="130" width="230" height="90" rx="16" fill="#102238" stroke="#42a5f5" stroke-width="2"/><text x="88" y="166" fill="#9fd8ff" font-size="19" font-family="sans-serif" font-weight="700">baseline release</text><text x="88" y="196" fill="#d6e9f7" font-size="15" font-family="sans-serif">non-flat lineage · q90 OFF</text>
  <path d="M290 175H365" stroke="#657b91" stroke-width="3"/>
  <rect x="365" y="130" width="210" height="90" rx="16" fill="#2d2713" stroke="#f8c15c" stroke-width="2"/><text x="393" y="166" fill="#ffd17c" font-size="19" font-family="sans-serif" font-weight="700">budget B = 1</text><text x="393" y="196" fill="#fff0c9" font-size="15" font-family="sans-serif">首个 extra fill 消耗完</text>
  <path d="M575 175H650" stroke="#657b91" stroke-width="3"/>
  <rect x="650" y="115" width="250" height="120" rx="16" fill="#361b26" stroke="#ff6f7d" stroke-width="2"/><text x="678" y="153" fill="#ff9ca5" font-size="19" font-family="sans-serif" font-weight="700">后续 SELL add blocked</text><text x="678" y="184" fill="#f7d6da" font-size="15" font-family="sans-serif">submit / replace 大量改变</text><text x="678" y="210" fill="#f7d6da" font-size="15" font-family="sans-serif">reducing quote 仍运行</text>
  <g font-family="sans-serif"><text x="70" y="300" fill="#eaf2fb" font-size="18" font-weight="700">Order-layer 漏斗</text><rect x="70" y="325" width="790" height="58" rx="12" fill="#1b3349"/><text x="92" y="361" fill="#d6e9f7" font-size="17">1,659 Grade-A SELL episodes</text><rect x="70" y="405" width="680" height="58" rx="12" fill="#6a3340"/><text x="92" y="441" fill="#ffe0e4" font-size="17">86.14% final quote actions 改变</text><rect x="70" y="485" width="95" height="58" rx="12" fill="#f8c15c"/><text x="185" y="521" fill="#ffd17c" font-size="17">但只减少约 1.1% fills</text></g>
  <rect x="935" y="115" width="215" height="428" rx="17" fill="#0e1c2d"/><text x="960" y="153" fill="#eaf2fb" font-size="19" font-family="sans-serif" font-weight="700">冻结分布</text><text x="960" y="194" fill="#ffd17c" font-size="16" font-family="sans-serif">SELL 1,753 lineages</text><text x="960" y="225" fill="#9fb3c8" font-size="15" font-family="sans-serif">p50 = 0</text><text x="960" y="253" fill="#9fb3c8" font-size="15" font-family="sans-serif">p90 = 1</text><text x="960" y="281" fill="#9fb3c8" font-size="15" font-family="sans-serif">U &gt; 1: 3.31%</text><text x="960" y="309" fill="#9fb3c8" font-size="15" font-family="sans-serif">U &gt; 2: 0.34%</text><path d="M958 335H1128" stroke="#31465b"/><text x="960" y="372" fill="#ff9ca5" font-size="17" font-family="sans-serif" font-weight="700">candidate grid</text><text x="960" y="408" fill="#f4f7fb" font-size="25" font-family="serif">{ 1 }</text><text x="960" y="444" fill="#ff9ca5" font-size="15" font-family="sans-serif">需要 ≥2 个非零候选</text><text x="960" y="481" fill="#f4f7fb" font-size="17" font-family="sans-serif" font-weight="700">mechanics closed</text><text x="960" y="513" fill="#9fb3c8" font-size="14" font-family="sans-serif">reward / PnL 未读</text>
  <rect x="60" y="610" width="1090" height="64" rx="14" fill="#0e1c2d"/><text x="86" y="638" fill="#eaf2fb" font-size="16" font-family="sans-serif">结论：不是 order no-op，而是 fill-path poor lever；q90-OFF mechanics 不等价于当前 live baseline。</text><text x="86" y="661" fill="#9fb3c8" font-size="15" font-family="sans-serif">Validation / holdout 未读，没有创建 randomized economic action。</text>
</svg>
