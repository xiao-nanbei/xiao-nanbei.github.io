<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1100" viewBox="0 0 1100 1100" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">同一段 K 线上的 Python 与 C++ 报价 parity 及其证据边界</title>
  <desc id="desc">上方示意图显示 Python 与 C++ 在相同归一化输入和相同模型假设下得到重合的 bid 与 ask 报价轨迹。下方强调这只能证明实现一致，仍需独立审计 touch 与 fill、weighted-mid 与 microprice、数量单位和时间期限的语义。图为机制示意，不是实盘或 benchmark 证据。</desc>
  <defs>
    <style>
      .bg{fill:#fbfcfe}.plot{fill:#fff;stroke:#d0d5dd;stroke-width:1.2}.grid{stroke:#eaecf0;stroke-width:1}.axis{stroke:#667085;stroke-width:1.3}.divider{stroke:#98a2b3;stroke-width:1.2;stroke-dasharray:5 5}.wick{stroke:#344054;stroke-width:1.5}.up{fill:#fff;stroke:#039855;stroke-width:1.8}.down{fill:#f97066;stroke:#b42318;stroke-width:1.8}.mid{fill:none;stroke:#667085;stroke-width:2;stroke-dasharray:7 5}.bid{fill:none;stroke:#039855;stroke-width:3}.ask{fill:none;stroke:#d92d20;stroke-width:3}.py-mark{fill:#fff;stroke:#101828;stroke-width:1.8}.cpp-mark{stroke:#175cd3;stroke-width:2}.callout{fill:#eff8ff;stroke:#175cd3;stroke-width:1.3}.pass{fill:#ecfdf3;stroke:#039855;stroke-width:1.4}.boundary{fill:#fff4ed;stroke:#b54708;stroke-width:1.4}.neutral{fill:#fff;stroke:#98a2b3;stroke-width:1.3}.arrow{stroke:#667085;stroke-width:2;fill:none;marker-end:url(#arr)}.title{font:500 24px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#101828}.heading{font:500 17px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#101828}.text{font:400 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#344054}.small{font:400 12px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475467}.mono{font:400 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#344054}.pass-text{font:500 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#027a48}.warn-text{font:500 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#b54708}
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#667085"/></marker>
    <clipPath id="plot-clip"><rect x="82" y="140" width="936" height="330"/></clipPath>
  </defs>

  <rect class="bg" width="1100" height="1100"/>
  <text class="title" x="40" y="42">双引擎在 K 线上重合，只回答“是否执行同一实现”</text>
  <text class="text" x="40" y="69">相同 normalized arrays、相同状态与相同参数，应该产生同一条报价与订单状态路径。</text>

  <rect class="plot" x="40" y="102" width="1020" height="410" rx="10"/>
  <text class="heading" x="82" y="130">示意报价轨迹：Python ○ 与 C++ ＋ 位于同一坐标</text>
  <line class="grid" x1="82" y1="180" x2="1018" y2="180"/><line class="grid" x1="82" y1="250" x2="1018" y2="250"/><line class="grid" x1="82" y1="320" x2="1018" y2="320"/><line class="grid" x1="82" y1="390" x2="1018" y2="390"/><line class="grid" x1="82" y1="470" x2="1018" y2="470"/>
  <line class="axis" x1="82" y1="140" x2="82" y2="470"/><line class="axis" x1="82" y1="470" x2="1018" y2="470"/>
  <text class="small" x="74" y="184" text-anchor="end">101.0</text><text class="small" x="74" y="254" text-anchor="end">100.5</text><text class="small" x="74" y="324" text-anchor="end">100.0</text><text class="small" x="74" y="394" text-anchor="end">99.5</text><text class="small" x="74" y="474" text-anchor="end">99.0</text>
  <text class="small" x="82" y="493">0</text><text class="small" x="530" y="493">30</text><text class="small" x="992" y="493">60 s</text>
  <text class="small" transform="translate(24 390) rotate(-90)">归一化价格指数</text>

  <g clip-path="url(#plot-clip)">
    <line class="wick" x1="122" y1="292" x2="122" y2="354"/><rect class="up" x="109" y="310" width="26" height="24"/>
    <line class="wick" x1="196" y1="270" x2="196" y2="334"/><rect class="up" x="183" y="288" width="26" height="22"/>
    <line class="wick" x1="270" y1="256" x2="270" y2="319"/><rect class="down" x="257" y="288" width="26" height="16"/>
    <line class="wick" x1="344" y1="278" x2="344" y2="348"/><rect class="down" x="331" y="304" width="26" height="25"/>
    <line class="wick" x1="418" y1="247" x2="418" y2="331"/><rect class="up" x="405" y="274" width="26" height="55"/>
    <line class="wick" x1="492" y1="218" x2="492" y2="292"/><rect class="up" x="479" y="236" width="26" height="38"/>
    <line class="wick" x1="566" y1="226" x2="566" y2="303"/><rect class="down" x="553" y="236" width="26" height="49"/>
    <line class="wick" x1="640" y1="258" x2="640" y2="347"/><rect class="down" x="627" y="285" width="26" height="42"/>
    <line class="wick" x1="714" y1="234" x2="714" y2="329"/><rect class="up" x="701" y="259" width="26" height="68"/>
    <line class="wick" x1="788" y1="202" x2="788" y2="279"/><rect class="up" x="775" y="222" width="26" height="37"/>
    <line class="wick" x1="862" y1="211" x2="862" y2="292"/><rect class="down" x="849" y="222" width="26" height="50"/>
    <line class="wick" x1="936" y1="230" x2="936" y2="314"/><rect class="up" x="923" y="251" width="26" height="21"/>
    <path class="mid" d="M95 322 C180 299 256 282 335 311 S433 253 500 254 S612 307 671 289 S760 230 824 240 S913 277 1005 258"/>
    <path class="ask" d="M95 269 C180 246 256 229 335 258 S433 200 500 201 S612 254 671 236 S760 177 824 187 S913 224 1005 205"/>
    <path class="bid" d="M95 375 C180 352 256 335 335 364 S433 306 500 307 S612 360 671 342 S760 283 824 293 S913 330 1005 311"/>
  </g>

  <g aria-label="Python 与 C++ 重合标记">
    <circle class="py-mark" cx="196" cy="246" r="6"/><path class="cpp-mark" d="M190 246 H202 M196 240 V252"/>
    <circle class="py-mark" cx="418" cy="200" r="6"/><path class="cpp-mark" d="M412 200 H424 M418 194 V206"/>
    <circle class="py-mark" cx="640" cy="248" r="6"/><path class="cpp-mark" d="M634 248 H646 M640 242 V254"/>
    <circle class="py-mark" cx="862" cy="203" r="6"/><path class="cpp-mark" d="M856 203 H868 M862 197 V209"/>
    <circle class="py-mark" cx="196" cy="352" r="6"/><path class="cpp-mark" d="M190 352 H202 M196 346 V358"/>
    <circle class="py-mark" cx="418" cy="306" r="6"/><path class="cpp-mark" d="M412 306 H424 M418 300 V312"/>
    <circle class="py-mark" cx="640" cy="354" r="6"/><path class="cpp-mark" d="M634 354 H646 M640 348 V360"/>
    <circle class="py-mark" cx="862" cy="309" r="6"/><path class="cpp-mark" d="M856 309 H868 M862 303 V315"/>
  </g>

  <rect class="callout" x="700" y="400" width="286" height="48" rx="7"/>
  <text class="text" x="720" y="421">同一点：quote price、side action、</text><text class="text" x="720" y="440">库存状态迁移应一致或有明确 tolerance</text>
  <path class="arrow" d="M820 400 L788 333"/>

  <g transform="translate(86 538)">
    <line class="ask" x1="0" y1="0" x2="34" y2="0"/><text class="small" x="44" y="4">ask 轨迹</text>
    <line class="bid" x1="150" y1="0" x2="184" y2="0"/><text class="small" x="194" y="4">bid 轨迹</text>
    <circle class="py-mark" cx="334" cy="0" r="6"/><text class="small" x="348" y="4">Python ○</text>
    <path class="cpp-mark" d="M458 0 H470 M464 -6 V6"/><text class="small" x="478" y="4">C++ ＋</text>
    <line class="mid" x1="584" y1="0" x2="618" y2="0"/><text class="small" x="628" y="4">K 线中轴</text>
    <text class="small" x="770" y="4">机制示意，非实盘证据</text>
  </g>

  <rect class="neutral" x="40" y="576" width="252" height="92" rx="8"/>
  <text class="heading" x="62" y="607">同一输入与合同</text>
  <text class="small" x="62" y="632">时间戳、tick / lot rounding、</text><text class="small" x="62" y="652">feature state、参数、事件顺序</text>
  <path class="arrow" d="M292 622 H330"/>

  <rect class="pass" x="330" y="576" width="322" height="92" rx="8"/>
  <text class="pass-text" x="352" y="607">✓ parity 能证明</text>
  <text class="small" x="352" y="632">Python 与 C++ 执行同一实现，</text><text class="small" x="352" y="652">路径、金额和边界行为可比较。</text>
  <path class="arrow" d="M652 622 H690"/>

  <rect class="boundary" x="690" y="576" width="370" height="92" rx="8"/>
  <text class="warn-text" x="712" y="607">✕ parity 不能证明模型语义正确</text>
  <text class="small" x="712" y="632">仍需独立检查：touch ≠ fill intensity；</text><text class="small" x="712" y="652">weighted-mid ≠ microprice；数量单位与时钟闭合。</text>

  <text class="small" x="550" y="695" text-anchor="middle">上半部分只描述实现 parity；下半部分列出仍需独立验证的模型语义。</text>

  <line class="divider" x1="40" y1="730" x2="1060" y2="730"/>
  <text class="heading" x="40" y="765">三类“两个引擎都可能同时做错”的语义</text>

  <rect class="boundary" x="40" y="792" width="310" height="206" rx="9"/>
  <text class="warn-text" x="62" y="824">① touch 不是 execution intensity</text>
  <text class="mono" x="62" y="855">P_touch(δ, 10s)</text>
  <text class="text" x="62" y="885">只问固定期限内盘口是否触价；</text>
  <text class="text" x="62" y="910">真实 fill 还要经过 queue ahead、</text>
  <text class="text" x="62" y="935">主动成交量和订单生命周期。</text>
  <text class="small" x="62" y="969">不能直接改名为 k_exec 后送入公式。</text>

  <rect class="boundary" x="395" y="792" width="310" height="206" rx="9"/>
  <text class="warn-text" x="417" y="824">② weighted-mid 不是 microprice</text>
  <text class="mono" x="417" y="855">m_w = f(BBO, Q_b, Q_a)</text>
  <text class="text" x="417" y="885">它描述当前盘口数量不平衡；</text>
  <text class="text" x="417" y="910">没有估计订单簿状态转移，</text>
  <text class="text" x="417" y="935">也不是未来价格条件期望。</text>
  <text class="small" x="417" y="969">名称一致性必须在 parity 之外审计。</text>

  <rect class="boundary" x="750" y="792" width="310" height="206" rx="9"/>
  <text class="warn-text" x="772" y="824">③ 数量单位与时钟要闭合</text>
  <text class="mono" x="772" y="855">z、γ、k_exec、σ²τ</text>
  <text class="text" x="772" y="885">订单量 z 是否显式进入公式；</text>
  <text class="text" x="772" y="910">60×1s lookback、1s risk horizon、</text>
  <text class="text" x="772" y="935">5–10s 报价寿命不能混成一个钟。</text>
  <text class="small" x="772" y="969">两套引擎一致不代表经济期限一致。</text>

  <rect class="neutral" x="40" y="1020" width="1020" height="42" rx="8"/>
  <text class="text" x="550" y="1047" text-anchor="middle">正确顺序：先做 semantic contract 审计，再用 Python / C++ parity 防止工程实现分叉。</text>
  <text class="small" x="550" y="1085" text-anchor="middle">机制示意，非实盘证据；K 线与报价为归一化绘图值，不表示历史 benchmark、当前 live 状态、动作权限或经济效果。</text>
</svg>
