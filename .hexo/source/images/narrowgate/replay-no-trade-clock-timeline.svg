<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790" role="img" aria-labelledby="title desc">
  <title id="title">没有 trade 的十秒里，旧 replay 与 merged causal clock 的差异</title>
  <desc id="desc">上半部分显示旧 trade-driven replay 只在两笔成交到来时推进时钟，使 TTL、cooldown、requote、feature-ready 与 markout 在中间十秒冻结。下半部分显示 merged causal stream 用 book、timer、ACK 与 feature-ready 事件推进生命周期，同时只有真实成交可以消费 queue 或制造 fill。底部给出公开 diagnostic day 的结果变化，强调它不是 alpha 结论，而是旧证据身份失效的证明。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475467"/></marker>
    <style>
      .bg{fill:#fbfcfe}.frame{fill:#fff;stroke:#d0d5dd;stroke-width:1.2}.legacy{fill:#fef3f2;stroke:#f04438;stroke-width:1.2}.merged{fill:#eff8ff;stroke:#2e90fa;stroke-width:1.2}.axis{stroke:#475467;stroke-width:2;marker-end:url(#arrow)}.tick{stroke:#98a2b3;stroke-width:1}.freeze{stroke:#d92d20;stroke-width:8;stroke-linecap:round}.progress{stroke:#1570ef;stroke-width:8;stroke-linecap:round}.trade{fill:#b42318}.timer{fill:#1570ef}.book{fill:#039855}.ack{fill:#7f56d9}.feature{fill:#f79009}.cross{stroke:#b42318;stroke-width:2}.note{fill:#fff7ed;stroke:#f79009;stroke-width:1.2}
      .title{font:600 24px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#101828}.text{font:600 16px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#101828}.small{font:500 13px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#344054}.tiny{font:400 11px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#667085}.mono{font:500 12px ui-monospace,SFMono-Regular,Menlo,"PingFang SC",monospace;fill:#344054}.red{fill:#b42318}.blue{fill:#175cd3}.green{fill:#027a48}.amber{fill:#b54708}
    </style>
  </defs>
  <rect class="bg" width="1100" height="790"/>
  <text class="title" x="40" y="44">没有 trade 的十秒，订单生命周期仍然在前进</text>
  <text class="tiny" x="40" y="70">合成机制示意：事件位置用于解释 scheduler contract，不是实盘逐笔记录。</text>

  <rect class="legacy" x="42" y="100" width="1016" height="242" rx="11"/>
  <text class="text red" x="66" y="132">旧 trade-driven replay</text>
  <text class="small" x="66" y="156">全局时钟被 trade_ts 绑住；中间没有成交，就没有生命周期事件。</text>
  <line class="axis" x1="120" y1="228" x2="998" y2="228"/>
  <circle class="trade" cx="140" cy="228" r="10"/><circle class="trade" cx="970" cy="228" r="10"/>
  <text class="tiny" text-anchor="middle" x="140" y="205">trade @ t₀</text><text class="tiny" text-anchor="middle" x="970" y="205">trade @ t₁₀</text>
  <line class="freeze" x1="180" y1="272" x2="930" y2="272"/>
  <text class="small red" text-anchor="middle" x="555" y="300">TTL · cooldown · requote · bucket close · markout 全部冻结</text>
  <line class="cross" x1="486" y1="186" x2="516" y2="216"/><line class="cross" x1="516" y1="186" x2="486" y2="216"/>
  <text class="tiny red" text-anchor="middle" x="501" y="180">本应发生的 timer / ready event 被跳过</text>

  <rect class="merged" x="42" y="368" width="1016" height="270" rx="11"/>
  <text class="text blue" x="66" y="400">Merged causal event stream</text>
  <text class="small" x="66" y="424">每次取下一个合法 book、trade、timer、ACK 或 feature-ready 事件；synthetic timer 不能消费 queue。</text>
  <line class="axis" x1="120" y1="502" x2="998" y2="502"/>
  <circle class="trade" cx="140" cy="502" r="10"/><circle class="trade" cx="970" cy="502" r="10"/>
  <text class="tiny" text-anchor="middle" x="140" y="478">trade</text><text class="tiny" text-anchor="middle" x="970" y="478">trade</text>
  <circle class="timer" cx="220" cy="502" r="5"/><circle class="timer" cx="300" cy="502" r="5"/><circle class="timer" cx="380" cy="502" r="5"/><circle class="timer" cx="460" cy="502" r="5"/><circle class="timer" cx="540" cy="502" r="5"/><circle class="timer" cx="620" cy="502" r="5"/><circle class="timer" cx="700" cy="502" r="5"/><circle class="timer" cx="780" cy="502" r="5"/><circle class="timer" cx="860" cy="502" r="5"/><circle class="timer" cx="930" cy="502" r="5"/>
  <polygon class="book" points="344,486 356,510 332,510"/><polygon class="book" points="744,486 756,510 732,510"/>
  <rect class="feature" x="532" y="488" width="16" height="28" rx="3"/><rect class="ack" x="692" y="488" width="16" height="28" rx="3"/>
  <line class="progress" x1="180" y1="558" x2="930" y2="558"/>
  <text class="small blue" text-anchor="middle" x="555" y="586">生命周期按物理时间推进；订单可在下一笔 trade 之前 requote、expire 或收到 cancel ACK</text>
  <circle class="timer" cx="118" cy="613" r="5"/><text class="tiny" x="132" y="617">100ms timer</text>
  <polygon class="book" points="258,602 270,626 246,626"/><text class="tiny" x="282" y="617">book state</text>
  <rect class="feature" x="404" y="603" width="16" height="24" rx="3"/><text class="tiny" x="432" y="617">feature-ready</text>
  <rect class="ack" x="570" y="603" width="16" height="24" rx="3"/><text class="tiny" x="598" y="617">cancel ACK</text>
  <circle class="trade" cx="742" cy="615" r="8"/><text class="tiny" x="758" y="619">真实 trade：唯一可消费 queue 的事件</text>

  <rect class="note" x="42" y="668" width="1016" height="78" rx="10"/>
  <text class="text amber" x="68" y="699">公开 diagnostic day：路径身份改变，而不是发现 alpha</text>
  <text class="mono" x="68" y="725">legacy: 178 fills / −0.97 USDC    →    merged: 184 fills / +1.18 USDC</text>
  <text class="tiny" x="68" y="742">同一输入在 scheduler 修复后发生非线性分叉，因此旧 absolute PnL、winner 与参数排名不能继续搬运。</text>
  <text class="tiny" text-anchor="middle" x="550" y="776">修复合同：book ∪ trade ∪ timer ∪ ACK ∪ feature-ready · same-input parity 仍不等于经济有效性</text>
</svg>
