<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1100" viewBox="0 0 1100 1100" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">同一段 K 线下，库存如何整体移动 reservation price 与双边报价</title>
  <desc id="desc">左右两幅图使用完全相同的示意 K 线、fair price 和半价差。左侧库存为零，reservation price 与 fair price 重合；右侧库存为正，reservation price、bid 和 ask 同时下移。图为机制示意，不是实盘或回测证据。</desc>
  <defs>
    <style>
      .bg{fill:#fbfcfe}.panel{fill:#fff;stroke:#d0d5dd;stroke-width:1.2}.guide{fill:#fff;stroke:#d0d5dd;stroke-width:1.2}.grid{stroke:#eaecf0;stroke-width:1}.axis{stroke:#667085;stroke-width:1.3}.divider{stroke:#98a2b3;stroke-width:1.2;stroke-dasharray:5 5}.wick{stroke:#344054;stroke-width:1.5}.up{fill:#fff;stroke:#039855;stroke-width:1.8}.down{fill:#f97066;stroke:#b42318;stroke-width:1.8}.fair{fill:none;stroke:#667085;stroke-width:2;stroke-dasharray:7 5}.center{fill:none;stroke:#175cd3;stroke-width:3}.bid{fill:none;stroke:#039855;stroke-width:2.6}.ask{fill:none;stroke:#d92d20;stroke-width:2.6}.inventory{stroke:#7f56d9;stroke-width:2.5;marker-end:url(#arrow-purple)}.bracket{stroke:#7f56d9;stroke-width:2}.arrow-gray{stroke:#667085;stroke-width:2;fill:none;marker-end:url(#arrow-gray)}.title{font:500 24px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#101828}.heading{font:500 17px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#101828}.text{font:400 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#344054}.small{font:400 12px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475467}.mono{font:400 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#344054}.note{font:500 13px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#6941c6}.legend-line{stroke-width:3}.marker-bid{fill:#fff;stroke:#039855;stroke-width:2}.marker-ask{fill:#fff;stroke:#d92d20;stroke-width:2}
    </style>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7f56d9"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#667085"/></marker>
    <clipPath id="clip-left"><rect x="70" y="150" width="440" height="360"/></clipPath>
    <clipPath id="clip-right"><rect x="70" y="150" width="440" height="360"/></clipPath>
    <g id="candles-left">
      <line class="wick" x1="98" y1="316" x2="98" y2="387"/><rect class="up" x="89" y="340" width="18" height="27"/>
      <line class="wick" x1="132" y1="288" x2="132" y2="358"/><rect class="up" x="123" y="310" width="18" height="30"/>
      <line class="wick" x1="166" y1="272" x2="166" y2="337"/><rect class="down" x="157" y="310" width="18" height="18"/>
      <line class="wick" x1="200" y1="298" x2="200" y2="369"/><rect class="down" x="191" y="328" width="18" height="24"/>
      <line class="wick" x1="234" y1="281" x2="234" y2="350"/><rect class="up" x="225" y="305" width="18" height="47"/>
      <line class="wick" x1="268" y1="247" x2="268" y2="320"/><rect class="up" x="259" y="270" width="18" height="35"/>
      <line class="wick" x1="302" y1="231" x2="302" y2="302"/><rect class="down" x="293" y="270" width="18" height="17"/>
      <line class="wick" x1="336" y1="250" x2="336" y2="331"/><rect class="down" x="327" y="287" width="18" height="28"/>
      <line class="wick" x1="370" y1="235" x2="370" y2="316"/><rect class="up" x="361" y="262" width="18" height="53"/>
      <line class="wick" x1="404" y1="206" x2="404" y2="279"/><rect class="up" x="395" y="229" width="18" height="33"/>
      <line class="wick" x1="438" y1="219" x2="438" y2="290"/><rect class="down" x="429" y="229" width="18" height="42"/>
      <line class="wick" x1="472" y1="235" x2="472" y2="304"/><rect class="up" x="463" y="251" width="18" height="20"/>
    </g>
  </defs>

  <rect class="bg" width="1100" height="1100"/>
  <text class="title" x="40" y="42">库存不是只改一侧：它先移动报价中心，再生成 bid / ask</text>
  <text class="text" x="40" y="68">两幅图的 K 线、fair price、波动和半价差完全相同；唯一改变的是库存 q。</text>

  <rect class="panel" x="36" y="104" width="500" height="478" rx="10"/>
  <rect class="panel" x="564" y="104" width="500" height="478" rx="10"/>
  <text class="heading" x="70" y="134">A　q = 0：reservation center 与 fair 重合</text>
  <text class="heading" x="590" y="134">B　q &gt; 0（多头）：三条报价轨迹整体下移</text>

  <g>
    <line class="grid" x1="70" y1="190" x2="510" y2="190"/><line class="grid" x1="70" y1="270" x2="510" y2="270"/><line class="grid" x1="70" y1="350" x2="510" y2="350"/><line class="grid" x1="70" y1="430" x2="510" y2="430"/><line class="grid" x1="70" y1="510" x2="510" y2="510"/>
    <line class="axis" x1="70" y1="150" x2="70" y2="510"/><line class="axis" x1="70" y1="510" x2="510" y2="510"/>
    <text class="small" x="62" y="194" text-anchor="end">101.0</text><text class="small" x="62" y="274" text-anchor="end">100.5</text><text class="small" x="62" y="354" text-anchor="end">100.0</text><text class="small" x="62" y="434" text-anchor="end">99.5</text><text class="small" x="62" y="514" text-anchor="end">99.0</text>
    <text class="small" x="70" y="532">0</text><text class="small" x="274" y="532">30</text><text class="small" x="494" y="532">60 s</text>
    <text class="small" transform="translate(20 374) rotate(-90)">归一化价格指数</text>
    <g clip-path="url(#clip-left)"><use href="#candles-left"/>
      <path class="fair" d="M82 337 C130 320 164 303 202 326 S270 264 308 274 S374 248 410 226 S462 263 498 247"/>
      <path class="center" d="M82 337 C130 320 164 303 202 326 S270 264 308 274 S374 248 410 226 S462 263 498 247"/>
      <path class="ask" d="M82 293 C130 276 164 259 202 282 S270 220 308 230 S374 204 410 182 S462 219 498 203"/>
      <path class="bid" d="M82 381 C130 364 164 347 202 370 S270 308 308 318 S374 292 410 270 S462 307 498 291"/>
    </g>
    <circle class="marker-bid" cx="202" cy="370" r="4"/><circle class="marker-bid" cx="410" cy="270" r="4"/>
    <path class="marker-ask" d="M202 276 l6 10 h-12 z"/><path class="marker-ask" d="M410 176 l6 10 h-12 z"/>
    <text class="note" x="90" y="557">r₀(t) = fair(t)</text>
  </g>

  <g>
    <line class="grid" x1="590" y1="190" x2="1030" y2="190"/><line class="grid" x1="590" y1="270" x2="1030" y2="270"/><line class="grid" x1="590" y1="350" x2="1030" y2="350"/><line class="grid" x1="590" y1="430" x2="1030" y2="430"/><line class="grid" x1="590" y1="510" x2="1030" y2="510"/>
    <line class="axis" x1="590" y1="150" x2="590" y2="510"/><line class="axis" x1="590" y1="510" x2="1030" y2="510"/>
    <text class="small" x="582" y="194" text-anchor="end">101.0</text><text class="small" x="582" y="274" text-anchor="end">100.5</text><text class="small" x="582" y="354" text-anchor="end">100.0</text><text class="small" x="582" y="434" text-anchor="end">99.5</text><text class="small" x="582" y="514" text-anchor="end">99.0</text>
    <text class="small" x="590" y="532">0</text><text class="small" x="794" y="532">30</text><text class="small" x="1014" y="532">60 s</text>
    <text class="small" transform="translate(540 374) rotate(-90)">归一化价格指数</text>
    <g clip-path="url(#clip-right)" transform="translate(520 0)"><use href="#candles-left"/>
      <path class="fair" d="M82 337 C130 320 164 303 202 326 S270 264 308 274 S374 248 410 226 S462 263 498 247"/>
      <path class="center" d="M82 389 C130 372 164 355 202 378 S270 316 308 326 S374 300 410 278 S462 315 498 299"/>
      <path class="ask" d="M82 345 C130 328 164 311 202 334 S270 272 308 282 S374 256 410 234 S462 271 498 255"/>
      <path class="bid" d="M82 433 C130 416 164 399 202 422 S270 360 308 370 S374 344 410 322 S462 359 498 343"/>
    </g>
    <line class="bracket" x1="1010" y1="247" x2="1010" y2="299"/><line class="bracket" x1="1004" y1="247" x2="1016" y2="247"/><line class="bracket" x1="1004" y1="299" x2="1016" y2="299"/>
    <text class="note" x="817" y="557">r_long(t) = fair(t) − qγσ²τ</text>
    <path class="inventory" d="M986 255 V292"/><text class="small" x="814" y="486">库存中心偏移 Δinventory</text>
    <circle class="marker-bid" cx="722" cy="422" r="4"/><circle class="marker-bid" cx="930" cy="322" r="4"/>
    <path class="marker-ask" d="M722 328 l6 10 h-12 z"/><path class="marker-ask" d="M930 228 l6 10 h-12 z"/>
  </g>

  <g transform="translate(48 612)">
    <line class="fair legend-line" x1="0" y1="0" x2="34" y2="0"/><text class="small" x="44" y="4">fair / K 线中轴</text>
    <line class="center legend-line" x1="184" y1="0" x2="218" y2="0"/><text class="small" x="228" y="4">reservation center r</text>
    <line class="bid legend-line" x1="430" y1="0" x2="464" y2="0"/><circle class="marker-bid" cx="447" cy="0" r="4"/><text class="small" x="474" y="4">bid ○</text>
    <line class="ask legend-line" x1="568" y1="0" x2="602" y2="0"/><path class="marker-ask" d="M585 -6 l6 10 h-12 z"/><text class="small" x="612" y="4">ask △</text>
    <rect class="up" x="728" y="-10" width="12" height="20"/><text class="small" x="750" y="4">上涨 K 线（空心）</text>
    <rect class="down" x="894" y="-10" width="12" height="20"/><text class="small" x="916" y="4">下跌 K 线（实心）</text>
  </g>
  <text class="text" x="550" y="657" text-anchor="middle">多头库存下移 bid：减少继续买入的积极性；同时下移 ask：更愿意卖出以降低库存。</text>
  <text class="small" x="550" y="686" text-anchor="middle">两幅图只改变 q；K 线、fair、波动与半价差 h 都保持相同。</text>

  <line class="divider" x1="40" y1="730" x2="1060" y2="730"/>
  <text class="heading" x="40" y="765">从库存状态到报单结果：同一个偏移量沿着报价链传递</text>

  <rect class="guide" x="40" y="792" width="280" height="178" rx="9"/>
  <text class="heading" x="62" y="824">① 输入状态</text>
  <text class="mono" x="62" y="855">q &gt; 0，γ &gt; 0，σ²τ &gt; 0</text>
  <text class="text" x="62" y="889">当前持有多头库存，未来价格方差</text>
  <text class="text" x="62" y="913">会给继续持有增加风险成本。</text>
  <text class="small" x="62" y="946">这里不改变 K 线，也不改变 h。</text>

  <path class="arrow-gray" d="M320 881 H370"/>
  <rect class="guide" x="370" y="792" width="360" height="178" rx="9"/>
  <text class="heading" x="392" y="824">② reservation center 下移</text>
  <text class="mono" x="392" y="855">Δr = −qγσ²τ</text>
  <text class="mono" x="392" y="887">Δbid = Δask = Δr</text>
  <text class="text" x="392" y="921">先移动中心，再围绕新中心生成双边报价；</text>
  <text class="small" x="392" y="946">它不是只对 bid 或 ask 单独打补丁。</text>

  <path class="arrow-gray" d="M730 881 H780"/>
  <rect class="guide" x="780" y="792" width="280" height="178" rx="9"/>
  <text class="heading" x="802" y="824">③ 两侧经济含义不同</text>
  <text class="text" x="802" y="857">bid 下移：继续买入更难成交，</text>
  <text class="text" x="802" y="881">减少扩大多头库存的倾向。</text>
  <text class="text" x="802" y="917">ask 下移：更接近市场，</text>
  <text class="text" x="802" y="941">更愿意卖出以降低库存。</text>

  <rect class="guide" x="40" y="994" width="1020" height="48" rx="8"/>
  <text class="text" x="60" y="1024">读图要点：库存偏移决定“整套报价往哪移”；波动、流动性和 guard 再决定“bid / ask 离中心多远”。</text>
  <text class="small" x="550" y="1074" text-anchor="middle">机制示意，非实盘证据；价格、K 线与偏移量均为归一化绘图值，不代表任何历史日期、当前 live 参数或经济效果。</text>
</svg>
