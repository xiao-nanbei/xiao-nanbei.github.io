<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet">
  <title>SELL add inventory price penalty 的 K 线报价机制</title>
  <desc>机制示意：随着 SHORT units 增加，候选 SELL ask 向外移动 0.5、1.0、1.5 basis points，展示 fill retention 和风险指标之间的权衡。</desc>
  <rect width="1200" height="720" fill="#07111f"/>
  <text x="52" y="55" fill="#f4f7fb" font-size="28" font-family="sans-serif" font-weight="700">SELL add price penalty：更少库存，也更少参与</text><text x="52" y="84" fill="#9fb3c8" font-size="16" font-family="sans-serif">机制示意 · flat opener 与 reducing BUY 不变</text>
  <g stroke="#24374b"><path d="M60 145H730M60 245H730M60 345H730M60 445H730M60 545H730"/></g>
  <path d="M75 450C175 390 250 430 330 345S485 300 565 235S665 205 720 180" fill="none" stroke="#f8c15c" stroke-width="4"/>
  <g font-family="sans-serif"><path d="M170 330V470" stroke="#ff6f7d" stroke-width="4"/><rect x="154" y="365" width="32" height="68" fill="#ff6f7d"/><path d="M300 290V420" stroke="#ff6f7d" stroke-width="4"/><rect x="284" y="320" width="32" height="65" fill="#ff6f7d"/><path d="M430 240V370" stroke="#ff6f7d" stroke-width="4"/><rect x="414" y="275" width="32" height="60" fill="#ff6f7d"/><path d="M560 180V320" stroke="#ff6f7d" stroke-width="4"/><rect x="544" y="220" width="32" height="65" fill="#ff6f7d"/></g>
  <g stroke-width="3" stroke-dasharray="9 6"><path d="M120 400H670" stroke="#9fb3c8"/><path d="M170 365H670" stroke="#9fd8ff"/><path d="M300 315H670" stroke="#ffd17c"/><path d="M430 255H670" stroke="#ff9ca5"/></g>
  <g font-family="sans-serif" font-size="15"><text x="80" y="392" fill="#9fb3c8">baseline ask</text><text x="570" y="355" fill="#9fd8ff">SHORT 1: +0.5 bps</text><text x="570" y="305" fill="#ffd17c">SHORT 2: +1.0 bps</text><text x="570" y="245" fill="#ff9ca5">SHORT ≥3: +1.5 bps</text></g>
  <rect x="775" y="125" width="370" height="420" rx="17" fill="#0e1c2d"/><text x="803" y="165" fill="#eaf2fb" font-size="19" font-family="sans-serif" font-weight="700">Grade-A 冻结聚合</text><text x="803" y="205" fill="#9fb3c8" font-size="16" font-family="sans-serif">action change 100%</text><text x="803" y="238" fill="#ff9ca5" font-size="16" font-family="sans-serif">SELL-add fill retention 60.98%</text><text x="803" y="271" fill="#ff9ca5" font-size="16" font-family="sans-serif">activity retention 73.74%</text><path d="M802 298H1118" stroke="#31465b"/><text x="803" y="335" fill="#63deb0" font-size="16" font-family="sans-serif">max inventory avoidance：pass</text><text x="803" y="368" fill="#63deb0" font-size="16" font-family="sans-serif">inventory time / MAE：改善</text><text x="803" y="411" fill="#ff9ca5" font-size="16" font-family="sans-serif">reward -0.001339</text><text x="803" y="441" fill="#ff9ca5" font-size="15" font-family="sans-serif">95% CI [-0.011489,+0.009242]</text><text x="803" y="485" fill="#f4f7fb" font-size="18" font-family="sans-serif" font-weight="700">risk control evidence only</text><text x="803" y="515" fill="#9fb3c8" font-size="14" font-family="sans-serif">不是 strategy candidate</text>
  <rect x="60" y="610" width="1085" height="65" rx="14" fill="#0e1c2d"/><text x="88" y="639" fill="#eaf2fb" font-size="16" font-family="sans-serif">少成交同时移除 toxic 与 good fills；完整 campaign terminal 才是 estimand。</text><text x="88" y="662" fill="#9fb3c8" font-size="15" font-family="sans-serif">q90 OFF · Validation / holdout 未读 · 固定 0.5/1.0/1.5 bps curve 已关闭</text>
</svg>

