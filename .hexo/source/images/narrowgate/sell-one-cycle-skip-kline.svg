<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">库存动作与参与度：待验证问题</title>
  <desc id="desc">原图主题：SELL add 单周期跳过与 repair、trend-through 竞争风险。旧结果曲线、数值和通过／关闭判断已撤出。冷却或重新准入的时机，能否减少不利敞口且不压制有价值的库存修复？ 当前已验收数据在对应研究报告中单独保留；本图是研究方法图，不是新实验结果。</desc>
  <rect width="1100" height="520" fill="#f5f7fb"/>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
