    <rect x="390" y="266" width="320" height="110" rx="12" fill="white" stroke="#cbd5e4"/><text x="410" y="303" font-size="20" fill="#18243a">02 定义比较</text><text x="410" y="342" font-size="17" fill="#50617a">可见信息、动作与风险集</text>
