<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">分侧 taker flow 与 maker 决策机制示意</title>
  <desc id="desc">示意 K 线、主动卖出和买入流、BUY 与 SELL maker 报单，以及 parent aggregate feature-ready 后才允许使用的状态。</desc>
  <rect width="960" height="520" fill="#0b1020"/>
  <text x="42" y="46" fill="#f4f7ff" font-size="24" font-family="sans-serif">Side-specific taker flow：机制示意</text>
  <line x1="70" y1="390" x2="900" y2="390" stroke="#59657a"/>
  <g stroke-width="3">
    <line x1="140" y1="180" x2="140" y2="350" stroke="#43d17d"/><rect x="122" y="235" width="36" height="72" fill="#43d17d"/>
    <line x1="255" y1="150" x2="255" y2="315" stroke="#43d17d"/><rect x="237" y="190" width="36" height="68" fill="#43d17d"/>
    <line x1="370" y1="165" x2="370" y2="340" stroke="#ff667d"/><rect x="352" y="210" width="36" height="88" fill="#ff667d"/>
    <line x1="485" y1="210" x2="485" y2="380" stroke="#ff667d"/><rect x="467" y="245" width="36" height="92" fill="#ff667d"/>
    <line x1="600" y1="195" x2="600" y2="355" stroke="#43d17d"/><rect x="582" y="235" width="36" height="74" fill="#43d17d"/>
    <line x1="715" y1="160" x2="715" y2="330" stroke="#43d17d"/><rect x="697" y="205" width="36" height="72" fill="#43d17d"/>
  </g>
  <path d="M335 105 L455 180" stroke="#ff667d" stroke-width="6" marker-end="url(#a)"/>
  <text x="250" y="92" fill="#ff9aac" font-size="18" font-family="sans-serif">aggressive SELL burst</text>
  <line x1="455" y1="338" x2="455" y2="410" stroke="#ffd166" stroke-dasharray="6 5"/>
  <text x="300" y="438" fill="#ffd166" font-size="17" font-family="sans-serif">BUY maker decision</text>
  <line x1="505" y1="302" x2="505" y2="410" stroke="#73b7ff" stroke-dasharray="6 5"/>
  <text x="520" y="438" fill="#73b7ff" font-size="17" font-family="sans-serif">parent ready</text>
  <rect x="675" y="82" width="215" height="82" rx="12" fill="#172238" stroke="#73b7ff"/>
  <text x="694" y="115" fill="#dce8ff" font-size="16" font-family="sans-serif">exchange child：outcome truth</text>
  <text x="694" y="143" fill="#dce8ff" font-size="16" font-family="sans-serif">aggTrade ready：policy clock</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ff667d"/></marker></defs>
</svg>
