<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet">
  <title>85 秒后状态条件 rearm 的双时钟与状态机</title>
  <desc>机制示意：exchange clock 与 ready clock 到达基线 cooldown release 后，四项 adverse conjunction 触发 candidate block，恢复 hysteresis 退出；下方展示 BUY SELL 稀疏 active support。</desc>
  <rect width="1200" height="720" fill="#07111f"/>
  <text x="52" y="55" fill="#f4f7fb" font-size="28" font-family="sans-serif" font-weight="700">85 秒后的问题：时间到了，状态恢复了吗？</text>
  <text x="52" y="84" fill="#9fb3c8" font-size="16" font-family="sans-serif">机制示意 · 所有特征必须在 decision-ready 前可见</text>
  <text x="60" y="142" fill="#8ecbff" font-size="17" font-family="sans-serif">exchange time</text><path d="M190 136H1125" stroke="#42a5f5" stroke-width="3"/><g fill="#42a5f5"><circle cx="300" cy="136" r="7"/><circle cx="545" cy="136" r="7"/><circle cx="800" cy="136" r="7"/></g><text x="268" y="119" fill="#cce9ff" font-size="14" font-family="sans-serif">fill</text><text x="485" y="119" fill="#cce9ff" font-size="14" font-family="sans-serif">L2 / trades</text><text x="735" y="119" fill="#cce9ff" font-size="14" font-family="sans-serif">recovery event</text>
  <text x="60" y="207" fill="#ffd17c" font-size="17" font-family="sans-serif">ready time</text><path d="M190 201H1125" stroke="#f8c15c" stroke-width="3"/><circle cx="365" cy="201" r="7" fill="#f8c15c"/><circle cx="625" cy="201" r="7" fill="#f8c15c"/><circle cx="865" cy="201" r="7" fill="#f8c15c"/><text x="315" y="235" fill="#ffe5af" font-size="14" font-family="sans-serif">state ready</text><text x="555" y="235" fill="#ffe5af" font-size="14" font-family="sans-serif">baseline release</text><text x="810" y="235" fill="#ffe5af" font-size="14" font-family="sans-serif">exit ready</text>
  <rect x="60" y="285" width="235" height="108" rx="16" fill="#102238" stroke="#657b91" stroke-width="2"/><text x="84" y="323" fill="#eaf2fb" font-size="19" font-family="sans-serif" font-weight="700">BASELINE BLOCK</text><text x="84" y="353" fill="#9fb3c8" font-size="15" font-family="sans-serif">85s × same-side fill units</text><text x="84" y="378" fill="#9fb3c8" font-size="15" font-family="sans-serif">reducing 始终运行</text>
  <path d="M295 339H370" stroke="#9fb3c8" stroke-width="3" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9fb3c8"/></marker></defs>
  <rect x="370" y="270" width="295" height="138" rx="16" fill="#2d2713" stroke="#f8c15c" stroke-width="2"/><text x="394" y="306" fill="#ffd17c" font-size="19" font-family="sans-serif" font-weight="700">ENTRY CHECK</text><text x="394" y="337" fill="#fff0c9" font-size="15" font-family="sans-serif">adverse move ∧ persistent flow</text><text x="394" y="363" fill="#fff0c9" font-size="15" font-family="sans-serif">∧ weak refill ∧ weak recovery</text><text x="394" y="390" fill="#fff0c9" font-size="15" font-family="sans-serif">campaign 50 / 50 assignment</text>
  <path d="M665 339H735" stroke="#9fb3c8" stroke-width="3" marker-end="url(#a)"/>
  <rect x="735" y="270" width="200" height="138" rx="16" fill="#361b26" stroke="#ff6f7d" stroke-width="2"/><text x="760" y="308" fill="#ff9ca5" font-size="19" font-family="sans-serif" font-weight="700">CONTINUE BLOCK</text><text x="760" y="338" fill="#f7d6da" font-size="15" font-family="sans-serif">多 cycle 生效</text><text x="760" y="364" fill="#f7d6da" font-size="15" font-family="sans-serif">等 causal recovery</text><text x="760" y="390" fill="#f7d6da" font-size="15" font-family="sans-serif">invalid state 不偷看</text>
  <path d="M935 339H1000" stroke="#9fb3c8" stroke-width="3" marker-end="url(#a)"/>
  <rect x="1000" y="285" width="145" height="108" rx="16" fill="#0d2c28" stroke="#41d69a" stroke-width="2"/><text x="1023" y="323" fill="#63deb0" font-size="19" font-family="sans-serif" font-weight="700">REARM</text><text x="1023" y="353" fill="#d5eee6" font-size="15" font-family="sans-serif">hysteresis exit</text><text x="1023" y="378" fill="#d5eee6" font-size="15" font-family="sans-serif">恢复 baseline</text>
  <rect x="60" y="470" width="1085" height="175" rx="17" fill="#0e1c2d"/><text x="88" y="507" fill="#eaf2fb" font-size="19" font-family="sans-serif" font-weight="700">冻结聚合支持：总 rows 不是有效处理样本</text><text x="88" y="544" fill="#9fd8ff" font-size="17" font-family="sans-serif">SELL：1,646 campaigns → 81 active → 42 baseline / 39 candidate</text><rect x="665" y="525" width="360" height="22" rx="11" fill="#1b3349"/><rect x="665" y="525" width="187" height="22" rx="11" fill="#42a5f5"/><text x="1040" y="543" fill="#ff9ca5" font-size="14" font-family="sans-serif">&lt; 50 / arm</text><text x="88" y="585" fill="#ffd17c" font-size="17" font-family="sans-serif">BUY：2,396 campaigns → 82 active → 35 baseline / 47 candidate</text><rect x="665" y="567" width="360" height="22" rx="11" fill="#3c3219"/><rect x="665" y="567" width="169" height="22" rx="11" fill="#f8c15c"/><text x="1040" y="585" fill="#ff9ca5" font-size="14" font-family="sans-serif">&lt; 50 / arm</text><text x="88" y="624" fill="#9fb3c8" font-size="15" font-family="sans-serif">Development 关闭：支持不足；BUY 弱正 reward 不能覆盖 repair 与 duration 风险</text>
</svg>

