<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet">
  <title>Wall time 与 variance time add rearm 的双时钟</title>
  <desc>机制示意图：上方一秒 completed BBO buckets 生成波动率，下方比较均匀 wall clock 与按波动累积的 QV clock，并给出 BUY SELL 冻结聚合结果。</desc>
  <rect width="1200" height="720" fill="#07111f"/>
  <text x="52" y="55" fill="#f4f7fb" font-size="28" font-family="sans-serif" font-weight="700">同样 85 秒，不一定包含同样多的市场变化</text><text x="52" y="84" fill="#9fb3c8" font-size="16" font-family="sans-serif">机制示意 · completed 1s BBO bucket 在 ready 后才累积</text>
  <g stroke="#263b50" fill="none"><path d="M70 150H795M70 245H795"/><path d="M145 125V270M245 125V270M345 125V270M445 125V270M545 125V270M645 125V270M745 125V270"/></g>
  <path d="M75 225 C145 220 185 205 245 212 S345 130 445 162 S555 245 645 190 S715 150 790 178" fill="none" stroke="#f8c15c" stroke-width="4"/>
  <g fill="#42a5f5"><rect x="95" y="203" width="55" height="22"/><rect x="195" y="188" width="55" height="37"/><rect x="295" y="130" width="55" height="95"/><rect x="395" y="151" width="55" height="74"/><rect x="495" y="214" width="55" height="11"/><rect x="595" y="175" width="55" height="50"/><rect x="695" y="145" width="55" height="80"/></g>
  <text x="70" y="300" fill="#9fb3c8" font-size="15" font-family="sans-serif">每根柱：νₜ = 10⁸ σ²(mid) / mid²；missing / stale → clock freeze</text>
  <text x="70" y="365" fill="#9fd8ff" font-size="18" font-family="sans-serif" font-weight="700">wall time</text><path d="M185 359H750" stroke="#42a5f5" stroke-width="7"/><circle cx="720" cy="359" r="12" fill="#42a5f5"/><text x="750" y="365" fill="#cce9ff" font-size="15" font-family="sans-serif">85s</text>
  <text x="70" y="435" fill="#ffd17c" font-size="18" font-family="sans-serif" font-weight="700">variance time</text><path d="M185 429H310" stroke="#f8c15c" stroke-width="7"/><path d="M310 429H420" stroke="#f8c15c" stroke-width="15"/><path d="M420 429H545" stroke="#f8c15c" stroke-width="5"/><path d="M545 429H650" stroke="#f8c15c" stroke-width="12"/><circle cx="650" cy="429" r="12" fill="#f8c15c"/><text x="680" y="435" fill="#ffe5af" font-size="15" font-family="sans-serif">QV ≥ B → rearm</text>
  <rect x="835" y="125" width="310" height="340" rx="17" fill="#0e1c2d"/><text x="863" y="164" fill="#eaf2fb" font-size="19" font-family="sans-serif" font-weight="700">冻结 Development</text><text x="863" y="200" fill="#9fb3c8" font-size="15" font-family="sans-serif">40 days · 17,460 lineages</text><text x="863" y="231" fill="#9fb3c8" font-size="15" font-family="sans-serif">unsupported 0.034%</text><path d="M860 255H1120" stroke="#31465b"/><text x="863" y="290" fill="#9fd8ff" font-size="16" font-family="sans-serif">BUY action change 37.02%</text><text x="863" y="319" fill="#9fd8ff" font-size="16" font-family="sans-serif">fill retention 104.80%</text><text x="863" y="352" fill="#ffd17c" font-size="16" font-family="sans-serif">SELL action change 24.41%</text><text x="863" y="381" fill="#ffd17c" font-size="16" font-family="sans-serif">fill retention 99.41%</text><path d="M860 402H1120" stroke="#31465b"/><text x="863" y="435" fill="#ff9ca5" font-size="16" font-family="sans-serif" font-weight="700">两侧 primary reward CI 跨零</text>
  <rect x="70" y="548" width="1075" height="95" rx="15" fill="#0e1c2d"/><text x="97" y="582" fill="#eaf2fb" font-size="16" font-family="sans-serif">证据链：causal bucket clock → full-path regeneration → C++ BUY-q90 lockstep → lineage-randomized economics</text><text x="97" y="611" fill="#9fb3c8" font-size="15" font-family="sans-serif">机制通过不等于经济通过；Validation / holdout 未读，AWS receive-time 与 full C++ authority 未获得。</text>
</svg>
