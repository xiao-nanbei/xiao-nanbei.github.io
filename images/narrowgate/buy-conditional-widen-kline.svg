<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">BUY Add 条件加宽一 tick 的完整路径机制</title>
  <desc id="desc">展示 baseline BUY bid 与向外一 tick 的 candidate，以及成交差异如何继续影响库存、减仓单和 库存生命周期 terminal。</desc>
  <rect width="960" height="540" fill="#0b1120"/>
  <text x="42" y="46" fill="#f5f7ff" font-size="24" font-family="sans-serif">BUY add：baseline 与 widen 1 tick</text>
  <g stroke-width="3"><line x1="130" y1="170" x2="130" y2="340" stroke="#47d58a"/><rect x="112" y="220" width="36" height="70" fill="#47d58a"/><line x1="270" y1="150" x2="270" y2="320" stroke="#47d58a"/><rect x="252" y="195" width="36" height="72" fill="#47d58a"/><line x1="410" y1="180" x2="410" y2="365" stroke="#ff667d"/><rect x="392" y="225" width="36" height="88" fill="#ff667d"/><line x1="550" y1="205" x2="550" y2="390" stroke="#ff667d"/><rect x="532" y="250" width="36" height="86" fill="#ff667d"/><line x1="690" y1="190" x2="690" y2="350" stroke="#47d58a"/><rect x="672" y="230" width="36" height="70" fill="#47d58a"/></g>
  <line x1="390" y1="350" x2="790" y2="350" stroke="#73b7ff" stroke-width="4"/><text x="805" y="356" fill="#b9dbff" font-size="16" font-family="sans-serif">baseline bid</text>
  <line x1="390" y1="382" x2="790" y2="382" stroke="#ff9aac" stroke-width="4"/><text x="805" y="388" fill="#ffc1cb" font-size="16" font-family="sans-serif">widen -1 tick</text>
  <circle cx="515" cy="350" r="9" fill="#ffd166"/><text x="445" y="432" fill="#ffe3a2" font-size="16" font-family="sans-serif">baseline fill</text>
  <path d="M515 350 C610 455 720 455 805 430" fill="none" stroke="#ffd166" stroke-width="3" marker-end="url(#b)"/>
  <text x="600" y="485" fill="#ffe3a2" font-size="16" font-family="sans-serif">inventory → reducing quote → terminal</text>
  <rect x="70" y="78" width="270" height="88" rx="12" fill="#172238" stroke="#73b7ff"/><text x="92" y="112" fill="#d8eaff" font-size="16" font-family="sans-serif">只有 BUY exposure-add 改价</text><text x="92" y="142" fill="#d8eaff" font-size="16" font-family="sans-serif">SELL / size / safety 保持 baseline</text>
  <defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ffd166"/></marker></defs>
</svg>
