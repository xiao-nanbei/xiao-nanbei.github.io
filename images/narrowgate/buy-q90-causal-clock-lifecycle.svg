<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">BUY q90 双时钟与终局恢复状态机</title>
  <desc id="desc">左侧以两条时间线区分 exchange event time 与 feature-ready strategy visibility，右侧展示 ACTIVE、CANCEL PENDING、EXCHANGE TERMINAL 与 fresh prospective recovery。图为冻结 mechanics 示意，不是实盘订单。</desc>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07131f"/><stop offset="1" stop-color="#1b2c47"/></linearGradient>
    <marker id="ar4b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#8bd5ff"/></marker>
    <marker id="ar4y" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#ffd166"/></marker>
    <marker id="ar4r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#ff8f91"/></marker>
  </defs>
  <rect width="1280" height="760" rx="24" fill="url(#bg4)"/>
  <text x="48" y="52" fill="#f7f9ff" font-size="28" font-family="sans-serif" font-weight="700">BUY q90：两只时钟、一个硬终点、一次 fresh recovery</text>
  <text x="48" y="84" fill="#9eb3c8" font-size="16" font-family="sans-serif">冻结 mechanics 示意 · 非实盘订单 · 修复正确不等于 action value</text>

  <rect x="42" y="112" width="580" height="500" rx="18" fill="#0c2031" stroke="#31516a" stroke-width="2"/>
  <text x="68" y="148" fill="#dff5ff" font-size="20" font-family="sans-serif" font-weight="700">A. Exchange truth 与 strategy visibility</text>
  <text x="76" y="195" fill="#ffb4b6" font-size="15" font-family="sans-serif" font-weight="700">exchange / source time</text>
  <line x1="76" y1="222" x2="578" y2="222" stroke="#ff8f91" stroke-width="4" marker-end="url(#ar4r)"/>
  <circle cx="150" cy="222" r="10" fill="#ff8f91"/><text x="118" y="254" fill="#d7a5a8" font-size="12" font-family="sans-serif">book delta</text>
  <circle cx="306" cy="222" r="10" fill="#ff8f91"/><text x="278" y="254" fill="#d7a5a8" font-size="12" font-family="sans-serif">trade</text>
  <circle cx="468" cy="222" r="10" fill="#ff8f91"/><text x="427" y="254" fill="#d7a5a8" font-size="12" font-family="sans-serif">cancel ACK</text>

  <text x="76" y="310" fill="#bce8ff" font-size="15" font-family="sans-serif" font-weight="700">feature-ready / visible time</text>
  <line x1="76" y1="338" x2="578" y2="338" stroke="#8bd5ff" stroke-width="4" marker-end="url(#ar4b)"/>
  <circle cx="205" cy="338" r="10" fill="#8bd5ff"/><text x="170" y="370" fill="#a9c8da" font-size="12" font-family="sans-serif">state ready</text>
  <circle cx="362" cy="338" r="10" fill="#8bd5ff"/><text x="326" y="370" fill="#a9c8da" font-size="12" font-family="sans-serif">q90 eval</text>
  <circle cx="522" cy="338" r="10" fill="#8bd5ff"/><text x="475" y="370" fill="#a9c8da" font-size="12" font-family="sans-serif">terminal visible</text>
  <path d="M150 232 C150 278 190 283 205 326" fill="none" stroke="#ffd166" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ar4y)"/>
  <path d="M306 232 C306 279 347 283 362 326" fill="none" stroke="#ffd166" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ar4y)"/>
  <path d="M468 232 C468 278 507 284 522 326" fill="none" stroke="#ffd166" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ar4y)"/>
  <text x="235" y="290" fill="#e7d28f" font-size="13" font-family="sans-serif">transport / processing delay 不能当作 future feature</text>
  <rect x="72" y="408" width="520" height="170" rx="13" fill="#14293c" stroke="#4b657c"/>
  <text x="94" y="438" fill="#d9e6ef" font-size="16" font-family="sans-serif" font-weight="700">Risk-set consequence</text>
  <text x="94" y="470" fill="#bacbd8" font-size="14" font-family="sans-serif">legacy mixed：3,896 / 775,192 valid（0.503%）</text>
  <text x="94" y="500" fill="#bce8ff" font-size="14" font-family="sans-serif">corrected ready clock：约 99.99% valid</text>
  <text x="94" y="530" fill="#ffd166" font-size="14" font-family="sans-serif">v1.1 parity：valid-fraction delta 0.12983 &gt; 0.05</text>
  <text x="94" y="558" fill="#ffb4b6" font-size="14" font-family="sans-serif">role TV 0.151495 &gt; 0.15，仍 fail closed</text>

  <rect x="648" y="112" width="590" height="500" rx="18" fill="#102237" stroke="#31516a" stroke-width="2"/>
  <text x="674" y="148" fill="#dff5ff" font-size="20" font-family="sans-serif" font-weight="700">B. Terminal risk-set 与 fresh placement</text>
  <rect x="690" y="178" width="190" height="58" rx="12" fill="#173b4e" stroke="#6fbbe7" stroke-width="2"/>
  <text x="785" y="203" text-anchor="middle" fill="#def4ff" font-size="16" font-family="sans-serif" font-weight="700">ACTIVE / PARTIAL</text>
  <text x="785" y="224" text-anchor="middle" fill="#a9c8da" font-size="12" font-family="sans-serif">old order fill-risk</text>
  <line x1="880" y1="207" x2="998" y2="207" stroke="#ffd166" stroke-width="4" marker-end="url(#ar4y)"/>
  <text x="902" y="194" fill="#ffe49a" font-size="12" font-family="sans-serif">cancel request</text>
  <rect x="1010" y="178" width="190" height="58" rx="12" fill="#44371d" stroke="#ffd166" stroke-width="2"/>
  <text x="1105" y="203" text-anchor="middle" fill="#fff0b5" font-size="16" font-family="sans-serif" font-weight="700">CANCEL_PENDING</text>
  <text x="1105" y="224" text-anchor="middle" fill="#e1ce93" font-size="12" font-family="sans-serif">仍可 fill，直到 ACK</text>
  <line x1="1105" y1="236" x2="1105" y2="306" stroke="#ff8f91" stroke-width="4" marker-end="url(#ar4r)"/>
  <text x="1117" y="276" fill="#ffb4b6" font-size="12" font-family="sans-serif">cancel ACK</text>
  <rect x="930" y="318" width="270" height="72" rx="13" fill="#482731" stroke="#ff8f91" stroke-width="2"/>
  <text x="1065" y="346" text-anchor="middle" fill="#ffe0e1" font-size="17" font-family="sans-serif" font-weight="700">EXCHANGE_TERMINAL</text>
  <text x="1065" y="371" text-anchor="middle" fill="#e9b6b8" font-size="13" font-family="sans-serif">clear age · price · queue · cursor · hazard</text>
  <line x1="930" y1="354" x2="824" y2="354" stroke="#b58cff" stroke-width="4" marker-end="url(#ar4b)"/>
  <rect x="688" y="318" width="128" height="72" rx="13" fill="#342a49" stroke="#b58cff" stroke-width="2"/>
  <text x="752" y="345" text-anchor="middle" fill="#eee2ff" font-size="14" font-family="sans-serif" font-weight="700">q90 HOLD</text>
  <text x="752" y="369" text-anchor="middle" fill="#cbb9e0" font-size="12" font-family="sans-serif">permission only</text>
  <line x1="816" y1="374" x2="920" y2="430" stroke="#8bd5ff" stroke-width="4" marker-end="url(#ar4b)"/>
  <rect x="916" y="426" width="284" height="94" rx="13" fill="#173a38" stroke="#7ee2a8" stroke-width="2"/>
  <text x="1058" y="454" text-anchor="middle" fill="#d9ffea" font-size="16" font-family="sans-serif" font-weight="700">FRESH PROSPECTIVE PLACEMENT</text>
  <text x="1058" y="478" text-anchor="middle" fill="#b9e5ca" font-size="13" font-family="sans-serif">current price · age 0 · fresh queue-at-tail</text>
  <text x="1058" y="501" text-anchor="middle" fill="#b9e5ca" font-size="13" font-family="sans-serif">current causal book / GTX support</text>
  <rect x="682" y="548" width="526" height="44" rx="10" fill="#182c40"/>
  <text x="945" y="576" text-anchor="middle" fill="#ffb4b6" font-size="14" font-family="sans-serif">23 terminal holds → 69,074 post-ACK hazard evaluations：全部不属于旧 order risk-set</text>

  <rect x="42" y="640" width="1196" height="76" rx="13" fill="#14283b" stroke="#344f66"/>
  <text x="640" y="669" text-anchor="middle" fill="#d5e2ec" font-size="15" font-family="sans-serif">One-day v1.6：mismatch 0 · post-terminal reuse 0 · cancel/recovery/re-entry 3/3</text>
  <text x="640" y="696" text-anchor="middle" fill="#a6b9c9" font-size="13" font-family="sans-serif">61 prospective evaluations 全部 invalid；formal 40-day run 未启动；无 economics / action / live authority</text>
</svg>
