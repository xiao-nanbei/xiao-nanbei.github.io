<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">BUY soft-widen 单次解除的双路径合成 K 线机制图</title>
  <desc id="desc">合成行情上展示 baseline widened BUY quote 与只在一个十秒决策点解除放宽的 candidate quote。两条路径随后回到同一 baseline，但一次成交差异可能改变后续库存与终局价值。</desc>
  <defs>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08131f"/>
      <stop offset="1" stop-color="#1b2a40"/>
    </linearGradient>
    <marker id="ar3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#8bd5ff"/>
    </marker>
  </defs>
  <rect width="1200" height="660" rx="24" fill="url(#b3)"/>
  <text x="52" y="54" fill="#f7f9ff" font-size="28" font-family="sans-serif" font-weight="700">BUY Soft-Widen：只解除一个 quote decision</text>
  <text x="52" y="86" fill="#98adc5" font-size="16" font-family="sans-serif">合成机制示意 · 非实盘报价 · candidate 随后立即返回冻结 baseline</text>
  <rect x="50" y="115" width="1100" height="430" rx="16" fill="#0c1c2b" stroke="#2a465f"/>
  <line x1="80" y1="470" x2="1120" y2="470" stroke="#314c65" stroke-width="2"/>
  <g stroke-width="4">
    <line x1="105" y1="330" x2="105" y2="420" stroke="#7ee2a8"/><rect x="93" y="352" width="24" height="43" fill="#7ee2a8"/>
    <line x1="160" y1="295" x2="160" y2="390" stroke="#7ee2a8"/><rect x="148" y="322" width="24" height="42" fill="#7ee2a8"/>
    <line x1="215" y1="312" x2="215" y2="408" stroke="#ff8f91"/><rect x="203" y="338" width="24" height="44" fill="#ff8f91"/>
    <line x1="270" y1="280" x2="270" y2="378" stroke="#7ee2a8"/><rect x="258" y="307" width="24" height="42" fill="#7ee2a8"/>
    <line x1="325" y1="260" x2="325" y2="360" stroke="#7ee2a8"/><rect x="313" y="286" width="24" height="46" fill="#7ee2a8"/>
    <line x1="380" y1="285" x2="380" y2="384" stroke="#ff8f91"/><rect x="368" y="310" width="24" height="48" fill="#ff8f91"/>
    <line x1="435" y1="310" x2="435" y2="414" stroke="#ff8f91"/><rect x="423" y="335" width="24" height="51" fill="#ff8f91"/>
    <line x1="490" y1="325" x2="490" y2="428" stroke="#ff8f91"/><rect x="478" y="350" width="24" height="51" fill="#ff8f91"/>
    <line x1="545" y1="300" x2="545" y2="405" stroke="#7ee2a8"/><rect x="533" y="328" width="24" height="48" fill="#7ee2a8"/>
    <line x1="600" y1="335" x2="600" y2="442" stroke="#ff8f91"/><rect x="588" y="360" width="24" height="53" fill="#ff8f91"/>
    <line x1="655" y1="350" x2="655" y2="454" stroke="#ff8f91"/><rect x="643" y="375" width="24" height="50" fill="#ff8f91"/>
    <line x1="710" y1="320" x2="710" y2="425" stroke="#7ee2a8"/><rect x="698" y="348" width="24" height="47" fill="#7ee2a8"/>
    <line x1="765" y1="295" x2="765" y2="400" stroke="#7ee2a8"/><rect x="753" y="323" width="24" height="47" fill="#7ee2a8"/>
    <line x1="820" y1="315" x2="820" y2="420" stroke="#ff8f91"/><rect x="808" y="340" width="24" height="53" fill="#ff8f91"/>
    <line x1="875" y1="285" x2="875" y2="390" stroke="#7ee2a8"/><rect x="863" y="314" width="24" height="46" fill="#7ee2a8"/>
    <line x1="930" y1="270" x2="930" y2="375" stroke="#7ee2a8"/><rect x="918" y="298" width="24" height="47" fill="#7ee2a8"/>
    <line x1="985" y1="300" x2="985" y2="405" stroke="#ff8f91"/><rect x="973" y="326" width="24" height="51" fill="#ff8f91"/>
    <line x1="1040" y1="280" x2="1040" y2="385" stroke="#7ee2a8"/><rect x="1028" y="309" width="24" height="46" fill="#7ee2a8"/>
  </g>
  <line x1="460" y1="132" x2="460" y2="520" stroke="#ffd166" stroke-width="4" stroke-dasharray="10 7"/>
  <text x="382" y="573" fill="#ffd166" font-size="17" font-family="sans-serif" font-weight="700">target 10s quote decision</text>
  <line x1="80" y1="452" x2="1120" y2="452" stroke="#4e9c77" stroke-width="3"/>
  <text x="84" y="443" fill="#84d7a7" font-size="15" font-family="sans-serif">baseline BUY quote：soft-widened</text>
  <line x1="400" y1="392" x2="520" y2="392" stroke="#ffd166" stroke-width="5"/>
  <text x="365" y="378" fill="#fff0b7" font-size="15" font-family="sans-serif">candidate：multiplier cap 1.0</text>
  <circle cx="490" cy="401" r="11" fill="#ffd166"/>
  <text x="510" y="430" fill="#fff2c4" font-size="15" font-family="sans-serif">可能多出一次 BUY fill</text>
  <path d="M530 455 C620 520 720 525 820 470" fill="none" stroke="#8bd5ff" stroke-width="4" marker-end="url(#ar3)"/>
  <path d="M530 450 C630 440 720 438 820 450" fill="none" stroke="#7ee2a8" stroke-width="3" stroke-dasharray="8 7"/>
  <rect x="790" y="135" width="320" height="120" rx="14" fill="#142f47" stroke="#4a97ca"/>
  <text x="812" y="168" fill="#dff5ff" font-size="19" font-family="sans-serif" font-weight="700">两个 terminal paths</text>
  <text x="812" y="198" fill="#b8d0e3" font-size="15" font-family="sans-serif">相同市场数据与 target 前状态</text>
  <text x="812" y="224" fill="#b8d0e3" font-size="15" font-family="sans-serif">不同 activation / queue / fill 可改变后续 库存生命周期</text>
  <rect x="790" y="273" width="320" height="116" rx="14" fill="#34233c" stroke="#c67fe5"/>
  <text x="812" y="306" fill="#f5e6ff" font-size="19" font-family="sans-serif" font-weight="700">研究结果</text>
  <text x="812" y="338" fill="#ddc7e8" font-size="15" font-family="sans-serif">报价中位数向内 13 ticks</text>
  <text x="812" y="364" fill="#ff9fa1" font-size="15" font-family="sans-serif">但只有约 3–4% forks 的 terminal delta 非零</text>
  <rect x="78" y="590" width="1040" height="42" rx="10" fill="#172738"/>
  <text x="98" y="617" fill="#a9bfd4" font-size="15" font-family="sans-serif">one-shot 结果不能相加成 repeated policy PnL；动作持续时间一变，就必须建立新的研究身份。</text>
</svg>
