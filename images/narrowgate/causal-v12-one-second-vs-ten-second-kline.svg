<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">一秒与十秒13-head策略路径比较</title>
  <desc id="desc">机制示意与四十日冻结聚合结果。同一合成K线上一秒策略更频繁调整报价，结果成交保留百分之八十七、terminal MTM更差、库存时间增加八百八十八BTC秒并恶化tail。</desc>
  <defs><linearGradient id="bg"><stop stop-color="#071426"/><stop offset="1" stop-color="#23304a"/></linearGradient><style>.t{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#edf6ff}.m{fill:#a9bad0}.grid{stroke:#2b4b67}.ten{stroke:#5ab0ff}.one{stroke:#ffb84d}.big{font-size:27px;font-weight:700}.label{font-size:17px}.small{font-size:14px}</style></defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="52" y="53" class="t big">更快更新 ≠ 更低库存风险</text><text x="52" y="82" class="m small">机制示意与 40-day native Development 冻结聚合结果</text>
  <g transform="translate(55 115)">
