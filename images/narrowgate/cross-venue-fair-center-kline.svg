<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet">
  <title>Cross-venue fair center shift 的 K 线与整对报价平移</title>
  <desc>机制示意：Bitget、Bybit、OKX 完成的 causal trade bars 汇入 fair adjustment，candidate 保持 spread 平移 bid ask；右侧显示冻结主结果与 leave-one-out 方向。</desc>
  <rect width="1200" height="720" fill="#07111f"/>
  <text x="52" y="55" fill="#f4f7fb" font-size="28" font-family="sans-serif" font-weight="700">Cross-Venue Fair Center：信号、动作与运输稳定性</text><text x="52" y="84" fill="#9fb3c8" font-size="16" font-family="sans-serif">机制示意 · completed historical bars，不具 live receive-time authority</text>
  <g font-family="sans-serif"><rect x="55" y="125" width="190" height="70" rx="14" fill="#102238" stroke="#42a5f5"/><text x="82" y="167" fill="#9fd8ff" font-size="18" font-weight="700">Bitget bar</text><rect x="55" y="215" width="190" height="70" rx="14" fill="#102238" stroke="#42a5f5"/><text x="82" y="257" fill="#9fd8ff" font-size="18" font-weight="700">Bybit bar</text><rect x="55" y="305" width="190" height="70" rx="14" fill="#102238" stroke="#42a5f5"/><text x="82" y="347" fill="#9fd8ff" font-size="18" font-weight="700">OKX bar</text></g>
  <path d="M245 160H340M245 250H340M245 340H340" stroke="#657b91" stroke-width="2"/><rect x="340" y="190" width="225" height="125" rx="16" fill="#2d2713" stroke="#f8c15c" stroke-width="2"/><text x="370" y="230" fill="#ffd17c" font-size="19" font-family="sans-serif" font-weight="700">causal fair δₜ</text><text x="370" y="264" fill="#fff0c9" font-size="15" font-family="sans-serif">共同支持 · frozen gain</text><text x="370" y="290" fill="#fff0c9" font-size="15" font-family="sans-serif">ready before decision</text>
  <path d="M565 252H635" stroke="#657b91" stroke-width="3"/>
  <g font-family="sans-serif"><text x="650" y="143" fill="#9fb3c8" font-size="15">baseline pair</text><path d="M650 180H850" stroke="#9fb3c8" stroke-width="4"/><path d="M650 245H850" stroke="#9fb3c8" stroke-width="4"/><text x="866" y="186" fill="#9fb3c8" font-size="15">ask</text><text x="866" y="251" fill="#9fb3c8" font-size="15">bid</text><text x="650" y="322" fill="#ffd17c" font-size="15">candidate pair = baseline + δₜ</text><path d="M650 355H850" stroke="#f8c15c" stroke-width="4"/><path d="M650 420H850" stroke="#f8c15c" stroke-width="4"/><text x="866" y="361" fill="#ffd17c" font-size="15">ask + δ</text><text x="866" y="426" fill="#ffd17c" font-size="15">bid + δ</text><path d="M810 180V245M810 355V420" stroke="#63deb0" stroke-width="2"/><text x="718" y="286" fill="#63deb0" font-size="15">spread preserved</text></g>
  <rect x="940" y="125" width="215" height="390" rx="17" fill="#0e1c2d"/><text x="963" y="162" fill="#eaf2fb" font-size="18" font-family="sans-serif" font-weight="700">Grade-A</text><text x="963" y="196" fill="#9fb3c8" font-size="15" font-family="sans-serif">9,164 库存生命周期</text><text x="963" y="225" fill="#9fb3c8" font-size="15" font-family="sans-serif">action change 100%</text><text x="963" y="254" fill="#9fb3c8" font-size="15" font-family="sans-serif">fill retention 97%</text><text x="963" y="291" fill="#63deb0" font-size="15" font-family="sans-serif">uplift +0.001446</text><text x="963" y="320" fill="#ff9ca5" font-size="14" font-family="sans-serif">95% CI crosses 0</text><path d="M962 343H1132" stroke="#31465b"/><text x="963" y="378" fill="#9fb3c8" font-size="15" font-family="sans-serif">LOO Bitget: +</text><text x="963" y="407" fill="#ff9ca5" font-size="15" font-family="sans-serif">LOO Bybit: −</text><text x="963" y="436" fill="#9fb3c8" font-size="15" font-family="sans-serif">LOO OKX: +</text><text x="963" y="478" fill="#f4f7fb" font-size="16" font-family="sans-serif" font-weight="700">transport gate failed</text>
  <rect x="55" y="590" width="1100" height="83" rx="15" fill="#0e1c2d"/><text x="82" y="623" fill="#eaf2fb" font-size="16" font-family="sans-serif">完整 pair shift 保留 92.35% activity、97.00% fills；失败不是 no-op 或 broad shutdown。</text><text x="82" y="650" fill="#9fb3c8" font-size="15" font-family="sans-serif">主 value LCB、daily sign 与 Bybit leave-out direction 未过门；Validation / holdout 未读。</text>
</svg>
