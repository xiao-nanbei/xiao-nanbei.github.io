<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">新 407 日研究：事实、模型化交付、可见特征与权威结算</title>
<desc id="desc">采购 L2 和真实个体成交经过完整消息分组、source 与模型化 delivery/ready，分别形成可见特征和独立 outcome Bars。参考市场为可选支路，native 依实际验收选择。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#344054"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#101828}.box{fill:#eff8ff;stroke:#175cd3;stroke-width:1.5}.sub{font-size:16px;fill:#475467}.h{font-size:20px;font-weight:700}.line{stroke:#344054;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1200" height="650" fill="#fbfcfe"/>
<text x="36" y="48" font-size="26" font-weight="700">新 407 日研究：事实、模型化交付、可见特征与权威结算</text>
<rect class="box" x="36" y="90" width="320" height="136" rx="12"/>
<text class="h" x="56" y="128">采购 L2 ＋真实个体成交</text>
<text class="sub" x="56" y="166">facts / 完整消息分组</text>
<text class="sub" x="56" y="196">多个 level 行不是多次独立观察</text>
<path class="line" d="M368 158H404"/>
<rect class="box" x="420" y="90" width="350" height="136" rx="12"/>
<text class="h" x="440" y="128">source → delivery / ready</text>
<text class="sub" x="440" y="166">按冻结合同模型化交付与有效性</text>
<text class="sub" x="440" y="196">供应商接收 ≠ live 主机接收</text>
<path class="line" d="M782 158H824"/>
<rect class="box" x="838" y="90" width="326" height="136" rx="12"/>
<text class="h" x="858" y="128">盘口观察 → 因果特征</text>
<text class="sub" x="858" y="166">覆盖、年龄及 feature-ready 合同</text>
<text class="sub" x="858" y="196">派生 BBO ≠ 原生 bookTicker</text>
<path class="line" d="M596 238V267H196V292"/>
<rect class="box" x="36" y="306" width="350" height="125" rx="12"/>
<text class="h" x="56" y="344">独立 outcome Bars → 标签</text>
<text class="sub" x="56" y="382">未来结果不反流为当时可见特征</text>
<text class="sub" x="56" y="412">不按收益挑日或删除不利日期</text>
<path class="line" d="M1000 238V292"/>
<rect class="box" x="838" y="306" width="326" height="125" rx="12"/>
<text class="h" x="858" y="344">新 F03 → 冻结消费映射</text>
<text class="sub" x="858" y="382">共同 29 项特征 / 独立目标模型</text>
<text class="sub" x="858" y="412">预测不等于盈利或已部署</text>
<path class="line" d="M1000 443V465H604V486"/>
<rect class="box" x="420" y="500" width="744" height="110" rx="12"/>
<text class="h" x="440" y="538">策略 / 订单 → 经济撮合 → 库存 → 权威结算</text>
<text class="sub" x="440" y="576">费用、资金费、终点 MTM；native 仅按验收能力与实际入口选择</text>
<rect class="box" x="36" y="500" width="320" height="110" rx="12"/>
<text class="h" x="56" y="538">参考市场：可选支路</text>
<text class="sub" x="56" y="576">不默认进入本轮本地 F03</text>
<path class="line" stroke-dasharray="6 5" d="M368 554H404"/>
</svg>
