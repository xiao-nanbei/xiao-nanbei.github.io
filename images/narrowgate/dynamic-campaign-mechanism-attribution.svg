<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Dynamic campaign 中 add toxicity 与 repair failure 的合成机制图</title>
  <desc id="desc">合成 K 线和库存路径展示 regime、P3、cap、cooldown 对报价的传导，一次 add fill 进入 immediate toxicity 或 repair failure 路径，最后到 campaign terminal。历史聚合仅为描述性证据，不是实盘动作反事实。</desc>
