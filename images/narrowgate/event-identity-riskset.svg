<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">订单事件身份与 start-stop 风险集</title>
  <desc id="desc">展示订单从提交、激活、部分成交、取消请求到取消确认，以及独立延迟进入的 campaign repair 风险集。</desc>
  <rect width="960" height="520" fill="#0c1222"/>
  <text x="44" y="48" fill="#f5f7ff" font-size="24" font-family="sans-serif">Event identity and risk set v2</text>
  <line x1="90" y1="190" x2="880" y2="190" stroke="#5e6b83" stroke-width="3"/>
  <g font-family="sans-serif" font-size="15" text-anchor="middle">
    <circle cx="150" cy="190" r="10" fill="#8e9bb2"/><text x="150" y="230" fill="#d7deeb">submit</text>
    <circle cx="265" cy="190" r="10" fill="#73b7ff"/><text x="265" y="230" fill="#b9dbff">activation</text>
    <circle cx="405" cy="190" r="10" fill="#ffd166"/><text x="405" y="230" fill="#ffe3a2">partial fill</text>
    <circle cx="545" cy="190" r="10" fill="#ff9aac"/><text x="545" y="230" fill="#ffc2cb">cancel request</text>
    <circle cx="685" cy="190" r="10" fill="#ff6077"/><text x="685" y="230" fill="#ffadba">cancel ACK</text>
    <circle cx="820" cy="190" r="10" fill="#657086"/><text x="820" y="230" fill="#cbd2df">terminal</text>
  </g>
  <path d="M265 125 H685" stroke="#73b7ff" stroke-width="12"/><text x="392" y="105" fill="#b9dbff" font-size="17" font-family="sans-serif">Y_fill(t)=1；remaining qty &gt; 0</text>
  <path d="M545 285 H685" stroke="#ff9aac" stroke-width="12"/><text x="535" y="325" fill="#ffc2cb" font-size="16" font-family="sans-serif">pending-cancel fill race</text>
  <line x1="405" y1="260" x2="405" y2="440" stroke="#ffd166" stroke-dasharray="7 6"/>
  <circle cx="405" cy="390" r="10" fill="#48d68b"/><path d="M405 390 H840" stroke="#48d68b" stroke-width="12"/>
  <text x="485" y="430" fill="#8cebb6" font-size="17" font-family="sans-serif">repair delayed-entry risk set</text>
  <rect x="70" y="350" width="250" height="92" rx="12" fill="#151e31" stroke="#ffd166"/>
  <text x="92" y="384" fill="#ffe3a2" font-size="16" font-family="sans-serif">jump：更新 state，不终止 order</text>
  <text x="92" y="416" fill="#ffe3a2" font-size="16" font-family="sans-serif">repair：独立 campaign transition</text>
</svg>
