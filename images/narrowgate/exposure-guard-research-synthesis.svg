<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="862" viewBox="0 0 1100 862" role="img" aria-labelledby="title desc">
  <title id="title">Exposure Guards：三个阶段不能互相借用证据权限</title>
  <desc id="desc">经济关闭、身份失效与仅完成 plumbing 是三种完全不同的研究状态。更安全的 ownership 与时钟合同不会自动恢复旧 guard 的经济结论。 正式 successor 仍需独立 mechanics panel 与 randomized economic identity。 研究支持：plumbing / failure diagnosis · guard action=false · live=false</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#98a2b3"/></marker>
    <style>
      .bg{fill:#fbfcfe}.card{fill:#fff;stroke:#d0d5dd;stroke-width:1.2}.connector{fill:none;stroke:#98a2b3;stroke-width:1.6;marker-end:url(#arrow)}
      .title{font:600 24px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#101828}.subtitle{font:400 13px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475467}
      .stage{font:600 17px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#101828}.result{font:500 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#344054}.metric{font:400 12px ui-monospace,SFMono-Regular,Menlo,"PingFang SC",monospace;fill:#667085}
      .pill{font:600 13px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.index{font:600 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.take-title{font:600 17px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#175cd3}.take{font:500 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#344054}.authority{font:500 12px ui-monospace,SFMono-Regular,Menlo,"PingFang SC",monospace;fill:#b42318}
    </style>
  </defs>
  <rect class="bg" width="1100" height="862"/>
  <text class="title" x="42" y="44">Exposure Guards：三个阶段不能互相借用证据权限</text>
  <text class="subtitle" x="42" y="70">经济关闭、身份失效与仅完成 plumbing 是三种完全不同的研究状态</text>
  <line x1="42" y1="92" x2="1058" y2="92" stroke="#eaecf0" stroke-width="1"/>
<path class="connector" d="M112 250 V269"/>
  <rect class="card" x="62" y="142" width="976" height="108" rx="11"/>
  <rect x="62" y="142" width="8" height="108" rx="4" fill="#f04438"/>
  <circle cx="112" cy="174" r="18" fill="#fef3f2" stroke="#f04438" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="180" fill="#b42318">1</text>
  <text class="stage" x="150" y="176">Trade-intensity proxy add-only</text>
  <rect x="888" y="158" width="122" height="32" rx="16" fill="#fef3f2" stroke="#f04438" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="179" fill="#b42318">关闭</text>
  <text class="result" x="150" y="205">绕过 opener / reducing 后 fills +13.85%，terminal MTM 反而恶化</text>
  <text class="metric" x="150" y="230">control→candidate delta = −11.6663 USDC；closed</text>
<path class="connector" d="M112 382 V401"/>
  <rect class="card" x="62" y="274" width="976" height="108" rx="11"/>
  <rect x="62" y="274" width="8" height="108" rx="4" fill="#667085"/>
  <circle cx="112" cy="306" r="18" fill="#f2f4f7" stroke="#667085" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="312" fill="#344054">2</text>
  <text class="stage" x="150" y="308">BUY q90 clock / lifecycle</text>
  <rect x="888" y="290" width="122" height="32" rx="16" fill="#f2f4f7" stroke="#667085" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="311" fill="#344054">撤回</text>
  <text class="result" x="150" y="337">mixed clock 与 post-cancel-ACK 风险集缺陷被确认</text>
  <text class="metric" x="150" y="362">旧 same-date parity 与经济数字失效</text>
<path class="connector" d="M112 514 V533"/>
  <rect class="card" x="62" y="406" width="976" height="108" rx="11"/>
  <rect x="62" y="406" width="8" height="108" rx="4" fill="#7f56d9"/>
  <circle cx="112" cy="438" r="18" fill="#f4f3ff" stroke="#7f56d9" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="444" fill="#5925dc">3</text>
  <text class="stage" x="150" y="440">BUY q90 portfolio attribution</text>
  <rect x="888" y="422" width="122" height="32" rx="16" fill="#f4f3ff" stroke="#7f56d9" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="443" fill="#5925dc">仅诊断</text>
  <text class="result" x="150" y="469">BUY 过滤与 fill imbalance 的第一条中介边可见</text>
  <text class="metric" x="150" y="494">SHORT concentration→terminal loss 的完整链未闭合</text>

  <rect class="card" x="62" y="538" width="976" height="108" rx="11"/>
  <rect x="62" y="538" width="8" height="108" rx="4" fill="#98a2b3"/>
  <circle cx="112" cy="570" r="18" fill="#f2f4f7" stroke="#98a2b3" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="576" fill="#475467">4</text>
  <text class="stage" x="150" y="572">Ranked-toxicity carryover guard</text>
  <rect x="888" y="554" width="122" height="32" rx="16" fill="#f2f4f7" stroke="#98a2b3" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="575" fill="#475467">未运行</text>
  <text class="result" x="150" y="601">past-only rank、persistent state、ACK 与跨 库存生命周期 ownership 已接通</text>
  <text class="metric" x="150" y="626">仅一日 outcome-blind smoke；40 日 mechanics / economics 未运行</text>
  <rect x="62" y="686" width="976" height="112" rx="11" fill="#eff8ff" stroke="#84caff" stroke-width="1.2"/>
  <text class="take-title" x="88" y="717">合并后的读法</text>
  <text class="take" x="88" y="744">• 更安全的 ownership 与时钟合同不会自动恢复旧 guard 的经济结论。</text>
  <text class="take" x="88" y="770">• 正式 successor 仍需独立 mechanics panel 与 randomized economic identity。</text>
  <text class="authority" text-anchor="middle" x="550" y="828">研究支持：plumbing / failure diagnosis · guard action=false · live=false</text>
</svg>
