  <rect x="54" y="474" width="1092" height="100" rx="14" fill="#0b1727" stroke="#27415f"/>
  <text x="76" y="505" fill="#dce7f4" font-size="14" font-family="system-ui,sans-serif">v2 exact opener：stable decision ID · signed role · feature-ready clock · submit / ACK / cancel / fill / queue lineage</text>
  <text x="76" y="533" fill="#f5c286" font-size="14" font-family="system-ui,sans-serif">v2.1 / v2.2：schema、writer health、quarantine、cancel-reject、crash recovery、atomic admission</text>
  <text x="76" y="557" fill="#f08a8a" font-size="13" font-family="system-ui,sans-serif">Prospective tape disabled / not collected · no economic outcome read</text>
  <text x="1001" y="603" fill="#617993" font-size="12" font-family="system-ui,sans-serif">机制示意 / 冻结聚合</text>
