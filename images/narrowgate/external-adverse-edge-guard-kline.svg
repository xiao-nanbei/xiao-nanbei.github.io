    <text x="392" y="178" fill="#aac5ed" font-size="13" font-family="system-ui,sans-serif">local mid</text>
    <line x1="345" y1="239" x2="430" y2="239" stroke="#f08a8a" stroke-width="4"/>
    <circle cx="430" cy="239" r="8" fill="#f08a8a"/><text x="383" y="225" fill="#f6b1b8" font-size="12" font-family="system-ui,sans-serif">baseline bid</text>
    <line x1="430" y1="239" x2="364" y2="268" stroke="#f5a65b" stroke-width="3" marker-end="url(#arrowGold)"/>
    <circle cx="354" cy="273" r="8" fill="#f5a65b"/><text x="260" y="304" fill="#f6cca0" font-size="12" font-family="system-ui,sans-serif">outward candidate</text>
    <text x="42" y="325" fill="#8fa8bf" font-size="12" font-family="system-ui,sans-serif">reducing side unchanged · no inward tightening</text>
  </g>
  <g transform="translate(610 108)">
    <rect width="536" height="340" rx="16" fill="#0d1b2d" stroke="#27415f"/>
    <text x="22" y="32" fill="#dce7f4" font-size="16" font-family="system-ui,sans-serif" font-weight="650">v1 冻结 mechanics</text>
