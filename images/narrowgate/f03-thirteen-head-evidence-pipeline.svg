<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">F03：共同因果特征 → 独立 LightGBM → 冻结消费 → 完整经济评价</title>
<desc id="desc">29 项共同特征输入十三个独立目标模型，不是共享 encoder。三个触达条件方向概率、三个绝对价格方差率、三个触达条件价格变化比例和 bid/ask 在 5/10 秒的四个不利概率。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#344054"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#101828}.box{fill:#eff8ff;stroke:#175cd3;stroke-width:1.5}.sub{font-size:16px;fill:#475467}.h{font-size:20px;font-weight:700}.line{stroke:#344054;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1200" height="650" fill="#fbfcfe"/>
<text x="36" y="48" font-size="26" font-weight="700">F03：共同因果特征 → 独立 LightGBM → 冻结消费 → 完整经济评价</text>
<rect class="box" x="36" y="100" width="320" height="255" rx="12"/>
<text class="h" x="56" y="138">共同因果特征面板</text>
<text class="sub" x="56" y="176">实际 29 项本地特征合同</text>
<text class="sub" x="56" y="206">盘口、成交与因果时间窗口</text>
<text class="sub" x="56" y="236">按 feature-ready 可见性消费</text>
<text class="sub" x="56" y="266">不添加自有队列或库存特征</text>
<text class="sub" x="56" y="296">参考市场不默认进入本轮 F03</text>
<path class="line" d="M368 220H404"/>
<rect class="box" x="420" y="100" width="744" height="255" rx="12"/>
<text class="h" x="440" y="138">逐目标独立拟合：3 + 3 + 3 + 4 = 13</text>
<text class="sub" x="440" y="176">3 × 触达条件方向概率（10 / 30 / 60 秒）</text>
<text class="sub" x="440" y="206">3 × 绝对价格方差率（10 / 30 / 60 秒）</text>
<text class="sub" x="440" y="236">3 × 触达条件价格变化比例（10 / 30 / 60 秒）</text>
<text class="sub" x="440" y="266">4 × 不利概率（bid / ask，各 5 / 10 秒）</text>
<text class="sub" x="440" y="296">taker tempo 是输入；P3 是独立模型，不是额外 F03 头</text>
<path class="line" d="M800 370V395H245V430"/>
<rect class="box" x="36" y="444" width="440" height="145" rx="12"/>
<text class="h" x="56" y="482">冻结消费映射</text>
<text class="sub" x="56" y="520">报价桥接输出五字段；作用按实际消费者</text>
<text class="sub" x="56" y="550">独立训练，没有跨头共享梯度</text>
<path class="line" d="M490 515H558"/>
<rect class="box" x="574" y="444" width="590" height="145" rx="12"/>
<text class="h" x="594" y="482">完整订单 → 成交 → 库存 → 净权益</text>
<text class="sub" x="594" y="520">费用、资金费、终点 MTM 与独立账户边界</text>
<text class="sub" x="594" y="550">十三头已训练 ≠ 十三份经济贡献已验证 ≠ live 准入</text>
<text class="sub" x="36" y="630">结构示意；各实验的预测诊断与经济结论分别记录，不由本图宣告通过。</text>
</svg>
