<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">从成交 markout 到 portfolio action value 的归因阶梯</title>
  <desc id="desc">展示 fill markout、inventory lot、库存生命周期 terminal、portfolio mechanism 与 randomized action uplift 的层级，并标明描述性证据不能跨级授权动作。</desc>
  <defs><linearGradient id="bg10" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091426"/><stop offset="1" stop-color="#162a43"/></linearGradient><marker id="a10" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8ba5c7"/></marker><style>.h10{font:700 28px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f2f6ff}.t10{font:600 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#edf3ff}.s10{font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#b4c6dd}.n10{font:700 24px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#66dbc1}.b10{fill:#142d4a;stroke:#52769f;stroke-width:2}.g10{fill:#153c39;stroke:#3bc7a6;stroke-width:2}.w10{fill:#49351e;stroke:#efaf50;stroke-width:2}.p10{fill:#3c2948;stroke:#b581da;stroke-width:2}.l10{stroke:#8ba5c7;stroke-width:2;marker-end:url(#a10)}</style></defs>
  <rect width="1200" height="700" rx="24" fill="url(#bg10)"/>
  <text x="50" y="55" class="h10">同一笔 fill 可以启动多只时钟，但只有最后一层回答“动作是否值得”</text>
  <text x="50" y="88" class="s10">越往右，状态反馈和识别要求越强；左侧证据不能直接替代右侧反事实</text>
  <g transform="translate(45 145)"><rect width="195" height="175" rx="16" class="b10"/><text x="22" y="40" class="n10">01</text><text x="22" y="78" class="t10">Fill markout</text><text x="22" y="108" class="s10">1s / 5s / 30s</text><text x="22" y="134" class="s10">early adverse selection</text><text x="22" y="158" class="s10">不是完整 PnL</text></g>
  <g transform="translate(275 145)"><rect width="195" height="175" rx="16" class="g10"/><text x="22" y="40" class="n10">02</text><text x="22" y="78" class="t10">Inventory lot</text><text x="22" y="108" class="s10">quantity-time exposure</text><text x="22" y="134" class="s10">matching convention</text><text x="22" y="158" class="s10">repair / carry</text></g>
  <g transform="translate(505 145)"><rect width="195" height="175" rx="16" class="w10"/><text x="22" y="40" class="n10">03</text><text x="22" y="78" class="t10">库存生命周期 terminal</text><text x="22" y="108" class="s10">decision → flat/end</text><text x="22" y="134" class="s10">fees · realized · MTM</text><text x="22" y="158" class="s10">path-consistent</text></g>
  <g transform="translate(735 145)"><rect width="195" height="175" rx="16" class="p10"/><text x="22" y="40" class="n10">04</text><text x="22" y="78" class="t10">Portfolio mechanism</text><text x="22" y="108" class="s10">side imbalance</text><text x="22" y="134" class="s10">multi-level inventory</text><text x="22" y="158" class="s10">tail / duration</text></g>
  <g transform="translate(965 145)"><rect width="195" height="175" rx="16" fill="#472740" stroke="#ef6f9e" stroke-width="2"/><text x="22" y="40" class="n10">05</text><text x="22" y="78" class="t10">Action uplift</text><text x="22" y="108" class="s10">same eligibility</text><text x="22" y="134" class="s10">randomized/paired path</text><text x="22" y="158" class="s10">terminal USDC</text></g>
  <path d="M240 232H265M470 232H495M700 232H725M930 232H955" class="l10"/>
  <text x="50" y="395" class="h10">三个常见的错误跨越</text>
  <rect x="55" y="440" width="330" height="125" rx="15" class="w10"/><text x="78" y="476" class="t10">负 30s markout ⇒ 应取消</text><text x="78" y="507" class="s10">忽略后续 repair、queue option 与</text><text x="78" y="532" class="s10">candidate 自己生成的库存路径</text>
  <rect x="435" y="440" width="330" height="125" rx="15" class="w10"/><text x="458" y="476" class="t10">Add 库存生命周期 更差 ⇒ skip 会赚</text><text x="458" y="507" class="s10">历史 库存生命周期 类型由已实现路径选择，</text><text x="458" y="532" class="s10">不是随机 treatment</text>
  <rect x="815" y="440" width="330" height="125" rx="15" class="w10"/><text x="838" y="476" class="t10">风险指标下降 ⇒ 价值改善</text><text x="838" y="507" class="s10">可能只是 participation shutdown，</text><text x="838" y="532" class="s10">必须与 terminal reward、tail 同读</text>
  <rect x="205" y="615" width="790" height="46" rx="13" class="g10"/><text x="250" y="645" class="t10">正确顺序：先冻结身份与时钟，再定位机制，最后用完整反事实决定权限</text>
</svg>
