<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="994" viewBox="0 0 1100 994" role="img" aria-labelledby="title desc">
  <title id="title">Fill Quality：观察到坏成交，不等于找到了可执行过滤器</title>
  <desc id="desc">markout、inventory lot、库存生命周期 terminal 与 randomized quote action 是四个不同层级。filled-only classifier 会丢掉未成交、取消和库存延续路径。 合法 action 必须从 assignment 时刻一直评价到 库存生命周期 terminal。 研究支持：lifecycle estimand / descriptive attribution · filtering action=false</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#98a2b3"/></marker>
    <style>
      .bg{fill:#fbfcfe}.card{fill:#fff;stroke:#d0d5dd;stroke-width:1.2}.connector{fill:none;stroke:#98a2b3;stroke-width:1.6;marker-end:url(#arrow)}
      .title{font:600 24px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#101828}.subtitle{font:400 13px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475467}
      .stage{font:600 17px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#101828}.result{font:500 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#344054}.metric{font:400 12px ui-monospace,SFMono-Regular,Menlo,"PingFang SC",monospace;fill:#667085}
      .pill{font:600 13px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.index{font:600 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.take-title{font:600 17px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#175cd3}.take{font:500 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#344054}.authority{font:500 12px ui-monospace,SFMono-Regular,Menlo,"PingFang SC",monospace;fill:#b42318}
    </style>
  </defs>
  <rect class="bg" width="1100" height="994"/>
  <text class="title" x="42" y="44">Fill Quality：观察到坏成交，不等于找到了可执行过滤器</text>
  <text class="subtitle" x="42" y="70">markout、inventory lot、库存生命周期 terminal 与 randomized quote action 是四个不同层级</text>
  <line x1="42" y1="92" x2="1058" y2="92" stroke="#eaecf0" stroke-width="1"/>
<path class="connector" d="M112 250 V269"/>
  <rect class="card" x="62" y="142" width="976" height="108" rx="11"/>
  <rect x="62" y="142" width="8" height="108" rx="4" fill="#039855"/>
  <circle cx="112" cy="174" r="18" fill="#ecfdf3" stroke="#039855" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="180" fill="#027a48">1</text>
  <text class="stage" x="150" y="176">Fill-to-inventory lifecycle</text>
  <rect x="888" y="158" width="122" height="32" rx="16" fill="#ecfdf3" stroke="#039855" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="179" fill="#027a48">保留</text>
  <text class="result" x="150" y="205">30 秒 markout 衡量相对成交价的优势，不等于后续价格方向或完整净收益</text>
  <text class="metric" x="150" y="230">estimand 保留；旧 mixed-L2 绝对数字撤回</text>
<path class="connector" d="M112 382 V401"/>
  <rect class="card" x="62" y="274" width="976" height="108" rx="11"/>
  <rect x="62" y="274" width="8" height="108" rx="4" fill="#7f56d9"/>
  <circle cx="112" cy="306" r="18" fill="#f4f3ff" stroke="#7f56d9" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="312" fill="#5925dc">2</text>
  <text class="stage" x="150" y="308">Dynamic 库存生命周期 attribution</text>
  <rect x="888" y="290" width="122" height="32" rx="16" fill="#f4f3ff" stroke="#7f56d9" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="311" fill="#5925dc">仅诊断</text>
  <text class="result" x="150" y="337">add toxicity 与 repair failure 可以累积为库存尾部</text>
  <text class="metric" x="150" y="362">描述性机制；不能当作动作因果结论</text>
<path class="connector" d="M112 514 V533"/>
  <rect class="card" x="62" y="406" width="976" height="108" rx="11"/>
  <rect x="62" y="406" width="8" height="108" rx="4" fill="#f79009"/>
  <circle cx="112" cy="438" r="18" fill="#fffaeb" stroke="#f79009" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="444" fill="#b54708">3</text>
  <text class="stage" x="150" y="440">First-add terminal loss</text>
  <rect x="888" y="422" width="122" height="32" rx="16" fill="#fffaeb" stroke="#f79009" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="443" fill="#b54708">阻塞</text>
  <text class="result" x="150" y="469">BUY / SELL first-add 历史均值稳定为负</text>
  <text class="metric" x="150" y="494">没有识别出稳定、跨日可执行 subgroup</text>
<path class="connector" d="M112 646 V665"/>
  <rect class="card" x="62" y="538" width="976" height="108" rx="11"/>
  <rect x="62" y="538" width="8" height="108" rx="4" fill="#f04438"/>
  <circle cx="112" cy="570" r="18" fill="#fef3f2" stroke="#f04438" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="576" fill="#b42318">4</text>
  <text class="stage" x="150" y="572">Decision-visible fill value</text>
  <rect x="888" y="554" width="122" height="32" rx="16" fill="#fef3f2" stroke="#f04438" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="575" fill="#b42318">关闭</text>
  <text class="result" x="150" y="601">只使用决策时可见状态预测 库存生命周期 terminal</text>
  <text class="metric" x="150" y="626">chronological prediction branches 未通过</text>

  <rect class="card" x="62" y="670" width="976" height="108" rx="11"/>
  <rect x="62" y="670" width="8" height="108" rx="4" fill="#f04438"/>
  <circle cx="112" cy="702" r="18" fill="#fef3f2" stroke="#f04438" stroke-width="1.5"/>
  <text class="index" text-anchor="middle" x="112" y="708" fill="#b42318">5</text>
  <text class="stage" x="150" y="704">BUY soft-widen action</text>
  <rect x="888" y="686" width="122" height="32" rx="16" fill="#fef3f2" stroke="#f04438" stroke-width="1"/>
  <text class="pill" text-anchor="middle" x="949" y="707" fill="#b42318">关闭</text>
  <text class="result" x="150" y="733">一次性 widening 确实改变报价和成交路径</text>
  <text class="metric" x="150" y="758">opener / add 两种 role 的 assignment-to-terminal value 均为负</text>
  <rect x="62" y="818" width="976" height="112" rx="11" fill="#eff8ff" stroke="#84caff" stroke-width="1.2"/>
  <text class="take-title" x="88" y="849">合并后的读法</text>
  <text class="take" x="88" y="876">• filled-only classifier 会丢掉未成交、取消和库存延续路径。</text>
  <text class="take" x="88" y="902">• 合法 action 必须从 assignment 时刻一直评价到 库存生命周期 terminal。</text>
  <text class="authority" text-anchor="middle" x="550" y="960">研究支持：lifecycle estimand / descriptive attribution · filtering action=false</text>
</svg>
