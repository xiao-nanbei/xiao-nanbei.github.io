  <rect x="74" y="130" width="310" height="66" rx="12" fill="#15364e" stroke="#5ba7d5"/>
  <text x="94" y="156" fill="#dff5ff" font-size="15" font-family="sans-serif" font-weight="700">decision-visible only</text>
  <text x="94" y="180" fill="#a9c5d7" font-size="13" font-family="sans-serif">campaign state · quote · queue · causal book/flow</text>
  <line x1="420" y1="126" x2="420" y2="378" stroke="#ffd166" stroke-width="4" stroke-dasharray="9 7"/>
  <text x="344" y="375" fill="#ffe49a" font-size="14" font-family="sans-serif" font-weight="700">decision cutoff</text>
  <circle cx="420" cy="246" r="12" fill="#ffd166"/>
