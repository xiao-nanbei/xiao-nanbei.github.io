  <text x="1126" y="306" text-anchor="middle" fill="#cfb8dc" font-size="13" font-family="sans-serif">Y = V(T) − V(decision)</text>

  <rect x="48" y="424" width="1184" height="232" rx="16" fill="#102237" stroke="#31516a"/>
  <text x="76" y="459" fill="#dff5ff" font-size="20" font-family="sans-serif" font-weight="700">Frozen Development aggregation</text>
  <rect x="76" y="484" width="260" height="126" rx="12" fill="#16364e" stroke="#4a97c8"/>
  <text x="96" y="511" fill="#dff5ff" font-size="15" font-family="sans-serif" font-weight="700">Grade A · BUY</text>
  <text x="96" y="540" fill="#a9c8da" font-size="14" font-family="sans-serif">596 decisions</text>
  <text x="96" y="568" fill="#ffb4b6" font-size="20" font-family="sans-serif" font-weight="700">−0.04272 USDC</text>
  <text x="96" y="592" fill="#d3b0b2" font-size="13" font-family="sans-serif">95% CI [−0.05342, −0.03175]</text>
  <rect x="358" y="484" width="260" height="126" rx="12" fill="#3d2935" stroke="#cf758c"/>
  <text x="378" y="511" fill="#f9e1e6" font-size="15" font-family="sans-serif" font-weight="700">Grade A · SELL</text>
  <text x="378" y="540" fill="#d7b8c0" font-size="14" font-family="sans-serif">658 decisions</text>
  <text x="378" y="568" fill="#ff9ea2" font-size="20" font-family="sans-serif" font-weight="700">−0.05564 USDC</text>
  <text x="378" y="592" fill="#d3b0b2" font-size="13" font-family="sans-serif">95% CI [−0.07047, −0.04066]</text>
  <rect x="650" y="484" width="550" height="126" rx="12" fill="#202d41" stroke="#596f88"/>
  <text x="674" y="513" fill="#dce6ef" font-size="15" font-family="sans-serif" font-weight="700">Evidence boundary</text>
  <text x="674" y="541" fill="#b6c6d5" font-size="14" font-family="sans-serif">40 / 40 Development days · 2,071 exact native decisions</text>
  <text x="674" y="568" fill="#b6c6d5" font-size="14" font-family="sans-serif">negative mean passed · local mechanism replication did not</text>
  <text x="674" y="593" fill="#ffd166" font-size="14" font-family="sans-serif">prognostic loss denominator ≠ skip-add action uplift</text>
  <rect x="76" y="674" width="1128" height="30" rx="8" fill="#162b40"/>
  <text x="640" y="695" text-anchor="middle" fill="#a8bed1" font-size="13" font-family="sans-serif">Validation / sealed holdout 未读；没有 ranking、action 或 live 权限。</text>
</svg>
