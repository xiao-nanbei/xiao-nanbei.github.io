<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">First-add decision 到 campaign terminal 的合成身份链</title>
  <desc id="desc">合成 K 线中，决策 cutoff 左侧只有因果可见特征，右侧依次出现 order、exposure-increasing add fill、inventory path 和 campaign terminal。图包含冻结 Development 聚合，非实盘行情。</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07131f"/><stop offset="1" stop-color="#1b2c46"/></linearGradient>
    <marker id="ar3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#8bd5ff"/></marker>
  </defs>
  <rect width="1280" height="720" rx="24" fill="url(#bg3)"/>
  <text x="48" y="53" fill="#f7f9ff" font-size="28" font-family="sans-serif" font-weight="700">First-Add Terminal Loss：从可见 decision 精确追到 campaign 终局</text>
  <text x="48" y="84" fill="#9eb3c8" font-size="16" font-family="sans-serif">合成机制示意 · 每个 campaign 最多一行 · future path 只用于 eligibility 与 outcome</text>
