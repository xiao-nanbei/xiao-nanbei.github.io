<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">固定局部报价动作的 K 线与报单机制</title>
  <desc id="desc">展示 baseline、widen、recenter 和 prevent-over-widen 仅改变 exposure-increasing add 报价，而 reducing quote 保持不变。</desc>
  <rect width="960" height="540" fill="#0b1120"/>
  <text x="42" y="46" fill="#f4f7ff" font-size="24" font-family="sans-serif">Fixed local quote actions：机制示意</text>
  <line x1="80" y1="405" x2="900" y2="405" stroke="#5d697f"/>
  <g stroke-width="3"><line x1="150" y1="180" x2="150" y2="345" stroke="#48d68b"/><rect x="132" y="230" width="36" height="70" fill="#48d68b"/><line x1="285" y1="150" x2="285" y2="320" stroke="#48d68b"/><rect x="267" y="195" width="36" height="72" fill="#48d68b"/><line x1="420" y1="170" x2="420" y2="360" stroke="#ff677d"/><rect x="402" y="215" width="36" height="92" fill="#ff677d"/><line x1="555" y1="200" x2="555" y2="385" stroke="#ff677d"/><rect x="537" y="245" width="36" height="88" fill="#ff677d"/><line x1="690" y1="185" x2="690" y2="350" stroke="#48d68b"/><rect x="672" y="225" width="36" height="72" fill="#48d68b"/></g>
  <line x1="405" y1="344" x2="770" y2="344" stroke="#ffd166" stroke-width="4"/><text x="780" y="350" fill="#ffe09b" font-size="16" font-family="sans-serif">reducing unchanged</text>
  <g font-family="sans-serif" font-size="15"><line x1="420" y1="375" x2="760" y2="375" stroke="#9aa7bc" stroke-width="3"/><text x="775" y="381" fill="#cdd5e2">baseline</text><line x1="420" y1="395" x2="760" y2="395" stroke="#ff8fa3" stroke-width="3"/><text x="775" y="401" fill="#ffb7c1">widen 1 tick</text><line x1="420" y1="355" x2="760" y2="355" stroke="#73b7ff" stroke-width="3"/><text x="775" y="361" fill="#b9dbff">recenter 1 tick</text></g>
  <line x1="420" y1="120" x2="420" y2="440" stroke="#ffffff" stroke-dasharray="6 6" opacity=".6"/>
  <text x="332" y="472" fill="#f4f7ff" font-size="17" font-family="sans-serif">one intervention per campaign</text>
  <rect x="72" y="78" width="245" height="82" rx="12" fill="#172238" stroke="#73b7ff"/><text x="92" y="112" fill="#d7e9ff" font-size="16" font-family="sans-serif">size / P3 / queue / latency</text><text x="92" y="140" fill="#d7e9ff" font-size="16" font-family="sans-serif">在所有 arms 冻结</text>
</svg>
