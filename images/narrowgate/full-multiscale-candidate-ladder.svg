<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="570" viewBox="0 0 1040 570" role="img" aria-labelledby="title desc">
  <title id="title">Full-Multiscale 候选层级与冻结晋级路径</title>
  <desc id="desc">候选从精确基线逐层加入 库存生命周期、EMA、方向、高阶 Boolean 和交易深度信息。E1 首层确认门失败，因此 E3 虽有 BUY 正点估计，也不能跨级成为确认成功。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#344054"/></marker>
    <style>
      .bg{fill:#fbfcfe}.base{fill:#eff8ff;stroke:#175cd3;stroke-width:1.3}.enh{fill:#f4f3ff;stroke:#6941c6;stroke-width:1.3}.best{fill:#fff7ed;stroke:#b54708;stroke-width:2}.locked{fill:#f2f4f7;stroke:#98a2b3;stroke-width:1.3}.control{fill:#ecfdf3;stroke:#027a48;stroke-width:1.3}.fail{fill:#fef2f2;stroke:#b42318;stroke-width:1.5}.line{fill:none;stroke:#344054;stroke-width:1.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#667085;stroke-width:1.4;stroke-dasharray:6 5;marker-end:url(#arrow)}.title{font:500 23px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#101828}.text{font:500 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#101828}.small{font:400 12px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475467}.mono{font:400 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#344054}.red{fill:#b42318}.amber{fill:#b54708}
    </style>
  </defs>
  <rect class="bg" width="1040" height="570"/>
  <text class="title" x="36" y="42">不是把最漂亮的 winner 直接拿来，而是逐层证明“新增信息有价值”</text>

  <rect class="base" x="40" y="92" width="205" height="76" rx="8"/><text class="text" x="58" y="120">B0_CURRENT_EXACT</text><text class="small" x="58" y="146">逐行精确 owner baseline</text>
  <rect class="base" x="286" y="92" width="205" height="76" rx="8"/><text class="text" x="304" y="120">B1_INVENTORY_LIFECYCLE_AGE</text><text class="small" x="304" y="146">只增加 库存生命周期 age</text>
  <rect class="base" x="532" y="92" width="205" height="76" rx="8"/><text class="text" x="550" y="120">B2_PLUS_H16_H256</text><text class="small" x="550" y="146">再加长尺度 cross recency</text>
  <rect class="base" x="778" y="92" width="222" height="76" rx="8"/><text class="text" x="796" y="120">B3_SEMANTIC_EQUIV.</text><text class="small" x="796" y="146">统一三值与 readiness 语义</text>
  <path class="line" d="M245 130H286"/><path class="line" d="M491 130H532"/><path class="line" d="M737 130H778"/>

  <rect class="enh" x="40" y="242" width="205" height="84" rx="8"/><text class="text" x="58" y="271">E1_FULL_EMA_BANK</text><text class="small" x="58" y="296">10 half-lives / 45 pairs</text>
  <rect class="enh" x="286" y="242" width="205" height="84" rx="8"/><text class="text" x="304" y="271">E2_DIRECTIONAL</text><text class="small" x="304" y="296">age / slope / dynamics</text>
  <rect class="best" x="532" y="242" width="205" height="84" rx="8"/><text class="text" x="550" y="271">E3_HIGHER_ORDER</text><text class="small" x="550" y="296">BUY 最强正点估计</text>
  <rect class="locked" x="778" y="242" width="222" height="84" rx="8"/><text class="text" x="796" y="271">M2_TRUE_INCREMENTAL</text><text class="small" x="796" y="296">最后才加 trade / depth</text>
  <path class="line" d="M889 168V204H142V242"/><path class="line" d="M245 284H286"/><path class="line" d="M491 284H532"/><path class="line" d="M737 284H778"/>

  <rect class="fail" x="40" y="362" width="451" height="82" rx="8"/>
  <text class="text red" x="60" y="391">冻结门槛在 E1 → B0 就失败</text>
  <text class="small" x="60" y="417">基础 full-EMA block 未先建立 confirmatory increment，</text><text class="small" x="60" y="436">后层 winner 不能跨级补票。</text>
  <path class="dash" d="M142 326V362"/>

  <rect class="control" x="549" y="362" width="451" height="82" rx="8"/>
  <text class="text" x="569" y="391">ACTION_MATCHED_CONTROLS</text>
  <text class="small" x="569" y="417">匹配 action rate 与 duration distribution，检验收益是否</text><text class="small" x="569" y="436">只是“少成交”，还是状态选择本身可能有增量。</text>
  <path class="dash" d="M634 326V362"/>

  <rect class="fail" x="250" y="486" width="540" height="50" rx="8"/>
  <text class="text" text-anchor="middle" x="520" y="516">最终：BUY 有 hypothesis；BUY / SELL 都没有 supported side</text>
</svg>
