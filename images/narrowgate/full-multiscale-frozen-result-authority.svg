<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1100" viewBox="0 0 1100 1100" role="img" aria-labelledby="title desc">
  <title id="title">Full-Multiscale 冻结公开结果与研究权限边界</title>
  <desc id="desc">左图显示精确基线和 BUY E3 的终局日价值都为负，E3 只是相对少亏。右图显示 E3 相对基线与相对动作匹配控制的点估计为正，但日级同时区间均跨零。下方权限链停在历史 Development OOF 的 hard-gate failure，未生成 final refit，Validation 和 sealed holdout 未读，supported_sides 为空，没有研究支持的 action 或 live authority。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#344054"/></marker>
    <marker id="blocked-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b42318"/></marker>
    <style>
      .bg{fill:#fbfcfe}.frame{fill:#fff;stroke:#d0d5dd;stroke-width:1.2}.grid{stroke:#eaecf0;stroke-width:1}.axis{stroke:#667085;stroke-width:1.2}.zero{stroke:#b42318;stroke-width:1.8;stroke-dasharray:6 5}.b0bar{fill:#fee4e2}.e3bar{fill:#fef0c7}.gross{stroke:#175cd3;stroke-width:4}.semantic{stroke:#6941c6;stroke-width:4}.cap{stroke-width:2}.grossdot{fill:#175cd3}.semanticdot{fill:#6941c6}.dev{fill:#eff8ff;stroke:#175cd3;stroke-width:1.3}.fail{fill:#fef2f2;stroke:#b42318;stroke-width:1.4}.locked{fill:#f2f4f7;stroke:#98a2b3;stroke-width:1.2}.none{fill:#fef2f2;stroke:#b42318;stroke-width:1.4}.line{fill:none;stroke:#344054;stroke-width:1.5;marker-end:url(#arrow)}.blocked{fill:none;stroke:#b42318;stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#blocked-arrow)}.note{fill:#fff7ed;stroke:#b54708;stroke-width:1.2}.title{font:500 23px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#101828}.text{font:500 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#101828}.small{font:400 12px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475467}.tiny{font:400 11px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#667085}.mono{font:400 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#344054}.red{fill:#b42318}.blue{fill:#175cd3}.purple{fill:#6941c6}.amber{fill:#b54708}
    </style>
  </defs>
  <rect class="bg" width="1100" height="1100"/>
  <text class="title" x="36" y="42">“相对 +0.458577”不等于盈利，也不等于研究通过</text>
  <text class="small" x="36" y="68">冻结公开结果 · 30 日 family-specific historical Development · 20 个 OOF 测试日；单位均为 USDC/day。</text>

  <!-- Absolute terminal values -->
  <rect class="frame" x="44" y="98" width="500" height="322" rx="7"/>
  <text class="text" x="66" y="128">A. 绝对 terminal value：两者仍都小于 0</text>
  <text class="small" x="66" y="150">横条从负值延伸到 0；条越短，亏损点估计越小。</text>
  <line class="grid" x1="112" y1="168" x2="112" y2="342"/><line class="grid" x1="240" y1="168" x2="240" y2="342"/><line class="grid" x1="368" y1="168" x2="368" y2="342"/><line class="zero" x1="496" y1="168" x2="496" y2="342"/>
  <text class="small" text-anchor="end" x="100" y="213">Exact B0</text>
  <rect class="b0bar" x="149" y="187" width="347" height="38"/>
  <text class="mono red" x="159" y="211">−2.904117</text>
  <text class="small" text-anchor="end" x="100" y="283">BUY E3</text>
  <rect class="e3bar" x="203" y="257" width="293" height="38"/>
  <text class="mono amber" x="213" y="281">−2.445540</text>
  <path class="line" d="M149 318H203"/>
  <text class="mono blue" x="214" y="322">相对改善 +0.458577</text>
  <line class="axis" x1="112" y1="342" x2="496" y2="342"/>
  <text class="tiny" text-anchor="middle" x="112" y="362">−3</text><text class="tiny" text-anchor="middle" x="240" y="362">−2</text><text class="tiny" text-anchor="middle" x="368" y="362">−1</text><text class="tiny red" text-anchor="middle" x="496" y="362">0</text>
  <rect class="note" x="66" y="374" width="456" height="28" rx="5"/>
  <text class="small" text-anchor="middle" x="294" y="393">候选是“少亏约 0.4586/day”，不是“赚 0.4586/day”。</text>

  <!-- Relative estimates and intervals -->
  <rect class="frame" x="566" y="98" width="490" height="322" rx="7"/>
  <text class="text" x="588" y="128">B. 日级 simultaneous intervals：两个都跨 0</text>
  <text class="small" x="588" y="150">圆点 = 点估计；横线 = 冻结 primary day-level simultaneous interval。</text>
  <line class="grid" x1="612" y1="168" x2="612" y2="340"/><line class="zero" x1="761" y1="168" x2="761" y2="340"/><line class="grid" x1="910" y1="168" x2="910" y2="340"/><line class="grid" x1="1022" y1="168" x2="1022" y2="340"/>
  <text class="small" x="588" y="199">E3 − B0</text>
  <line class="gross" x1="696" y1="224" x2="1005" y2="224"/><line class="gross cap" x1="696" y1="212" x2="696" y2="236"/><line class="gross cap" x1="1005" y1="212" x2="1005" y2="236"/><circle class="grossdot" cx="850" cy="224" r="7"/>
  <text class="mono blue" x="861" y="210">+0.458577</text>
  <text class="small" x="588" y="271">E3 − action-matched</text>
  <line class="semantic" x1="628" y1="296" x2="975" y2="296"/><line class="semantic cap" x1="628" y1="284" x2="628" y2="308"/><line class="semantic cap" x1="975" y1="284" x2="975" y2="308"/><circle class="semanticdot" cx="798" cy="296" r="7"/>
  <text class="mono purple" x="809" y="282">+0.193888</text>
  <line class="axis" x1="612" y1="340" x2="1022" y2="340"/>
  <text class="tiny" text-anchor="middle" x="612" y="360">−0.8</text><text class="tiny red" text-anchor="middle" x="761" y="360">0</text><text class="tiny" text-anchor="middle" x="910" y="360">+0.8</text><text class="tiny" text-anchor="middle" x="1022" y="360">+1.4</text>
  <text class="mono" x="588" y="389">0.458577 − 0.264689 = 0.193888</text>
  <text class="tiny" x="588" y="406">Action-matched 排除“纯粹少成交”的充分解释；区间跨零，所以未确认状态语义因果增量。</text>

  <text class="text" x="44" y="462">C. 证据权限停在哪里：hard gate 不能被好看的均值补偿</text>
  <rect class="dev" x="44" y="490" width="184" height="86" rx="8"/>
  <text class="text" text-anchor="middle" x="136" y="520">Historical Development</text><text class="small" text-anchor="middle" x="136" y="545">learning-algorithm OOF</text><text class="tiny" text-anchor="middle" x="136" y="563">30 日 / 4 folds / 20 test days</text>
  <path class="line" d="M228 533H252"/>
  <rect class="fail" x="252" y="490" width="168" height="86" rx="8"/>
  <text class="text red" text-anchor="middle" x="336" y="520">Hard gate failed</text><text class="small" text-anchor="middle" x="336" y="545">day interval · hierarchy</text><text class="tiny" text-anchor="middle" x="336" y="563">tail · lifecycle</text>
  <path class="blocked" d="M420 533H444"/>
  <rect class="locked" x="444" y="490" width="156" height="86" rx="8"/>
  <text class="text" text-anchor="middle" x="522" y="520">No final refit</text><text class="small" text-anchor="middle" x="522" y="545">没有 exact final</text><text class="tiny" text-anchor="middle" x="522" y="563">policy artifact</text>
  <path class="blocked" d="M600 533H624"/>
  <rect class="locked" x="624" y="490" width="190" height="86" rx="8"/>
  <text class="text" text-anchor="middle" x="719" y="520">Validation / holdout</text><text class="small" text-anchor="middle" x="719" y="545">均未读取</text><text class="tiny" text-anchor="middle" x="719" y="563">不能用来“救” Development</text>
  <path class="blocked" d="M814 533H838"/>
  <rect class="none" x="838" y="490" width="218" height="86" rx="8"/>
  <text class="text red" text-anchor="middle" x="947" y="520">supported_sides=[]</text><text class="small" text-anchor="middle" x="947" y="545">no research action</text><text class="tiny" text-anchor="middle" x="947" y="563">no live authority</text>

  <rect class="note" x="44" y="610" width="1012" height="62" rx="7"/>
  <text class="text" x="66" y="637">最准确的读法</text>
  <text class="small" x="66" y="659">BUY E3 是值得保留的 Development hypothesis；它不是盈利证据、不是稳定因果确认，也不是研究支持的 action / live 授权。未来确认必须使用新冻结的独立 evidence identity。</text>
  <text class="text" x="44" y="730">D. 这份 Development 证据可以说什么、不能说什么</text>
  <rect class="dev" x="44" y="756" width="492" height="246" rx="8"/>
  <text class="text blue" x="68" y="788">可以保留的结论</text>
  <text class="small" x="68" y="824">✓ BUY E3 有经济量级不小的正点估计</text>
  <text class="small" x="68" y="858">✓ 四个 outer-fold 均值为正，fills 保留 97.29%</text>
  <text class="small" x="68" y="892">✓ 超过 action-matched control 的点估计为 +0.193888</text>
  <text class="small" x="68" y="926">✓ “纯粹少成交”不足以完整解释 headline</text>
  <text class="small" x="68" y="960">✓ 值得冻结为未来独立确认的 hypothesis</text>
  <text class="tiny" x="68" y="985">这些都是 Development 信号，不扩张 evidence authority。</text>

  <rect class="fail" x="564" y="756" width="492" height="246" rx="8"/>
  <text class="text red" x="588" y="788">不能扩张出的结论</text>
  <text class="small" x="588" y="824">× 候选已经盈利（绝对 terminal value 仍为负）</text>
  <text class="small" x="588" y="858">× 状态语义增量已经稳定大于 0</text>
  <text class="small" x="588" y="892">× Full-Multiscale 表示已通过冻结 hierarchy</text>
  <text class="small" x="588" y="926">× 已获得 Validation / sealed-holdout 证据</text>
  <text class="small" x="588" y="960">× 已获得 research-supported action 或 live authority</text>
  <text class="tiny" x="588" y="985">Owner operational override 若存在，也是另一条权限来源。</text>

  <rect class="note" x="156" y="1024" width="788" height="46" rx="7"/>
  <text class="small" text-anchor="middle" x="550" y="1044">未来确认：先冻结 exact E3 hypothesis 与统计合同，再使用不同于这 30 日 Development 的新 evidence identity。</text>
  <text class="tiny" text-anchor="middle" x="550" y="1061">不能回到已读 Development 上缩规则、换 primary block、改 hierarchy 或调 action rate。</text>
  <text class="tiny" x="36" y="1090">冻结公开结果；精确 OOF rows 与 owner artifacts 未公开，因此公众可审计“不晋级原因”，不能独立复算或扩张权限。</text>
</svg>
