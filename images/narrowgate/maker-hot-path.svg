<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">行情更新 ≠ 模型更新 ≠ 目标报价生成 ≠ 下单</title>
<desc id="desc">所选协议更新市场状态与模型；所选 RQ 时钟或单侧终态续接触发目标。目标形成后经更新资格和订单生命周期进入 REST FIFO；native 和 E/C 是条件能力而不是全部 live 必经路径。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#344054"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#101828}.box{fill:#eff8ff;stroke:#175cd3;stroke-width:1.5}.sub{font-size:16px;fill:#475467}.h{font-size:20px;font-weight:700}.line{stroke:#344054;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1200" height="650" fill="#fbfcfe"/>
<text x="36" y="48" font-size="26" font-weight="700">行情更新 ≠ 模型更新 ≠ 目标报价生成 ≠ 下单</text>
<rect class="box" x="36" y="90" width="350" height="136" rx="12"/>
<text class="h" x="56" y="128">所选行情协议 → 市场状态</text>
<text class="sub" x="56" y="166">individual trade / aggTrade 按合同区分</text>
<text class="sub" x="56" y="196">不能任意互换或虚构子成交</text>
<path class="line" d="M398 158H434"/>
<rect class="box" x="450" y="90" width="330" height="136" rx="12"/>
<text class="h" x="470" y="128">特征 ready → 模型更新</text>
<text class="sub" x="470" y="166">依实际窗口和消费合同</text>
<text class="sub" x="470" y="196">不等于每个行情事件刷新预测</text>
<rect class="box" x="834" y="90" width="330" height="136" rx="12"/>
<text class="h" x="854" y="128">报价触发入口</text>
<text class="sub" x="854" y="166">选定 RQ 时钟</text>
<text class="sub" x="854" y="196">已安排的单侧终态续接</text>
<path class="line" d="M614 238V269H240V292"/><path class="line" d="M1000 238V278H258V292"/>
<rect class="box" x="36" y="306" width="390" height="136" rx="12"/>
<text class="h" x="56" y="344">目标报价生成与最终价格约束</text>
<text class="sub" x="56" y="382">合法新目标 ≠ 已提交订单</text>
<text class="sub" x="56" y="412">计算阶段时间与请求时间分开</text>
<path class="line" d="M438 374H474"/>
<rect class="box" x="490" y="306" width="330" height="136" rx="12"/>
<text class="h" x="510" y="344">更新资格 / 订单生命周期</text>
<text class="sub" x="510" y="382">价格与时间门槛、pending、风险</text>
<text class="sub" x="510" y="412">旧单保留 / 替换 / 终态处理</text>
<path class="line" d="M832 374H868"/>
<rect class="box" x="884" y="306" width="280" height="136" rx="12"/>
<text class="h" x="904" y="344">REST FIFO / 网关</text>
<text class="sub" x="904" y="382">请求 → 经济生效</text>
<text class="sub" x="904" y="412">本机可见 / 返回分开</text>
<rect class="box" x="36" y="510" width="545" height="105" rx="12"/>
<text class="h" x="56" y="548">native：按已验收能力与实际入口选择</text>
<text class="sub" x="56" y="586">Python 回放的 native level 校验 ≠ 整条 C++ 报价链</text>
<rect class="box" x="610" y="510" width="554" height="105" rx="12"/>
<text class="h" x="630" y="548">E/C、quote-EV：可选研究接口</text>
<text class="sub" x="630" y="586">不是当前 live 每次必经的已采用价值门</text>
<text class="sub" x="36" y="644">机制示意，不是当前部署验收；不包含尚在讨论的新事件驱动 update 方案。</text>
</svg>
