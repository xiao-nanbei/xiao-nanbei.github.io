<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">P3 normalized 100ms 重校准曲线</title>
  <desc id="desc">冻结聚合结果示意图。旧mixed BBO与normalized 100ms曲线几乎重合，十秒delta star相同，effective kappa变化约负0.121%。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#172554"/></linearGradient><style>.t{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#eef6ff}.m{fill:#a9bad0}.grid{stroke:#2c4966;stroke-width:1}.o{stroke:#ffb84d}.n{stroke:#55d6be}.big{font-size:28px;font-weight:700}.label{font-size:17px}.small{font-size:14px}</style></defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <text x="54" y="54" class="t big">Normalized 100ms：曲线身份更新，形状几乎不变</text>
  <text x="54" y="82" class="m small">冻结聚合结果 · P(touch) 不是 P(fill)</text>
  <g transform="translate(90 120)">
    <rect width="730" height="390" rx="14" fill="#0a1d33" stroke="#365873"/>
    <path d="M70 30V330H690M70 90H690M70 150H690M70 210H690M70 270H690" class="grid"/>
    <text x="300" y="375" class="m label">距离 d（USDC/BTC）</text><text x="-255" y="25" transform="rotate(-90)" class="m label">10 秒触达概率</text>
    <path d="M70 54 C150 80 210 109 275 145 C350 187 425 226 510 266 C580 298 635 318 690 328" fill="none" class="o" stroke-width="6" opacity="0.8"/>
    <path d="M70 56 C150 81 210 111 275 146 C350 188 425 225 510 267 C580 297 635 319 690 329" fill="none" class="n" stroke-width="3"/>
    <line x1="286" y1="35" x2="286" y2="330" stroke="#d7e3f4" stroke-dasharray="7 7"/>
    <text x="300" y="62" class="t small">delta star = 13.999086（两者相同）</text>
    <circle cx="286" cy="151" r="7" fill="#ffb84d"/><circle cx="286" cy="152" r="4" fill="#55d6be"/>
  </g>
  <g transform="translate(855 128)">
    <rect width="290" height="102" rx="14" fill="#0a1d33" stroke="#365873"/><line x1="20" y1="32" x2="76" y2="32" class="o" stroke-width="6"/><text x="90" y="38" class="t label">Mixed BBO v1</text><line x1="20" y1="70" x2="76" y2="70" class="n" stroke-width="4"/><text x="90" y="76" class="t label">Normalized 100ms v2</text>
    <rect y="132" width="290" height="238" rx="14" fill="#0a1d33" stroke="#365873"/>
    <text x="20" y="168" class="t label">冻结数字</text>
    <text x="20" y="204" class="m small">10s kappa_eff</text><text x="20" y="230" class="t label">0.06743811 → 0.06735643</text>
    <text x="20" y="266" class="m small">相对变化</text><text x="20" y="292" class="t label">-0.121%</text>
    <text x="20" y="328" class="m small">日/side rate correlation</text><text x="20" y="354" class="t label">≥ 0.99995</text>
  </g>
  <rect x="90" y="540" width="1055" height="45" rx="12" fill="#102a43"/><text x="112" y="568" class="t label">结论：输入 identity 被纠正；该研究不证明 queue、fill、库存生命周期 或 action value。</text>
</svg>
