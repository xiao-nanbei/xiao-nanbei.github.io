<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet">
  <title>Ranked toxicity exposure guard 的 ACK 与 carryover-safe 状态机</title>
  <desc>机制示意：过去日期的 completed 10-second score 构造 p90，crossing 后 cancel 一次，ACK 后 suppress，恢复后新订单 re-entry；下方展示 active order 跨 assignment carryover 与角色转移。</desc>
  <rect width="1200" height="720" fill="#07111f"/>
  <text x="52" y="55" fill="#f4f7fb" font-size="28" font-family="sans-serif" font-weight="700">Ranked Toxicity Guard：Score 只是入口，Order Ownership 才是路径</text><text x="52" y="84" fill="#9fb3c8" font-size="16" font-family="sans-serif">机制示意 · one-day plumbing aggregate，不含经济 outcome</text>
  <g font-family="sans-serif"><rect x="55" y="125" width="190" height="90" rx="15" fill="#102238" stroke="#42a5f5" stroke-width="2"/><text x="80" y="160" fill="#9fd8ff" font-size="18" font-weight="700">Past-only p90</text><text x="80" y="188" fill="#d6e9f7" font-size="14">completed 10s buckets</text><rect x="285" y="125" width="190" height="90" rx="15" fill="#2d2713" stroke="#f8c15c" stroke-width="2"/><text x="313" y="160" fill="#ffd17c" font-size="18" font-weight="700">P90 crossing</text><text x="313" y="188" fill="#fff0c9" font-size="14">cancel exposure once</text><rect x="515" y="125" width="190" height="90" rx="15" fill="#361b26" stroke="#ff6f7d" stroke-width="2"/><text x="540" y="160" fill="#ff9ca5" font-size="18" font-weight="700">CANCEL_PENDING</text><text x="540" y="188" fill="#f7d6da" font-size="14">旧 order 仍在 risk set</text><rect x="745" y="125" width="190" height="90" rx="15" fill="#361b26" stroke="#ff6f7d" stroke-width="2"/><text x="773" y="160" fill="#ff9ca5" font-size="18" font-weight="700">SUPPRESSING</text><text x="773" y="188" fill="#f7d6da" font-size="14">ACK 后抑制 exposure</text><rect x="975" y="125" width="170" height="90" rx="15" fill="#0d2c28" stroke="#41d69a" stroke-width="2"/><text x="1000" y="160" fill="#63deb0" font-size="18" font-weight="700">RELEASED</text><text x="1000" y="188" fill="#d5eee6" font-size="14">score &lt; p90 · new order</text></g>
  <g stroke="#657b91" stroke-width="3"><path d="M245 170H285M475 170H515M705 170H745M935 170H975"/></g><text x="694" y="112" fill="#ff9ca5" font-size="14" font-family="sans-serif">cancel ACK = hard boundary</text>
  <rect x="55" y="290" width="1090" height="170" rx="17" fill="#0e1c2d"/><text x="83" y="329" fill="#eaf2fb" font-size="19" font-family="sans-serif" font-weight="700">Carryover-safe ownership</text><path d="M90 380H1090" stroke="#42a5f5" stroke-width="5"/><circle cx="275" cy="380" r="11" fill="#42a5f5"/><circle cx="585" cy="380" r="11" fill="#f8c15c"/><circle cx="955" cy="380" r="11" fill="#41d69a"/><text x="145" y="366" fill="#9fd8ff" font-size="15" font-family="sans-serif">assignment owner A</text><text x="430" y="365" fill="#ffd17c" font-size="15" font-family="sans-serif">campaign boundary：不 washout</text><text x="762" y="365" fill="#63deb0" font-size="15" font-family="sans-serif">exchange terminal / ACK</text><text x="105" y="421" fill="#9fb3c8" font-size="15" font-family="sans-serif">同一 active order 保留 queue + owner；允许 reducing → exposure 的显式 role transition（仅仍在 fill risk set）</text>
  <rect x="55" y="510" width="1090" height="150" rx="17" fill="#0e1c2d"/><text x="83" y="548" fill="#eaf2fb" font-size="19" font-family="sans-serif" font-weight="700">冻结一日 plumbing</text><text x="83" y="582" fill="#9fb3c8" font-size="15" font-family="sans-serif">29,072 baseline rows = 29,072 candidate rows · zero unconsumed</text><text x="83" y="612" fill="#9fd8ff" font-size="15" font-family="sans-serif">BUY 337 episodes · 58 carryovers · 0 role transition</text><text x="600" y="612" fill="#ffd17c" font-size="15" font-family="sans-serif">SELL 337 episodes · 50 carryovers · 1 valid role transition</text><text x="83" y="642" fill="#ff9ca5" font-size="15" font-family="sans-serif">formal 40-day mechanics 未运行；PnL / reward / Validation / holdout 未读</text>
</svg>

