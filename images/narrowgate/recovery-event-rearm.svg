<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet">
  <title>四组件 recovery score 与 rearm 状态机</title>
  <desc>机制示意图：shock decay、refill、microprice recovery 和 queue recovery 汇入几何均值，valid score 与冻结阈值决定 block 或 rearm，底部给出 SELL 冻结聚合结果。</desc>
  <rect width="1200" height="720" fill="#07111f"/>
  <text x="52" y="55" fill="#f4f7fb" font-size="28" font-family="sans-serif" font-weight="700">Recovery event：好的描述变量，不一定是好的动作触发器</text>
  <text x="52" y="84" fill="#9fb3c8" font-size="16" font-family="sans-serif">机制示意 · score components 均为 decision-ready、past-only</text>
  <g font-family="sans-serif"><rect x="55" y="130" width="220" height="82" rx="15" fill="#102238" stroke="#42a5f5" stroke-width="2"/><text x="80" y="164" fill="#9fd8ff" font-size="18" font-weight="700">shock decay</text><text x="80" y="191" fill="#d6e9f7" font-size="15">1s / 5s / since-fill flow</text><rect x="55" y="235" width="220" height="82" rx="15" fill="#102238" stroke="#42a5f5" stroke-width="2"/><text x="80" y="269" fill="#9fd8ff" font-size="18" font-weight="700">refill recovery</text><text x="80" y="296" fill="#d6e9f7" font-size="15">相对 depleted level</text><rect x="55" y="340" width="220" height="82" rx="15" fill="#102238" stroke="#42a5f5" stroke-width="2"/><text x="80" y="374" fill="#9fd8ff" font-size="18" font-weight="700">microprice recovery</text><text x="80" y="401" fill="#d6e9f7" font-size="15">side-signed causal path</text><rect x="55" y="445" width="220" height="82" rx="15" fill="#102238" stroke="#42a5f5" stroke-width="2"/><text x="80" y="479" fill="#9fd8ff" font-size="18" font-weight="700">queue recovery</text><text x="80" y="506" fill="#d6e9f7" font-size="15">当前 / shock 前深度</text></g>
  <path d="M275 171H375M275 276H375M275 381H375M275 486H375" stroke="#657b91" stroke-width="2"/>
  <rect x="375" y="245" width="250" height="165" rx="18" fill="#2d2713" stroke="#f8c15c" stroke-width="2"/><text x="405" y="287" fill="#ffd17c" font-size="20" font-family="sans-serif" font-weight="700">几何均值</text><text x="405" y="326" fill="#fff0c9" font-size="20" font-family="serif">S = (d · r · m · q)¹ᐟ⁴</text><text x="405" y="361" fill="#fff0c9" font-size="15" font-family="sans-serif">valid path · ≥2 snapshots</text><text x="405" y="386" fill="#fff0c9" font-size="15" font-family="sans-serif">book age ≤ 2s</text>
  <path d="M625 327H700" stroke="#657b91" stroke-width="3"/>
  <rect x="700" y="160" width="205" height="130" rx="16" fill="#361b26" stroke="#ff6f7d" stroke-width="2"/><text x="727" y="198" fill="#ff9ca5" font-size="20" font-family="sans-serif" font-weight="700">S &lt; threshold</text><text x="727" y="232" fill="#f7d6da" font-size="16" font-family="sans-serif">continue block</text><text x="727" y="260" fill="#f7d6da" font-size="15" font-family="sans-serif">跳过 add cycles</text>
  <rect x="700" y="355" width="205" height="130" rx="16" fill="#0d2c28" stroke="#41d69a" stroke-width="2"/><text x="721" y="393" fill="#63deb0" font-size="19" font-family="sans-serif" font-weight="700">S ≥ threshold</text><text x="727" y="427" fill="#d5eee6" font-size="16" font-family="sans-serif">rearm baseline</text><text x="727" y="455" fill="#d5eee6" font-size="15" font-family="sans-serif">下一 causal decision</text>
  <rect x="940" y="160" width="210" height="325" rx="17" fill="#0e1c2d"/><text x="966" y="199" fill="#eaf2fb" font-size="19" font-family="sans-serif" font-weight="700">SELL 冻结聚合</text><text x="966" y="238" fill="#9fb3c8" font-size="15" font-family="sans-serif">1,644 库存生命周期</text><text x="966" y="268" fill="#9fb3c8" font-size="15" font-family="sans-serif">180 active rows</text><text x="966" y="298" fill="#9fb3c8" font-size="15" font-family="sans-serif">candidate 10.95%</text><text x="966" y="328" fill="#9fb3c8" font-size="15" font-family="sans-serif">fill retention 87.19%</text><path d="M965 352H1125" stroke="#31465b"/><text x="966" y="389" fill="#ff9ca5" font-size="16" font-family="sans-serif">reward -0.01560</text><text x="966" y="418" fill="#ff9ca5" font-size="15" font-family="sans-serif">95% CI 全部 &lt; 0</text><text x="966" y="455" fill="#f4f7fb" font-size="16" font-family="sans-serif" font-weight="700">支持通过，价值失败</text>
  <rect x="55" y="594" width="1095" height="78" rx="15" fill="#0e1c2d"/><text x="82" y="625" fill="#eaf2fb" font-size="16" font-family="sans-serif">阈值冻结只看 state / assignment / fill support，不看 reward；SELL outcome 打开后 terminal、cost、MAE 同向变差。</text><text x="82" y="651" fill="#9fb3c8" font-size="15" font-family="sans-serif">BUY：threshold 0.02147895，candidate 15.03%，conservative fill retention 87.49%；outcome panel 未开启。</text>
</svg>
