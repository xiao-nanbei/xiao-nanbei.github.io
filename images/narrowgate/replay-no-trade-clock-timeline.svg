<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">工程证据与经济证据：待验证问题</title>
  <desc id="desc">原图主题：没有 trade 的十秒里，旧 replay 与 merged causal clock 的差异。旧结果曲线、数值和通过／关闭判断已撤出。数据源、时钟或执行语义改变后，哪些经济主张仍能成立？ 当前已验收数据在对应研究报告中单独保留；本图是研究方法图，不是新实验结果。</desc>
  <rect width="1100" height="520" fill="#f5f7fb"/>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="48" y="60" font-size="28" fill="#18243a">工程证据与经济证据</text>
    <text x="48" y="98" font-size="17" fill="#50617a">待验证假设 · 旧结果不作当前结论 · 方法图而非收益曲线</text>
    <rect x="48" y="130" width="1004" height="100" rx="14" fill="#e7eefc"/>
    <text x="70" y="170" font-size="21" fill="#183b73">数据源、时钟或执行语义改变后，哪些经济主张仍能成立？</text>
    <rect x="48" y="266" width="320" height="110" rx="12" fill="white" stroke="#cbd5e4"/><text x="68" y="303" font-size="20" fill="#18243a">01 绑定问题</text><text x="68" y="342" font-size="17" fill="#50617a">源、模型、B0 与历史使用</text>
    <rect x="390" y="266" width="320" height="110" rx="12" fill="white" stroke="#cbd5e4"/><text x="410" y="303" font-size="20" fill="#18243a">02 定义比较</text><text x="410" y="342" font-size="17" fill="#50617a">可见信息、动作与风险集</text>
    <rect x="732" y="266" width="320" height="110" rx="12" fill="white" stroke="#cbd5e4"/><text x="752" y="303" font-size="20" fill="#18243a">03 验收完整路径</text><text x="752" y="342" font-size="17" fill="#50617a">总／单位净收益及库存</text>
    <text x="48" y="422" font-size="16" fill="#50617a">工程一致性与性能保留其原范围；只有匹配的新实验才能更新假设状态。</text>
    <a href="https://github.com/xiao-nanbei/NarrowGateMaker/blob/main/research/system_engineering/research_questions.json"><text x="48" y="469" font-size="16" fill="#235caa">研究族索引：SYS-ECONOMIC-TRANSFER</text></a>
  </g>
</svg>
