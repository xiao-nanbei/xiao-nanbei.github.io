<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Side-Taker Hazard M0 的事件身份混合</title>
  <desc id="desc">K 线与订单时间轴上同时标出成交、取消、价格跳变和修复，说明它们不是同质竞争终点。</desc>
  <rect width="960" height="520" fill="#0c1222"/>
  <text x="42" y="46" fill="#f5f7ff" font-size="24" font-family="sans-serif">Hazard M0：四类事件不能共享一个 first cause</text>
  <line x1="80" y1="350" x2="890" y2="350" stroke="#657086" stroke-width="2"/>
  <g><line x1="160" y1="160" x2="160" y2="320" stroke="#45d483" stroke-width="3"/><rect x="143" y="205" width="34" height="66" fill="#45d483"/><line x1="290" y1="140" x2="290" y2="300" stroke="#45d483" stroke-width="3"/><rect x="273" y="180" width="34" height="72" fill="#45d483"/><line x1="420" y1="175" x2="420" y2="340" stroke="#ff6b7d" stroke-width="3"/><rect x="403" y="215" width="34" height="80" fill="#ff6b7d"/><line x1="550" y1="210" x2="550" y2="370" stroke="#ff6b7d" stroke-width="3"/><rect x="533" y="250" width="34" height="74" fill="#ff6b7d"/><line x1="680" y1="190" x2="680" y2="345" stroke="#45d483" stroke-width="3"/><rect x="663" y="228" width="34" height="68" fill="#45d483"/></g>
  <circle cx="210" cy="350" r="9" fill="#73b7ff"/><text x="175" y="392" fill="#dce8ff" font-size="16" font-family="sans-serif">activation</text>
  <circle cx="360" cy="350" r="9" fill="#ffd166"/><text x="335" y="422" fill="#ffd166" font-size="16" font-family="sans-serif">jump：state</text>
  <circle cx="500" cy="350" r="9" fill="#ff8fa3"/><text x="465" y="392" fill="#ffb2bf" font-size="16" font-family="sans-serif">cancel request</text>
  <circle cx="610" cy="350" r="9" fill="#ff5d73"/><text x="585" y="422" fill="#ff9aac" font-size="16" font-family="sans-serif">cancel ACK</text>
  <circle cx="780" cy="350" r="9" fill="#45d483"/><text x="750" y="392" fill="#85efb0" font-size="16" font-family="sans-serif">repair entry</text>
  <path d="M210 110 H610" stroke="#73b7ff" stroke-width="8"/><text x="305" y="96" fill="#a8d2ff" font-size="17" font-family="sans-serif">fill risk set</text>
  <path d="M780 455 H875" stroke="#45d483" stroke-width="8"/><text x="715" y="490" fill="#85efb0" font-size="17" font-family="sans-serif">delayed repair risk</text>
</svg>
